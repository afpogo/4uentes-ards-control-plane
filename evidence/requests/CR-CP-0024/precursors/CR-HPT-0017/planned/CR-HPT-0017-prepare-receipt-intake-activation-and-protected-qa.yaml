activation_invariants:
  - "The same dedicated credential is injected only into Auth verifier and Automation caller custody surfaces."
  - "The secret value never enters Git, Jira, Evidence, workflow JSON, logs or prompts."
  - "Automation obtains a short-lived token from Auth and sends it only to SST."
  - "SST validates RS256/JWKS, issuer, audience, subject, client_id, token_use, exact scope and TTL."
  - "The Automation token is never forwarded to Phinance."
  - "Rollback disables the caller or verifier without deleting persistent data."

implementation_plan:
  - "Record current Auth, SST and Automation deployability and working-tree constraints."
  - "Select the custody mechanism separately for local development and future managed environments."
  - "Define a promotion manifest with artifact, configuration, health, negative tests and rollback gates."
  - "Define a sanitized protected-QA sequence that creates no durable token evidence."
  - "Identify the minimum follow-up owner request required to implement the SST recipient before provisioning."
  - "Run full control-plane validation."

