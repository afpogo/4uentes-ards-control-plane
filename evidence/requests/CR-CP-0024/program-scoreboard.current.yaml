calculation:
  method: "fixed-point-evidence-checkpoints"
  total_points: 100
  checkpoint_rule: >
    A checkpoint earns all its declared points only when the cited evidence
    proves its acceptance criteria. Pending, active and blocked checkpoints
    earn zero points; subjective fractions are prohibited.
  percentage_formula: "floor(100 * earned_points / total_points)"
  denominator_change_rule: >
    Weights are immutable for this revision. Scope changes require a reviewed
    scoreboard revision and must not rewrite prior observations.
  no_action_rule: >
    A planned no-action outcome earns points only when evidence proves the
    disposition; it is not removed from the denominator.

