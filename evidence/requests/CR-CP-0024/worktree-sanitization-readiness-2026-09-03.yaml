    Apply the existing policy, keep clean worktrees ready for new features and
    retire the temporary remediation control after historical branches are
    sanitized.

remediation_control:
  status: "active"
  nature: "request-scoped-operational-control"
  base_policy_status: "active-and-durable"
  dissolution_semantics: >
    Fulfil and close this remediation control after every historical checkout
    has a verified disposition. Do not deprecate or remove the base policy.
  exit_conditions:
    - "every dirty checkout has no unique information only on disk"
    - "every local-only commit is published, integrated, superseded or explicitly preserved"
    - "every generated artifact removal has an exact authorized allowlist"
    - "every retired worktree is clean, unused and reachable from a canonical or preservation ref"
    - "canonical refs and terminal request evidence have remote readback"

feature_baselines:
  root: "C:/Users/andre/Desktop/4uentes/apps/worktrees/current"
  usage_rule: >
    Treat each detached checkout as a verified seed. A feature gets its own
    request-scoped branch and worktree from the refreshed remote canonical ref;
    concurrent features never share the seed checkout.
