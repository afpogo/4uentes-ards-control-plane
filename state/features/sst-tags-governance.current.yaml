open_gaps:
  - "CR-SST-0071 ya formalizo el modelo global de tags, la unicidad de `TagValue` por `accountId + definitionKey + slug`, la separacion entre `scope` y `resourceType`, y el mapeo legacy hacia `tag_definitions`, `tag_values` y `tag_occurrences`."
  - "CR-SST-0073 y CR-SST-0074 deben exponer busqueda, create explicito, attach or detach y fachada auth/BFF para tags gobernados con `resourceType` y `resourceId`."
  - "CR-SST-0075 migra Articulos a selector o autocomplete gobernado y exige creacion explicita de nuevos valores."
  - "CR-SST-0076 completa adopcion en Diccionario y cierra SST-4 dejando `learning-content` y `bitacora` como scopes reservados."
