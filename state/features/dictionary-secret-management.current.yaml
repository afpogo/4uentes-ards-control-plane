open_gaps:
  - "Development kind runtime now has SST_DICTIONARY_SECRETS_MASTER_KEY injected and validated, but GitHub Actions automation for reprovisioning Kubernetes Secrets is not implemented under the current manual-local-k8s-secrets policy."
  - "During cluster injection, an obsolete master key was exposed through kubectl jsonpath debug output; it was rotated immediately. Records encrypted with the old key cannot be revealed or copied with the active key. If the plaintext is known from an authoritative runtime source, the supported local recovery path is manual rotation of that DictionarySecret record; otherwise the old plaintext is unrecoverable without the exact previous key."
  - "Chrome MCP clipboard read is blocked by browser timeout/permissions in the 2026-06-28 rerun; UI copy was exercised, but clipboard content was not independently read back."
  - "sst-extension integration is deferred outside v1."
  - "CredentialedWebSource is documented as a future DictionarySecret use case; sst-extension session capture must be fixed before multi-tab private web captures are treated as reliable LearningWorkspace inputs."
  - "seed_phrase and equivalent high-risk recovery material remain unsupported in v1."
  - "Jira issue key reconciliation and any write-gated comment/transition still require explicit approval."
