governed_states:
  - "unencrypted-observed"
  - "plan-published"
  - "disposable-prototype-proven"
  - "shared-migration-authorized"
  - "encrypted-with-temporary-fallback"
  - "encrypted-steady-state"
  - "rotation-and-recovery-validated"
governed_transitions:
  - from: "unencrypted-observed"
    to: "plan-published"
    gate: "CR-SST-0221 plan merged and read back"
  - from: "plan-published"
    to: "disposable-prototype-proven"
    gate: "separate infra authorization plus synthetic migration, rotation and rollback proof"
  - from: "disposable-prototype-proven"
    to: "shared-migration-authorized"
    gate: "human approval of data preservation, backup, outage and migration path"
  - from: "shared-migration-authorized"
    to: "encrypted-with-temporary-fallback"
    gate: "provider activation with identity last and bounded consumer validation"
  - from: "encrypted-with-temporary-fallback"
    to: "encrypted-steady-state"
    gate: "all Secrets rewritten, raw storage prefix verified and identity removed"
  - from: "encrypted-steady-state"
    to: "rotation-and-recovery-validated"
    gate: "new-key rewrite, rollback window and recovery drill pass"
blocking_conditions:
  - "No approved human key custodian and independent encrypted recovery copy."
  - "Persistent development data is unclassified or lacks an approved restore path."
  - "Disposable-cluster migration or rollback proof fails."
  - "Verification would expose Secret values, raw payloads or key material."
  - "Any affected deployment or Argo application is unhealthy after a bounded wave."
open_gaps:
  - "The disposable infrastructure prototype is authorized by CR-SST-0221 but remains pending owner implementation and proof."
  - "The shared cluster has not been migrated and identity fallback has not been introduced."
  - "SOPS, Sealed Secrets and External Secrets remain an explicit later decision."
  - "No Jira write is authorized; SST-89 remains the initiative mirror."
