rules:
  - "knowledge-to-execution-documentation-policy is a local durable policy; Infra adoption is proven by CR-CP-0027, while the CR-CP-0028 handoff does not authorize Core owner mutation."
  - "visual-documentation-as-code-policy is locally adopted from canonical Core develop; child rollout remains request-driven and requires an owner manifest."
  - "Policies are first-class ARDS/SDD governance components."
  - "Policies do not replace capabilities; they constrain or validate capabilities, states, requests, repos, and profiles."
  - "core-general policies apply broadly unless a repo records a scoped exception."
  - "core-profile-scoped policies apply only to declared profiles, applicability rules, or adopting manifests."
  - "Repo-local aliases such as orchestrator_link may coexist with canonical metadata such as control_plane_link when the mapping is documented."
  - "Child repo rollout must use either policy_adoption_manifest or policy_exception_manifest inside an approved request lifecycle."
  - "Child repo implementation CRs must update owner repo ARDS/SDD documentation or record an explicit exception before closure."
