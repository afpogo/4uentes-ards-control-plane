owner_slice_contract:
  repository: "afpogo/4uentes-automation"
  base_ref: "origin/main"
  base_sha_observed: "32055ab77f0c1b898eb77a6fe232b965c54f137d"
  worktree_policy: "clean request-scoped owner worktree from refreshed origin/main"
  secret_directory: ".secrets"
  generated_secret_files:
    - "n8n_encryption_key"
    - "postgres_password"
    - "pgadmin_default_password"
    - "productivity_db_password"
  secret_generation_rules:
    - "Use a cryptographically secure random number generator."
    - "Never print generated values."
    - "Fail before mutation when any target file already exists."
    - "Create files without a trailing newline and restrict local permissions."
    - "Validation may generate only ephemeral synthetic material under an isolated temporary directory."
  port_contract:
    n8n: "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    pgadmin: "127.0.0.1:${N8N_PGADMIN_HOST_PORT:-5050}:80"
  compose_secret_contract:
    - "Grant each file-backed secret only to services that consume it."
    - "Use POSTGRES_PASSWORD_FILE and DB_POSTGRESDB_PASSWORD_FILE where supported."
    - "Load N8N_ENCRYPTION_KEY inside the n8n container through the owner-controlled entrypoint adapter."
    - "Do not wire PRODUCTIVITY_DB_PASSWORD to a consumer that does not yet own a contract."
  allowed_commands:
    - "read-only owner discovery that excludes .env, .secrets, workflows and persistent data"
    - "PowerShell bootstrap validation with an isolated temporary output directory"
    - "docker compose config with synthetic temporary secret files"
    - "owner scripts/check.ps1 when its inspected behavior remains static and secret-safe"
    - "git diff --check, exact-path diff review and secret-pattern scan"
  prohibited_actions:
    - "read or copy existing .env or .secrets content"
    - "overwrite or rotate any existing secret"
    - "inspect workflow exports, credential identifiers or persistent data directories"
    - "start, stop, restart or rebuild containers"
    - "connect to or mutate databases"
    - "publish runtime, capability or M2M readiness"
    - "write Jira or mutate Kubernetes, GitOps or infrastructure"

