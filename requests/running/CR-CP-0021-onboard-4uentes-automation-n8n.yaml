postgres_n8n_role_password_rotation_gate:
  status: "completed-and-verified"
  repository: "afpogo/4uentes-automation"
  database_scope:
    compose_service: "postgres"
    connection: "container-local-unix-socket"
    database_role: "current POSTGRES_USER; observed runtime role n8n"
    allowed_statement: "ALTER ROLE current_user PASSWORD <file-backed-secret>"
    secret_source: "/run/secrets/postgres_password"
  execution_rules:
    - "start only the postgres Compose service before rotation"
    - "read the mounted secret inside PostgreSQL; never place it in host or process arguments"
    - "capture and suppress raw command output; publish status only"
    - "do not query schemas, tables, rows, other roles or password hashes"
    - "after success, start the base stack without tunnel and run Runtime checks"
  preconditions:
    - "Automation Compose has no active services before the gate"
    - "LocalStackOnly passes and postgres secret exists with private custody"
    - "postgres reaches healthy using the existing data directory"
  stop_conditions:
    - "postgres does not reach healthy"
    - "the mounted secret cannot be read by the database server"
    - "the exact ALTER ROLE command fails"
    - "n8n or pgAdmin readiness fails after rotation"
  rollback_or_compensation:
    reversible_to_historical_password: false
    reason: "the historical PostgreSQL role password is not recoverable from postgres_data"
    compensation: >
      Keep the role aligned with the existing file-backed secret. If later
      runtime validation fails, stop Compose without -v and preserve all data
      and secret custody for diagnosis.
  forbidden_actions:
    - "print, export, log or pass the postgres password in command arguments"
    - "inspect or mutate database content, schemas, workflows or credentials"
    - "change any role other than the current configured n8n role"
    - "delete data, volumes, .env, .secrets or rollback custody"
    - "use a tunnel or modify SST, Jira, Kubernetes, GitOps or infrastructure"
  result:
    authorization_pull_request: "https://github.com/afpogo/4uentes-ards-control-plane/pull/265"
    authorization_main_readback_sha: "fae07a4ade874c47eac8bfa8809f3b8612ac761e"
    postgres_started_alone_before_rotation: true
    postgres_health_before_rotation: "healthy"
    rotated_role_scope: "current configured n8n role only"
    password_read_inside_postgres: true
    secret_in_host_or_process_arguments: false
    raw_rotation_output_suppressed: true
    rotation_completed: true
    base_stack_started_without_tunnel: true
    runtime_check: "passed"
    postgres_health_after_rotation: "healthy"
    n8n_health_endpoint: "passed"
    pgadmin_loopback_http_on_5060: "passed"
    runtime_disposition: "running"
    database_content_or_workflows_accessed: false
    secret_values_printed_or_recorded: false

