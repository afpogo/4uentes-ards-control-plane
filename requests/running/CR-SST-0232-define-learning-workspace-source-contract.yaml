acceptance:
  - "One discriminated descriptor covers all four V1 source kinds without granting authorization."
  - "Persisted sources are resolved server-side under reconstructed principal scope."
  - "Every successful resolution creates one immutable versioned and hashed source snapshot."
  - "Current manual text remains compatible through a bounded transition adapter."
  - "Learning annotations occur after resolution and remain separate from ArticleTag and memory classification."
  - "Accepting LearningContext cannot create or accept UserMemory."
  - "Secret values and credentialed source acquisition remain outside V1."
  - "No child repository, Jira, runtime, migration, deployment or product-data mutation occurs."

