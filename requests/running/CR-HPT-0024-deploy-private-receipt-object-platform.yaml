clamav_memory_diagnosis:
  selected_resources:
    request_memory: "3Gi"
    limit_memory: "4Gi"
  selected_ceiling_rationale: >
    ClamAV documents 3 GiB as minimum recommended RAM and recommends 3-4 GiB
    for Docker or other constrained environments. The prior 1536Mi limit was
    exceeded while FreshClam tested daily.cld; 4Gi supplies bounded reload
    headroom while 3Gi reserves schedulable capacity instead of relying on
    overcommit.
  observed_evidence:
    - "receipt-clamav last termination OOMKilled, exit 137, 23 restarts"
    - "OOM occurred during Testing database for daily.cld version 28102 to 28114"
    - "live cgroup measured 1079119872 bytes current and 1182822400 bytes peak after restart"
    - "worker allocatable memory 12248696Ki; current declared requests 2322Mi and limits 6642Mi"
  projected_worker_budget:
    request_memory: "4626Mi (approximately 38 percent of allocatable)"
    limit_memory: "9202Mi (approximately 75 percent of allocatable)"
  authority_sources:
    owner_manifest: "k8s-manifests/overlays/development/sst-bend/receipt-malware-scanner.patch.yml"
    owner_playbook: "docs/playbooks/receipt-custody-adoption.md"
    owner_runbook: "docs/runbooks/receipt-custody-development.md"
    upstream_recommendations:
      - "https://docs.clamav.net/Introduction.html"
      - "https://docs.clamav.net/faq/faq-troubleshoot.html"
  unresolved_separate_blocker: >
    FreshClam currently cannot resolve database.clamav.net and the local daily
    database is older than seven days. Socket readiness does not prove current
    signatures. The future owner PR must prove an update and reload; it must not
    close this blocker merely because the pod becomes Ready.
  non_authorization: >
    This ceiling selection does not authorize an Infra commit, pull request,
    merge, Argo CD sync, manual resource change, DNS change, Secret change or
    Jira write.
  evidence: "evidence/requests/CR-HPT-0024/clamav-memory-diagnosis-and-ceiling-2026-09-05.md"

