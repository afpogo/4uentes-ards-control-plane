contract:
  server_event: "chat:conversation:terminated"
  payload_fields: ["conversationId", "reason"]
  reason_values: ["temporary_finished", "saved_deleted"]
  delivery_scope: "authorized connected sockets already joined to conversation:<conversationId>"
  transient: true
  post_delete_replay: false
  mutation_order: ["validate ownership and state", "fence active turns", "delete authoritative state", "broadcast terminal event", "return HTTP 204"]
  negative_rule: "Validation, ownership, not-found or state-conflict responses emit no event."
  client_rule: "Reset only a matching active conversation; duplicate delivery and an already-reset initiator are idempotent."
  privacy_rule: "No content, delta, token, cookie, credential, principal or private URL in the event, logs or evidence."

