summary: >
  Backend owner PR 32 is integrated and its image is pinned in Infra. The new
  Backend pod exposed a receipt-clamav capability failure while the previous
  ready pod preserved availability. Infra PR 24 was published with green
  checks, then merged outside the agent gate and applied by Argo CD autosync.
  The CAP_CHOWN-only remediation was insufficient. Infra PR 25 replaced the
  root entrypoint, added the governed delivery plan and was merged under an
  explicit gate. Its autosync removed the permission failure but exposed a
  repeatable ClamAV OOM during signature update; the previous pod still
  preserves availability while a bounded memory remediation is gated. The
  governed program scoreboard records 46 of 100 evidence-backed points, keeps
  phase 2 at zero and contains later Portfolio and Automation documentation
  drift without treating it as retroactive authorization.

