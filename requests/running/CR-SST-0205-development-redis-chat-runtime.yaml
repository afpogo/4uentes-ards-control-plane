    connectivity required by the published chat-retention contract.
  required:
    - "Consume the Bend-owned Redis key, TTL and degradation contract without redefining it."
    - "Keep Redis private to authorized workloads and keep credentials out of Git and logs."
    - "Publish resource, health, observability, restart, outage and rollback behavior in owner specs and docs."
  excluded:
    - "sst-bend, 4uentes-auth, sst-fend or sst-extension mutation"
    - "direct kubectl apply, Argo CD sync or any other deployment action"
    - "production manifests or production data"
    - "Jira mutation"

