contract:
  bend_route: "GET /4uentes/v1/chat/conversations/:id/messages"
  auth_route: "GET /api/chat/conversations/:id/messages"
  response_header: "X-SST-Chat-History-Cache"
  allowed_values: ["hit", "miss", "bypass"]
  emission_scope: "successful 200 history responses only"
  combined_precedence: "bypass over miss over hit"
  body_or_status_change: "forbidden"
  request_scoped_observation_required: true
  mutable_global_last_outcome_forbidden: true
  postgres_authority_preserved: true
  redis_fail_open_preserved: true
  auth_behavior: "Forward exactly one valid enum only; drop absent, repeated, malformed, unknown or unrelated upstream metadata."

execution:
  control_plane_mutation_allowed: true
  child_repo_mutation_allowed: true
  child_repo_mutation_targets: ["sst-bend", "4uentes-auth"]
  child_repo_execution_order: ["sst-bend", "4uentes-auth"]
  owner_mutation_gate: "Only after this running lifecycle is merged and read back from origin/main."
  runtime_mutation_allowed: false
  deployment_allowed: false
  direct_gitops_allowed: false
  cluster_mutation_allowed: false
  production_mutation_allowed: false
  datastore_mutation_allowed: false
  schema_mutation_allowed: false
  secret_mutation_allowed: false
  jira_write_allowed: false

workspace_isolation:
  canonical_roots_eligible_for_mutation: false
  rule: "Refresh owner origin/develop after running readback and create one new clean worktree per owner; preserve dirty canonical checkouts and unrelated worktrees."
  planned_owner_bases:
    sst-bend: "refresh origin/develop; planning observation was 9faae46"
    4uentes-auth: "refresh origin/develop; planning observation was b9c38fc"
  branch_rule: "One CR-SST-0230 branch per owner; never mix Bend and Auth commits."

atomized_execution:
  - order: 1
    id: "publish-running"
    objective: "Merge and read back this lifecycle before owner mutation."
    validation: "Control-plane npm run check, PR merge and origin/main readback."
  - order: 2
    id: "implement-bend-producer"
    objective: "Produce request-scoped hit, miss or bypass without changing history body/status or cache authority."
    validation: "Focused cache, HTTP, failure and concurrency tests; owner docs/capability aligned; sst-bend npm run check."
  - order: 3
    id: "publish-bend"
    objective: "Merge Bend and read its exact contract from canonical develop before Auth adoption."
    validation: "Bend PR and owner commit are reachable from refreshed origin/develop."
  - order: 4
    id: "implement-auth-forwarder"
    objective: "Forward only one valid history outcome through the authenticated facade."
    validation: "Exact allowlist and negative tests; owner docs/capabilities aligned; 4uentes-auth npm run check."
  - order: 5
    id: "publish-auth"
    objective: "Merge Auth and read back its adoption and outbound facade contract."
    validation: "Auth PR and owner commit are reachable from refreshed origin/develop."
  - order: 6
    id: "resume-integrated-qa"
    objective: "After a separate runtime gate if needed, prove miss-hit, product invalidation, miss-hit and cleanup through product contracts."
    validation: "Secret-safe CR-SST-0207 evidence; no direct Redis or unauthorized deployment."
  - order: 7
    id: "publish-terminal"
    objective: "Reconcile owner documentation/evidence and publish done before cleanup."
    validation: "Both owner checks, control-plane npm run check, terminal merge and remote readback pass."

