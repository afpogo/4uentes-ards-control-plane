qa_scope:
  target_environment: "development"
  surfaces: ["localhost", "reserved-ngrok"]
  routing_rule: "Retention HTTP uses sst-fend -> 4uentes-auth -> sst-bend; only Socket.IO may use the direct browser-to-Bend exception."
  evidence_rule: "Use synthetic identities and preserve no password, token, cookie, message body, Redis credential or private URL."
  rollback: "Delete synthetic test data only through the product contract; do not mutate backing stores directly."

qa_matrix:
  - id: "facade-routing"
    expected: "Every retention HTTP operation traverses the approved Auth facade."
  - id: "temporary-multi-session-ttl"
    expected: "Two active sessions share turns; logout, a future session and TTL expiry cannot recover temporary history."
  - id: "saved-durability"
    expected: "Explicit promotion survives logout, Redis eviction and a second device or session."
  - id: "cache-aside"
    expected: "First durable read after eviction misses to PostgreSQL; the next read hits Redis without changing authority."
  - id: "clear-local"
    expected: "Browser state clears while saved history remains recoverable on demand."
  - id: "finish-temporary"
    expected: "Volatile data disappears and active sessions receive the terminal event."
  - id: "delete-from-sst"
    expected: "PostgreSQL row and Redis cache disappear and a race cannot resurrect them."
  - id: "cross-principal-isolation"
    expected: "A second principal cannot enumerate, read, promote or delete another user's conversations."

validation:
  dependency_lifecycles: "PASS: CR-SST-0204, CR-SST-0205, CR-SST-0206 and CR-SST-0211 are done."
  runtime_preflight: "PASS after CR-SST-0217: Argo is Synced/Healthy, localhost root and JWKS return HTTP 200, retention is true and the bounded temporary TTL is 120 seconds."
  localhost_matrix: "PASS by accumulated authorized evidence: facade routing, multi-session replay, TTL, cross-principal isolation, save/session durability, clear-local recovery, terminal notification, active-turn no-resurrection and product-safe cache-aside invalidation passed across CR-SST-0207, CR-SST-0218 and CR-SST-0230."
  reserved_ngrok_matrix: "PASS after CR-SST-0239: the authenticated public origin matched the HTTP retention contracts; cross-principal isolation, browser clear-local recovery and two-session temporary terminal delivery also passed within the bounded completion run."
  owner_checks: "PASS: CR-SST-0217 Infra owner check, renders and dry-runs passed on 2026-08-24."
  cache_aside_matrix: "PASS after CR-SST-0230: one localhost synthetic run proved miss-hit, invalidation through a normal protected Socket.IO turn, miss-hit and conversation cleanup through product contracts without direct Redis access."
  realtime_terminal_event: "PASS after CR-SST-0218: two active sessions each received exactly one chat:conversation:terminated event with the exact allowlisted payload for both temporary_finished and saved_deleted."
  delete_saved_active_turn_race: "PASS after CR-SST-0218: deletion fenced and cancelled an accepted turn, emitted no assistant completion after the fence, returned history 404 and did not resurrect the saved list entry."
  browser_consent_and_clear_local: "PASS: consent copy, explicit save, clear-local recovery and confirmed saved deletion passed in Chrome headless with sanitized screenshots."
  synthetic_cleanup: "PARTIAL pending disposition: later governed gates cleaned their conversations through product contracts, but published evidence documents a minimum of thirteen synthetic identities without a deletion contract and two inaccessible saved conversations from the original CR-SST-0207 run. No residue was re-read or mutated in this documentary gate."
  control_plane_check: "PASS on 2026-09-11: full npm run check completed with 0 FAIL after lifecycle-wide adoption of the execution publication rule; the only lifecycle warning is the frozen historical CR-SST-0016 exception."

