architecture_boundary:
  persistence_authority: "sst-bend"
  derivation_execution_authority: "sst-chatbot"
  service_grant_authority: "4uentes-auth"
  user_memory_adoption_authority: "explicit product review outside the service grant"
  transport_strategy: "M2M HTTP over existing service identities with Bend's durable run as the recovery source; no new broker in this plan."
  no_new_identities_or_secrets: true

m2m_grants:
  single_scope_tokens_required: true
  exact_tuples:
    - {caller: "sst-bend", audience: "sst-chatbot", scope: "article-processing:execute", purpose: "start or resume one authorized execution"}
    - {caller: "sst-chatbot", audience: "sst-api", scope: "article-processing:read", purpose: "read lifecycle and confirmed checkpoint"}
    - {caller: "sst-chatbot", audience: "sst-api", scope: "article-processing:write", purpose: "propose checkpoint or final candidate for atomic Bend acceptance"}
  forbidden_reuse: ["chat:process", "agent-handoff:submit", "user-memory:recall", "user-memory:propose"]

atomized_execution:
  - {order: 1, id: "publish-control-plane-running", objective: "Publish this lifecycle and plan.", validation: "npm run check, diff check and remote main readback"}
  - {order: 2, id: "freeze-owner-contracts", objective: "Align inbound and outbound contracts in all three owners before runtime code.", validation: "owner ARDS/SDD checks and cross-owner contract review"}
  - {order: 3, id: "implement-exact-grants", objective: "Add only the three exact grant tuples in Auth.", validation: "positive tuple and negative confusion matrix"}
  - {order: 4, id: "implement-bend-coordinator", objective: "Dispatch and reconcile execution from the durable Bend run.", validation: "lease, CAS, idempotency and retry tests"}
  - {order: 5, id: "implement-chatbot-adapters", objective: "Expose execution and consume Bend lifecycle ports without local durable authority.", validation: "resume, stale-output and provider-failure tests"}
  - {order: 6, id: "integrated-restart-proof", objective: "Prove retries and process restarts do not duplicate confirmed outputs.", validation: "cross-owner failure matrix and readback"}
  - {order: 7, id: "publish-and-close", objective: "Publish owner evidence and reconcile control plane and Jira under separate gates.", validation: "owner checks, control-plane full check and terminal readbacks"}

