  allowed_window: manual
  branch_strategy: one-branch-per-repo
  child_repo_mutation_allowed: true
  child_repo_mutation_targets: ["sst-bend"]
  implementation_boundary: "Preserve Dictionary Secrets v1 endpoints while changing redaction, metadata policy, AAD versioning and negative-security coverage."

implementation_plan:
  evidence_ref: "evidence/requests/CR-SST-0160/security-implementation-plan.md"
  validation_evidence_ref: "evidence/requests/CR-SST-0160/planning-validation-results.md"
  baseline:
    observed_at: "2026-08-11"
    service_revision: "b47ca013abea653d7651da5f71c537ea11f9ed64"
    service_worktree: clean
  security_decisions:
    aad_v1:
      encoding: "UTF-8 bytes of canonical JSON with the fixed field order documented in the plan evidence."
      immutable_context:
        - accountId
        - secretEntryId
        - secretVersion
        - algorithm
        - keyRef
      persistence: "Add nullable aad_version; new ciphertext MUST persist aad_version=1."
    legacy_compatibility: >
      aad_version NULL identifies legacy unbound ciphertext. It may use only the
      explicit legacy decrypt path. A row marked v1 MUST fail closed on any AAD
      mismatch and MUST NOT fall back to legacy decryption.
    metadata_policy: >
      Replace arbitrary Dictionary Secret metadata with documented allowlists.
      Existing values are not deleted; a key-name/count-only inventory is a
      deployment gate, and no metadata values may enter logs or evidence.
    error_boundary: >
      Stop serializing raw Error, Joi and Sequelize objects. Operational logs
      and HTTP error payloads use allowlisted fields and stable messages only.
    audit_order: >
      Decrypt and authenticate first, then persist the successful reveal/copy
      audit before returning plaintext. Integrity failures emit only a safe
      outcome without ciphertext, context values or raw crypto errors.
  execution_units:
    - id: SST93-01
      action: "Update owner API and capability contracts with invariants, compatibility and failure behavior."
    - id: SST93-02
      action: "Contain request-validation, ORM and unhandled-error logging/response leakage."
    - id: SST93-03
      action: "Classify Dictionary Secret metadata and add pre-deployment key-name inventory gate."
    - id: SST93-04
      action: "Add reversible aad_version migration, canonical AAD builder and repository wiring."
    - id: SST93-05
      action: "Implement explicit legacy-read compatibility and fail-closed v1 integrity behavior."
    - id: SST93-06
      action: "Add negative security, compatibility, repository and migration coverage."
    - id: SST93-07
      action: "Run owner checks, secret-safe review and control-plane closure validation."
  excluded:
    - "KMS or external secret-provider adoption"
    - "Master-key rotation, key-version selection or bulk re-encryption"
    - "Production deployment or production database mutation"
    - "Changes to sst-fend, node-auth, sst-extension or infrastructure repositories"
    - "Jira transition, comment or field update"
  start_gate: "Satisfied for sst-bend mutation on 2026-08-11; Jira remains separately gated."

