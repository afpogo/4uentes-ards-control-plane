    - "backlog_ticket_payload_dry_run"
    - "write_command_contract"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: "approved"
  approver: "4uentes"
  note: "Proceed with writer implementation. Jira write execution remains an explicit operator action."
