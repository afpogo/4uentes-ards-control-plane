    description: "Record detected Jira issue keys in state/jira-backlog-registry.yaml without changing assigned_cr_sst."
  - id: evidence
    description: "Write created/skipped evidence in the request output directory."
  - id: validation
    description: "Validate syntax, dry-run payload generation, and control-plane checks without executing Jira writes."

execution_boundaries:
  allowed:
    - "edit control-plane scripts"
    - "edit control-plane docs"
    - "generate local evidence"
    - "run local validation"
    - "write Jira only when operator executes --connect --approved"
  forbidden:
