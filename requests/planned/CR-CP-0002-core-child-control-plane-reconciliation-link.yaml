schema_version: "1.0"
phase: 2
id: "CR-CP-0002"
title: "Define child-to-control-plane reconciliation link policy and template"
status: "planned"
source_request: "requests/inbox/CR-CP-0002-core-child-control-plane-reconciliation-link.yaml"
created_at: "2026-07-07"
requester: "4uentes"

summary: >
  Promote the local orchestrator_link pattern as a profile-scoped core policy
  and template for child repositories that adopt machine-readable
  reconciliation metadata to an adopting control-plane.

control_plane_context:
  initiative_id: "INIT-CP-0002"
  parent_initiative_id: "INIT-CP-0001"
  related_jira_epic_key: "SST-36"
  target_jira_epic_key: "ARDS-1"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-orchestor"
      via: "local orchestrator_link implementation and state/capability map"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
    - service_id: "4uentes-ards-core"
      via: "future generic control_plane_link policy/template"
      service_kind: "ards-standard-source"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - "capability-state-linkage"
    - "child-repo-adoption"
    - "control-plane-template"
  capabilities:
    - "child-repo-orchestrator-link-rule"
    - "capability-state-linkage"

required_context:
  - "specs/states/capability-state-linkage.yaml"
  - "docs/requests/capability-state-linkage.md"
  - "docs/cross-repo/child-repo-orchestrator-link-rule.md"
  - "templates/child-orchestrator-link-rule.md"
  - "state/capability-links.yaml"

risk:
  level: "high"
  score: 8
  drivers:
    - "generic core schema must not hard-code 4uentes-orchestor"
    - "child repos may need aliases for existing orchestrator_link adoption"
    - "control_plane_link must not be interpreted as globally required for every repo"
    - "status_hint must remain advisory, not authoritative"

execution:
  requires_human_approval: true
  allowed_window: "manual"
  branch_strategy: "separate-core-promotion-branch"
  child_repo_mutation_allowed: false
  core_repo_mutation_allowed: true
  implementation_boundary: >
    Define a reusable core policy and template such as control_plane_link for
    the control-plane profile. Keep orchestrator_link as the local
    alias/adoption used by 4uentes-orchestor until a separate request-driven
    rollout migrates, aliases, adopts, or excepts child repos.

jira:
