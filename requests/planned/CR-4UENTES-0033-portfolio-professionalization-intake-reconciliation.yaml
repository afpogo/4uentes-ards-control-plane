    - "INIT-PORTFOLIO-0001"
  source_child_capability: "portfolio-professionalization-intake"
  feature_id: "portfolio-professionalization-intake"
  child_repo: "4uentes-portfolio"
  work_origin: "child-repo"
  correlation_id: "portfolio-professionalization-2026-07-05"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-portfolio"
      via: "child-originated professionalization intake reconciliation"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
    - "frontend-web"
    - "capability-outbound"
    - "initiative"
    - "jira-mirror"
    - "owner-documentation"
  capabilities:
    - "portfolio-professionalization-intake"

required_context:
  - "inventory/evidence/git/4uentes-portfolio.md"
  - "docs/requests/jira-write-connection-contract.md"
  - "docs/requests/mcp-auth-bootstrap-playbook.md"
  - "docs/requests/initiative-model.md"
  - "docs/policies/owner-documentation-authority-policy.md"
