  role: "mirror"
  source_of_truth: false
  project_key: "PORT"
  epic_key: "PORT-9"
  issue_key: "PORT-10"
  issue_type: "Tarea"
  parent_issue_type: "Epic"
  current_status_observed: "Listo"
