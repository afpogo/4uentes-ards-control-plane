  - "4uentes-portfolio: docs/integration/orchestrator-intake/portfolio-professionalization.md"

risk:
  level: "low"
  score: 3
  drivers:
    - "Jira mirror must not become source of truth"
    - "child-originated intake must be reconciled without assigning CR ids from the child repo"
    - "professionalization scope can become too broad if not atomized into future CRs"

execution:
  requires_human_approval: false
  allowed_window: "manual"
  branch_strategy: "control-plane-intake-reconciliation"
  child_repo_mutation_allowed: false
  owner_documentation_required: false
  implementation_boundary: >
    Reconcile only the intake signal, Initiative, capability/state link, and
    Jira mirror. Do not change portfolio runtime, visible copy, UX, owner docs,
    CV behavior, GitHub evidence behavior, deployment target, or mobile
    remediation implementation in this CR.

owner_documentation:
  required: false
  status: not-applicable
  owner_repo: "4uentes-portfolio"
  reason: >
    The child repository already produced the outbound capability and intake
    documentation. This CR records the control-plane reconciliation only and
    does not mutate the child repo.
  child_owner_refs:
    - repo: "4uentes-portfolio"
      paths:
        - "specs/capabilities/outbound/portfolio-professionalization-intake.yaml"
        - "docs/integration/orchestrator-intake/portfolio-professionalization.md"

