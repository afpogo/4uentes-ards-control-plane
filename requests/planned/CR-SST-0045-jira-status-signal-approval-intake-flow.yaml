    command: "npm run check"

risk:
  level: high
  score: 7
  drivers:
    - id: PREMATURE_JIRA_STATUS_TRANSITION
      severity: high
    - id: JIRA_CONTROL_PLANE_AUTHORITY_DRIFT
      severity: high
    - id: MISREAD_RECORD_SIGNAL_AS_START_WORK
      severity: high
    - id: FEATURE_STATE_REQUEST_SCOPE_CONFUSION
      severity: medium

task_weight:
  classification: complex-high-risk-task
  risk_level: high
  drivers:
    - JIRA_STATUS_WRITE_BOUNDARY
    - CONTROL_PLANE_SOURCE_OF_TRUTH
    - STATUS_SIGNAL_INTAKE_POLICY
    - FEATURE_STATE_REQUEST_SCOPE_BOUNDARY

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The task defines status transition authority between Jira observations, local state, and request lifecycle."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - validation-reviewer
  fallback: "The main agent must perform architecture, write-boundary, and validation review sequentially if subagent tools are unavailable."
  evidence_required: true

execution:
  requires_human_approval: false
  allowed_window: local
  branch_strategy: control-plane-only
  read_only_boundary:
    allowed:
      - "read local Jira evidence"
      - "read local feature_state evidence"
      - "write non-secret approval/intake documentation"
      - "write request lifecycle evidence"
    forbidden:
      - "connect to Jira"
      - "write Jira issue status"
      - "modify feature_state status"
      - "move functional repository code"
      - "modify functional repositories"
      - "store tokens, cookies, private URLs, cloudId, or OAuth material in Git"

implementation_steps:
  - id: confirm-sequence
    description: "Confirm CR-SST-0044 is the latest done request and CR-SST-0045 is the next request."
  - id: classify-pending-signals
    description: "Review STATUS_SIGNAL_PENDING items from CR-SST-0044."
  - id: define-intake-flow
    description: "Define how record-signal, continue-request, and approved-write decisions are handled."
  - id: record-current-decisions
    description: "Record current pending signal decisions without Jira writes or local transitions."
  - id: validate
    description: "Run npm run check."

validation:
  required_checks:
    - "npm run check"
  evidence_required:
    - "sequence_review"
    - "approval_intake_flow"
    - "pending_signal_decision_matrix"
    - "subagent_deployment_evidence"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "CR-SST-0044 is the latest closed request at the start of this request."
  - "CR-SST-0045 is a control-plane lifecycle request, not a Jira transition request."
  - "record-signal does not authorize moving a Jira issue to En curso."
  - "A Jira status write requires an approved-write request and explicit execution evidence."
