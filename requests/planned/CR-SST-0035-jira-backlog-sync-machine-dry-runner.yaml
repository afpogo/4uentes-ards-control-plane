  - service_id: 4uentes-orchestor
    command: "npm run check"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:sync-machine -- --request-id CR-SST-0035 --output-dir evidence/requests/CR-SST-0035 --mode dry-run"

risk:
  level: high
  score: 7
  drivers:
    - id: STATE_MACHINE_DRIFT
      severity: high
    - id: CONTROL_PLANE_PROCESS_LIFECYCLE
      severity: high
    - id: EXTERNAL_JIRA_WRITE_BOUNDARY
      severity: medium

task_weight:
  classification: complex-high-risk-task
  risk_level: high
  drivers:
    - STATE_MACHINE_DRIFT
    - CONTROL_PLANE_PROCESS_LIFECYCLE
    - ARDS_SDD_CONTRACT_ALIGNMENT

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The task turns a declarative control-plane state machine into an executable dry-run contract while preserving external write boundaries."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - validation-reviewer
  fallback: "If subagent tools are unavailable, the main agent must perform architecture, write-boundary, and validation review sequentially."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: manual
  branch_strategy: control-plane-only
  write_boundary:
    allowed:
      - "read state/jira-backlog-sync-machine.yaml"
      - "simulate read-only state machine transitions"
      - "write non-secret evidence"
    forbidden:
      - "connect to Jira"
      - "create Jira issues"
      - "edit Jira issues"
      - "comment on Jira issues"
      - "transition Jira issues"
      - "modify functional repositories"

implementation_steps:
  - id: add-sync-machine-dry-runner
    description: "Add a local runner that reads the declarative machine and simulates the read-only event path from idle to ready-for-approval."
  - id: add-npm-command
    description: "Expose the runner as npm run jira:mcp:sync-machine."
  - id: record-evidence
    description: "Write event trace evidence under evidence/requests/CR-SST-0035."
  - id: validate
    description: "Run node --check, the dry-runner command, and npm run check."

validation:
  required_checks:
    - "npm run check"
    - "npm run jira:mcp:sync-machine -- --request-id CR-SST-0035 --output-dir evidence/requests/CR-SST-0035 --mode dry-run"
  evidence_required:
    - "jira_sync_machine_dry_run"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "CR-SST-0035 is the next process after CR-SST-0034."
  - "This request intentionally avoids XState dependency installation."
  - "XState can be introduced later after the declarative runner proves the event contract."
