impact_analysis:
  required: true
  affected_services:
    - service_id: "sst-bend"
      via: "DB persistence, seed/backfill, and temporary dual-write runtime"
      service_kind: "api"
      ards_kind: "backend-api"
      status: "active"
  deferred_services:
    - service_id: "4uentes-auth"
      via: "future authenticated governance facade in CR-SST-0074"
