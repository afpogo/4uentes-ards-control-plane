  - "inventory/evidence/git/sst-bend.md"

implementation_tracks:
  - id: "db-global-tag-model"
    service_id: "sst-bend"
    objective: "Create `tag_definitions`, `tag_values`, and `tag_occurrences` with indexes and transitional ownership rules."
    expected_work:
      - "Add Sequelize models and migration."
      - "Seed definitions from current registry/lifecycle."
      - "Backfill values and occurrences from legacy dictionary tables."
  - id: "runtime-dual-write"
    service_id: "sst-bend"
    objective: "Mirror current dictionary/article tag writes into the global tables without changing public reads yet."
    expected_work:
      - "Keep dictionary and article reads on legacy tables."
      - "Mirror `findOrCreateTagValue` into `tag_values`."
      - "Mirror dictionary and article occurrence writes into `tag_occurrences`."
  - id: "control-plane-evidence"
    service_id: "4uentes-orchestor"
    objective: "Record implementation evidence and validation outcomes after child-repo work."

acceptance_criteria:
  - "`sst-bend` creates the new global tag tables through a migration."
  - "Initial seed includes registry-driven definitions and tolerated legacy-derived fallbacks."
  - "Legacy dictionary tables remain readable by current runtime flows."
  - "Dictionary entry tag sync keeps writing legacy tables and mirrors to global tables."
  - "Article tag sync keeps writing legacy occurrences and mirrors to global occurrences."
  - "`sst-bend` validation runs are captured with concrete outcomes or exact blockers."

required_checks:
  - service_id: "sst-bend"
    command: "npm.cmd run test:tag-engine"
  - service_id: "sst-bend"
    command: "npm.cmd run test:diccionario:stage3"
  - service_id: "sst-bend"
    command: "npm.cmd run check"
  - service_id: "4uentes-orchestor"
    command: "npm run check"

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "DB migration and backfill"
    - "shared runtime semantics for dictionary and articles"
    - "temporary dual-write during compatibility window"

model_selection:
  policy_ref: "docs/policies/agent-model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The CR changes persistence semantics in a governed child repo while preserving a live legacy runtime."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - "architecture-reviewer"
    - "cross-repo-impact-reviewer"
    - "validation-reviewer"
  executed: []
  fallback: "Implementation executed sequentially in the main agent after local repo/context inspection."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: "manual"
  branch_strategy: "local child-repo working tree with preserved unrelated changes"
  jira_write_required: false
  runtime_scope: "local-current-environment"

decision:
  status: "approved-for-local-implementation"
  approver: "4uentes"
  approved_at: "2026-06-13"
  note: "This request governs the persistence cut only. Public API/BFF/frontend adoption remains in CR-SST-0073..0076."
