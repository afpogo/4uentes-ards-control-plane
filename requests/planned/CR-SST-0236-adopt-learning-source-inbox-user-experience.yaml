requester: '4uentes'
summary: 'Plan the sst-fend source inbox and immutable snapshot review flow for /learning.'
depends_on: ['CR-SST-0232', 'CR-SST-0235']
predecessor_requests: ['CR-SST-0232', 'CR-SST-0235']
control_plane_context: {initiative_id: 'INIT-SST-0010', parent_request_id: 'CR-SST-0232', owner_repository: 'sst-fend'}
risk: {level: 'medium', drivers: ['PRIVATE_CONTENT_DISPLAY', 'STALE_SOURCE_UX', 'TAG_SEMANTICS', 'MEMORY_CONSENT']}
model_selection: {provider: 'codex', resource_level: 'normal', task_class: 'complex-product-task', primary_profile: 'gpt-5.6-sol', reasoning_effort: 'high', fallback_profile: 'gpt-5.5 high'}
subagent_deployment_plan: {required: false, reason: 'No delegation was requested; UX acceptance remains with the primary agent and human approver.'}
execution:
  control_plane_reservation_allowed: true
  child_repo_mutation_allowed: false
  runtime_mutation_allowed: false
  jira_write_allowed: false
  predecessor_gate: 'CR-SST-0235 must publish and pass integration checks.'
  next_gate: 'Explicit running authorization for sst-fend after predecessor readback.'
owner_contract:
  responsibilities:
    - 'Expose a comprehensible source inbox for manual text, article, article document and agent output.'
    - 'Show stable source reference, immutable snapshot identity, provenance, freshness and failures.'
    - 'Keep tags, article preparation and memory proposal explicit and independently reviewable.'
  prohibited:
    - 'Send caller-supplied sourceText as authority for article-backed sources.'
    - 'Collect or persist secret values in browser state.'
    - 'Represent tag assignment as automatic memory acceptance.'
owner_documentation:
  required: true
  minimum: ['frontend capability contract', 'human UX playbook', 'maps with textual fallback', 'manual QA runbook']
knowledge_to_execution_documentation: {policy_id: 'knowledge-to-execution-documentation-policy', current_role: 'playbook', runbook_required_for_current_gate: false, runbook_required_before_owner_execution: true}
visual_documentation:
  policy_id: 'visual-documentation-as-code-policy'
  shared_map_ref: 'evidence/requests/CR-SST-0232/owner-request-allocation-plan-2026-09-05.md'
  owner_map_expectation: 'Map source selection, snapshot review, tags and separate memory proposal with textual fallback.'
manual_qa:
  required: true
  mode: 'Chrome DevTools MCP only'
  fixture_rule: 'Use UI-created synthetic content; no database scripts, seeders or secrets.'
atomized_execution:
  - {order: 1, objective: 'Publish Fend ARDS/SDD, UX maps and QA runbook.', validation: 'owner documentation review'}
  - {order: 2, objective: 'Implement source inbox and snapshot states.', validation: 'component and accessibility checks'}
  - {order: 3, objective: 'Implement explicit tag and memory boundaries.', validation: 'interaction checks'}
  - {order: 4, objective: 'Publish and execute approved browser QA.', validation: 'CI, Chrome evidence, readback and npm run check'}
acceptance:
  - 'Users understand how a source becomes a snapshot and prepared article.'
  - 'Tags and memory proposal are visible, explicit and independent.'
  - 'Stale, unauthorized and failed sources have actionable states.'
  - 'No implementation starts under this reservation gate.'
