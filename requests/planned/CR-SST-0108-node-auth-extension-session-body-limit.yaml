schema_version: "1.0"
phase: 2
id: "CR-SST-0108"
title: "Harden node-auth extension session payload ingestion"
status: closed-local
source_request: "requests/inbox/CR-SST-0108-node-auth-extension-session-body-limit.yaml"
created_at: "2026-07-04"
requester: "4uentes"

summary: >
  Add a scoped, configurable request body limit for node-auth browser extension
  session ingestion and return explicit 413 responses for oversized payloads.
  This unblocks SST-30 manual QA without broadening the body limit for all BF
  routes.

initial_scope:
  solution: "sst"
  services:
    - "4uentes-auth"
    - "4uentes-orchestor"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-SST-0003"
  initiative_file: "initiatives/INIT-SST-0003-sst-extension-construction.yaml"
  related_cr: "CR-SST-0098"
  related_jira_issue_key: "SST-30"
  jira_epic_key: "SST-29"
  jira_issue_key: "SST-40"
  policy_ref: "docs/policies/owner-documentation-authority-policy.md"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-auth"
      via: "presentation request parser, error middleware, specs/docs/capability"
      service_kind: "backend-for-frontend"
      ards_kind: "auth-gateway"
      status: "active"
    - service_id: "4uentes-orchestor"
      via: "request lifecycle and evidence"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
