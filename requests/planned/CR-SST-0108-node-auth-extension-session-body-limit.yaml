      severity: high
    - id: OVERBROAD_BODY_LIMIT
      severity: medium
    - id: DOWNSTREAM_PAYLOAD_COMPATIBILITY
      severity: medium
    - id: OWNER_DOCS_STALE
      severity: high

required_context:
