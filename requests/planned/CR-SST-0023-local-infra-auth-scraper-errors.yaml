      owner_role: validation-reviewer
      required_evidence:
        - "Chrome DevTools network requests and console errors from localhost:8088"
    - id: auth-and-api-contract
      owner_role: security-contract-reviewer
      required_evidence:
        - "frontend token/session behavior"
        - "backend authentication guard and authorization contract"
        - "auth provider cookie/JWT/JWKS behavior"
    - id: infra-and-runtime-routing
      owner_role: cross-repo-impact-reviewer
      required_evidence:
        - "local proxy, docker-compose, ingress, service URLs, and scraper routing"
  constraints:
    - "Do not modify child repositories until evidence identifies a concrete fix scope."
    - "Do not commit local paths, tokens, cookies, or secrets."
    - "Do not treat legacy aliases as canonical identities."

