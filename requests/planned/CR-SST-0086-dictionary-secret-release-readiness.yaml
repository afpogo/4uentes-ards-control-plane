schema_version: "1.0"
phase: 2
id: "CR-SST-0086"
title: "Dictionary Secrets Release Readiness"
status: planned
source_request: "requests/inbox/CR-SST-0086-dictionary-secret-release-readiness.yaml"
created_at: "2026-06-28"
requester: "4uentes"

summary: >
  Plan the release-readiness closure for dictionary-secret-management without
  reopening CR-SST-0084. The feature remains validated-local until the
  authenticated runtime smoke and frontend hardening checks pass with sanitized
  evidence.

initial_scope:
  solution: "sst"
  services:
    - "sst-bend"
    - "4uentes-auth"
    - "sst-fend"
  include_optional_services: false

impact_analysis:
  required: true
  affected_services:
    - "sst-bend"
    - "4uentes-auth"
    - "sst-fend"
    - "4uentes-orchestor"
  affected_ards:
    - request-lifecycle
    - feature-state
    - runtime-validation-evidence
    - secret-handling-evidence
    - jira-mcp-readiness
  capabilities:
    - "dictionary-secret-management-v1"
  risks:
    - id: MISSING_RUNTIME_MASTER_KEY
      severity: high
    - id: SECRET_VALUE_LEAKAGE_IN_EVIDENCE
      severity: high
    - id: AUTHENTICATED_SMOKE_GAP
      severity: high
    - id: FRONTEND_INVALID_DOM_OR_A11Y_GAP
      severity: medium
    - id: JIRA_MCP_EXTERNAL_ACCESS_BLOCKER
      severity: medium

required_context:
  - "AGENTS.md"
  - "specs/integration/policies.yaml"
  - "docs/policies/"
  - "docs/requests/dictionary-secret-management-contract.md"
  - "docs/requests/jira-mcp-endpoint-connection-policy.md"
  - "state/features/dictionary-secret-management.current.yaml"
  - "requests/done/CR-SST-0084-dictionary-secret-documentation-management.yaml"
  - "evidence/requests/CR-SST-0084/validation-results.md"
  - "evidence/requests/CR-SST-0084/secret-safe-review.md"

required_checks:
  - service_id: "sst-bend"
    command: "npm.cmd run test:diccionario:secrets"
  - service_id: "sst-bend"
    command: "npm.cmd run test:diccionario:stage3"
  - service_id: "sst-bend"
    command: "npm.cmd run build"
  - service_id: "sst-bend"
    command: "npm.cmd run check"
  - service_id: "sst-bend"
    command: "authenticated smoke: create/list/reveal/copy/rotate/revoke with ephemeral QA token and fictitious values"
  - service_id: "4uentes-auth"
    command: "npm.cmd run build"
  - service_id: "4uentes-auth"
    command: "npm.cmd run check"
  - service_id: "4uentes-auth"
    command: "BFF smoke for /api/diccionario/secrets/* auth, forwarding, and metadata-only responses outside reveal/copy"
  - service_id: "sst-fend"
    command: "focused lint for DictionarySecretsPanel"
  - service_id: "sst-fend"
    command: "npm.cmd run build"
  - service_id: "sst-fend"
    command: "Chrome DevTools MCP manual QA for create/list/reveal/auto-hide/copy/rotate/revoke"
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"

risk:
  level: high
  score: 8
  drivers:
    - MISSING_RUNTIME_MASTER_KEY
    - SECRET_VALUE_LEAKAGE_IN_EVIDENCE
    - AUTHENTICATED_SMOKE_GAP
    - FRONTEND_INVALID_DOM_OR_A11Y_GAP
    - JIRA_MCP_EXTERNAL_ACCESS_BLOCKER

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "Security-sensitive runtime secret handling."
    - "Authenticated smoke coverage can expose JWTs or plaintext if evidence is not sanitized."
    - "Work spans multiple child repos and the control-plane."

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-high-reasoning-profile"
  reason: >
    Release readiness touches auth, secret handling, evidence hygiene, and
    cross-repo coordination, so the architecture-boundary policy requires a
    high-reasoning profile.

subagent_deployment_plan:
  required: false
  parallelizable: true
  roles:
    - id: "backend-secret-runtime-review"
      objective: "Review sst-bend secret runtime config and smoke evidence."
      risk: high
      suggested_profile: "high_reasoning_task"
      validation: "Tests and authenticated smoke pass without secret leakage."
    - id: "frontend-dom-a11y-review"
      objective: "Review DictionarySecretsPanel DOM/a11y hardening."
      risk: medium
      suggested_profile: "long_context_task"
      validation: "Focused lint/build and manual QA show no validateDOMNesting regression."
    - id: "jira-mcp-readonly-recovery"
      objective: "Run read-only Jira/MCP recovery before any write."
      risk: medium
      suggested_profile: "long_context_task"
      validation: "Read-only observation succeeds or 403 blocker is recorded."
  fallback: "Main agent executes sequentially when subagents are unavailable."
  evidence_required: true

execution:
  requires_human_approval: false
  allowed_window: manual
  branch_strategy: "one-branch-per-repo"
  implementation_boundary: >
    Child repositories may be modified only for the scoped services above and
    only after this request plan exists. Jira writes are not allowed without
    explicit approval after a successful read-only MCP observation.
  feature_state_gate: >
    Keep state/features/dictionary-secret-management.current.yaml at
    validated-local until authenticated runtime smoke and frontend hardening
    evidence pass. Promote to validated-live only on successful closure.
  jira_mcp_sequence:
    endpoint: "/v1/mcp"
    first_step: "read-only observation"
    write_allowed: false
    write_condition: "explicit human approval after issue key reconciliation"
    blocker_if: "403 The app is not installed"

validation:
  required_checks:
    - "All required_checks above are passed or recorded with explicit blocker reason."
    - "Evidence contains no JWTs, cookies, real master keys, or real secret plaintext."
    - "List responses remain metadata-only/masked."
    - "Reveal auto-hide remains 60 seconds."
    - "Copy does not persist plaintext."
  evidence_required:
    - "implementation_plan"
    - "changed_files_summary"
    - "validation_results"
    - "secret_safe_review"
    - "jira_mcp_readonly_result_or_blocker"

decision:
  status: pending
  approver: TODO

jira:
  issue_key: "SST-26"
  parent_epic_key: "SST-25"
  status_observed: "En curso"
  assignee_observed: "Fuentes Sandferand"
  start_evidence_ref: "evidence/initiatives/INIT-SST-0002/jira-sst-26-start-summary.md"

planner_notes:
  - "CR-SST-0084 remains closed-local and is not reopened."
  - "The original handoff plan requested CR-SST-0085, but that id is already used; CR-SST-0086 carries this release-readiness scope."
  - "sst-extension remains outside v1 release closure."
