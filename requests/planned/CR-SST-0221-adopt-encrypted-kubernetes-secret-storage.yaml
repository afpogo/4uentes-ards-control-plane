schema_version: "1.0"
phase: 2
id: "CR-SST-0221"
title: "Adopt encrypted Kubernetes Secret storage for SST development"
status: "planned"
source_request: "requests/inbox/CR-SST-0221-adopt-encrypted-kubernetes-secret-storage.yaml"
created_at: "2026-08-27"
requester: "4uentes"
summary: >
  Establish the approved adoption sequence for encrypting Kubernetes Secret
  storage in the shared SST development kind cluster without placing secret
  values or encryption keys in Git, Jira, logs or evidence. This publication
  is planning-only and does not authorize cluster or child-repository changes.

control_plane_context:
  initiative_id: "INIT-SST-0008"
  triggering_request: "CR-HPT-0021"
  target_environment: "development"
  target_cluster: "cluster.sst-dev.kind"
  infrastructure_owner: "sst-4uentes-infra"
  affected_runtime_owners: ["4uentes-auth", "sst-bend", "sst-chatbot", "finanzas-personales"]
  jira_role: "mirror"
  jira_source_of_truth: false
  jira_project_key: "SST"
  jira_parent_issue_key: "SST-89"
  jira_issue_key: "TODO-after-exact-duplicate-preflight"
  jira_write_allowed: false

observed_baseline:
  date: "2026-08-27"
  cluster_context: "kind-sst-cluster-dev"
  kubernetes_version: "v1.32.0"
  encryption_provider_configured: false
  external_secret_operator_present: false
  git_secret_provider: "manual-local-k8s-secrets"
  secret_values_observed_or_recorded: false
  affected_secret_objects:
    - "ghcr-pull-secret"
    - "node-auth-secret"
    - "sst-bend-dictionary-secrets-secret"
    - "sst-bend-postgres-secret"
    - "sst-chat-m2m-secret"
    - "sst-chat-redis-secret"
  limitation: >
    RBAC and transport TLS are present but do not prove confidentiality of
    Secret objects stored in etcd. The baseline does not yet include Phinance.

risk:
  level: "critical"
  score: 12
  drivers:
    - "cluster-wide credential confidentiality"
    - "loss of the encryption key can make all stored Secrets unrecoverable"
    - "incorrect provider order can write plaintext or break API reads"
    - "kind recreation can destroy development state unless data is classified and backed up"
    - "consumer restarts can interrupt authentication, persistence and chat workloads"

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "critical"

model_selection:
  policy_ref: "docs/policies/agent-model-selection-policy.md"
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  primary_profile: "gpt-5.6-sol"
  reasoning_effort: "max"
  fallback_profile: "gpt-5.5 high"
  reason: "The plan coordinates cluster cryptography, key recovery, persistent data and several runtime owners."

subagent_deployment_plan:
  required: false
  mode: "sequential-main-agent"
  reason: "No delegation was requested and the security and migration decisions share one ordered critical path."

architecture_decision:
  storage_encryption:
    initial_provider: "secretbox"
    encrypted_resources: ["secrets"]
    rationale: >
      Secretbox provides authenticated local encryption without the AES-GCM
      write-count rotation constraint. Its key remains reachable from the
      control-plane host, so it protects against etcd disclosure rather than
      full host compromise.
    migration_provider_order: ["secretbox:sst-dev-secrets-v1", "identity"]
    steady_state_provider_order: ["secretbox:active-key", "secretbox:retained-rollback-keys"]
    forbidden_provider: "aescbc"
    future_target: "KMS v2 when a real external KMS service and plugin are available"
  source_secret_delivery:
    phase_one: "Retain manual local provisioning outside Git."
    phase_two_decision: "Compare SOPS with age, Sealed Secrets and External Secrets in a separate approved request."
    separation_rule: >
      Git encryption and external secret synchronization do not replace API
      server encryption of any Kubernetes Secret materialized in etcd.
  key_custody:
    key_names: ["sst-dev-secrets-v1", "sst-dev-secrets-v2"]
    generation: "Generate cryptographically random key material outside Git and captured terminal output."
    primary_location: "Restricted file mounted into the kind control-plane node."
    recovery_copy: "Independent encrypted operator-controlled backup required before activation."
    prohibited_locations: ["Git", "Jira", "GitHub Actions secrets for cluster runtime custody", "evidence", "application .env files"]
    custodian: "authorized SST development cluster operator"

owner_boundaries:
  control_plane:
    owner: "4uentes-orchestor"
    responsibilities: ["request lifecycle", "coordination", "sanitized evidence", "promotion gates"]
  infrastructure:
    owner: "sst-4uentes-infra"
    responsibilities: ["kind bootstrap", "encryption template", "backup and restore runbook", "cluster validation"]
  runtime_owners:
    responsibilities: ["declare Secret consumption", "validate bounded restart and readiness"]
    mutation_rule: "Each owner mutation requires its own approved and published request."
  human_operator:
    responsibilities: ["key custody", "backup approval", "outage window", "migration or recreation decision"]

execution:
  control_plane_mutation_allowed: true
  child_repo_mutation_allowed: true
  child_repo_mutation_targets: ["sst-4uentes-infra"]
  core_repo_mutation_allowed: false
  cluster_mutation_allowed: true
  cluster_mutation_scope: "new disposable isolated kind cluster only"
  shared_cluster_mutation_allowed: false
  secret_mutation_allowed: "synthetic disposable Secrets only"
  key_generation_allowed: "synthetic ephemeral non-reusable keys only"
  deployment_allowed: "local disposable prototype only"
  production_data_allowed: false
  jira_write_allowed: false
  next_external_gate: >
    Merge and read back this plan, then obtain explicit authorization for a
    separate infrastructure-owner prototype in a disposable cluster.

execution_publication_rule:
  rule_id: "execution-publication-and-tracker-closure-rule"
  adoption_status: "adopted"
  git_publication:
    applicable: true
    plan_merge_required: true
    terminal_merge_required: true
  tracker_mirror:
    applicable: true
    provider: "jira"
    project_key: "SST"
    epic_key: "SST-89"
  cleanup:
    remote_readback_required: true

atomized_execution:
  - order: 1
    id: "publish-adoption-plan"
    objective: "Merge and read back the CR-SST-0221 plan, sanitized baseline, governed feature state and visual maps."
    mutation_scope: "control-plane-only"
    validation: "npm run check, git diff --check and canonical remote readback"
  - order: 2
    id: "classify-data-and-recovery"
    objective: "Classify MongoDB and PostgreSQL development data and approve backup, outage and recovery expectations."
    mutation_scope: "read-only inventory until separately approved"
    validation: "Named custodian, tested backup destination and explicit preservation decision"
  - order: 3
    id: "prototype-reproducible-bootstrap"
    objective: "Implement a key-free Git template and secure external key mount in an isolated disposable kind cluster."
    mutation_scope: "future approved sst-4uentes-infra worktree"
    validation: "API read succeeds and raw etcd inspection proves the encrypted provider prefix without exposing payloads"
  - order: 4
    id: "prove-migration-and-rollback"
    objective: "Create synthetic Secrets, migrate from identity fallback, rotate a key and prove recovery with retained keys."
    mutation_scope: "disposable cluster only"
    validation: "rewrite, rotation, rollback and disaster-recovery scenarios pass"
  - order: 5
    id: "choose-shared-cluster-path"
    objective: "Approve either in-place migration or controlled recreation of the shared development cluster."
    mutation_scope: "human decision gate"
    validation: "data preservation, outage, rollback and operator approvals are explicit"
  - order: 6
    id: "execute-bounded-shared-migration"
    objective: "Activate encryption, rewrite existing Secrets and restart consumers in bounded waves."
    mutation_scope: "future separately approved cluster execution"
    validation: "all Secret objects encrypted at rest, Argo healthy and every deployment ready"
  - order: 7
    id: "remove-plaintext-fallback"
    objective: "Remove identity only after every existing Secret has been rewritten and recovery is proven."
    mutation_scope: "future separately approved cluster execution"
    validation: "raw etcd prefix audit, API readback and retained-key rollback check"
  - order: 8
    id: "evaluate-source-secret-controller"
    objective: "Select or explicitly defer SOPS, Sealed Secrets or External Secrets for GitOps source delivery."
    mutation_scope: "new request required"
    validation: "decision records threat model, operator lifecycle, recovery and rotation"
  - order: 9
    id: "close-and-reconcile"
    objective: "Publish terminal evidence and reconcile the Jira mirror through a separately authorized exact batch."
    mutation_scope: "control-plane and separately authorized Jira batch"
    validation: "full check, terminal merge/readback and Jira readback"

migration_gates:
  - "An etcd snapshot and application-level backup strategy exist and have an identified restore path."
  - "No Secret values or raw encrypted payloads are emitted by inventory or verification commands."
  - "The encryption configuration template contains no key material in Git."
  - "Identity is last during migration and absent from steady state."
  - "The API server can decrypt with both active and retained rollback keys before any old key is removed."
  - "Persistent-data preservation and outage decisions are explicitly approved before shared-cluster recreation."
  - "Consumer rollout is bounded by owner and readiness is checked after each wave."

rotation_cycle:
  - "Generate and escrow a new versioned key outside Git."
  - "Add it as a decrypt-capable key while retaining the current key."
  - "Promote the new key to the first writer position and reload or restart the API server safely."
  - "Rewrite all Secret objects through the Kubernetes API."
  - "Verify encrypted raw storage and normal API reads without printing payloads."
  - "Retain the old key for the approved rollback period."
  - "Remove the old key only after recovery evidence and separate approval."

owner_documentation:
  required: true
  required_for_this_request: true
  status: "planned"
  owner_repo: "sst-4uentes-infra"
  planned_owner_docs:
    - "specs/infra/kubernetes-secret-storage-encryption.yaml"
    - "specs/states/kubernetes-secret-storage-encryption.yaml"
    - "docs/runbooks/kind-secret-encryption-prototype.md"
    - "docs/security/kubernetes-secret-key-lifecycle.md"

acceptance:
  - "The current unencrypted-at-rest baseline and affected Secret object names are documented without values."
  - "Storage encryption, source-secret delivery and runtime consumption are modeled as separate controls."
  - "Secretbox is the approved local-kind starting provider and aescbc is prohibited."
  - "Key custody, recovery, migration, rotation, rollback and fallback-removal gates are explicit."
  - "No child repository, cluster, key, Secret, deployment or Jira mutation is authorized by this plan."
  - "Normative protection, adoption, migration and rotation relationships have versioned visual maps with textual fallbacks."

decision:
  status: "approved-for-disposable-infrastructure-prototype"
  approver: "4uentes"
  decided_at: "2026-08-27"
  approval_text: "ok avancemos al siguiente paso"
  blocker: "Shared-cluster mutation remains prohibited and requires a later exact operational approval."

evidence_refs:
