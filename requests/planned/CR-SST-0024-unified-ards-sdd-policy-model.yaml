planner_notes:
  - Request id CR-SST-0023 was already occupied by local infra/auth/scraper investigation artifacts; this policy model lifecycle was renumbered to CR-SST-0024 to avoid duplicate request ids.
  - Functional repositories must not be modified in this phase.
  - 4uentes-core must not be modified from this workflow.
  - Universal policy canon remains a handoff target for 4uentes-core, not an orchestrator-local redefinition.
  - human-doc-language is canonical in the orchestrator through docs/idioma-markdown.md; child repos should generate human-facing docs from that rule, and core should receive a future handoff to adopt it as reusable policy.
  - The observed labels 4uentes-core and 4uentes-ards-core must be reconciled by the standard-source workflow before final canon references are frozen.
