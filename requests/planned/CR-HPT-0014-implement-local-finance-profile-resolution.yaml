schema_version: "1.0"
phase: 2
id: "CR-HPT-0014"
title: "Implement local finance-profile resolution and a fail-closed principal boundary"
status: "planned"
source_request: "requests/inbox/CR-HPT-0014-implement-local-finance-profile-resolution.yaml"
created_at: "2026-08-22"
requester: "4uentes"

summary: >
  Recover and publish the smallest owner-local persistence and
  principal-resolution slice that Phinance can safely own. The result remains
  unavailable to live financial traffic until the provider credential,
  verifier and integrated consumer requests complete.

control_plane_context:
  initiative_id: "INIT-HPT-0002"
  predecessor_request_ids:
    - "CR-HPT-0008"
    - "CR-HPT-0013"
    - "CR-SST-0212"
  recovered_sources:
    control_plane_plan_commit: "48776c6"
    control_plane_closure_commit: "df733c5"
    owner_implementation_commit: "daa66e5"
  required_follow_up_capabilities:
    - "SST/Auth provider grant: sst-bend -> phinance-api / finance:invoke"
    - "Concrete Phinance verifier for the provider-owned credential contract"
    - "Integrated SST proxy and account-isolation QA"

impact_analysis:
  required: true
  affected_services:
    - service_id: "finanzas-personales-backend"
      via: "finance-profile persistence, owner resolution and readiness"
  planning_consequence: >
    Publish only the Phinance-owned profile and fail-closed application port.
    Do not infer that an SST/Auth provider credential is deployed.
  risks:
    - id: "UNAUTHENTICATED_PRINCIPAL_ENVELOPE"
      severity: "critical"
    - id: "PROFILE_DUPLICATION_UNDER_CONCURRENCY"
      severity: "high"
    - id: "ORPHANED_FINANCIAL_OWNERSHIP"
      severity: "high"
    - id: "FALSE_BUSINESS_READINESS"
      severity: "high"

risk:
  level: "high"
  score: 10
  drivers:
    - "authentication boundary for account-scoped financial data"
    - "new owner identity persistence and foreign keys"
    - "concurrent just-in-time profile provisioning"
    - "migration behavior for pre-existing records"

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "security, persistence, ownership, migration and readiness"

model_selection:
  policy_ref: "docs/policies/agent-model-selection-policy.md"
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  primary_profile: "gpt-5.6-sol"
  reasoning_effort: "max"
  fallback_profile: "gpt-5.5-high"
  reason: "The change establishes the local owner identity for sensitive financial records."

subagent_deployment_plan:
  required: false
  parallelizable: false
  roles: []
  fallback: "The primary agent retains security, architecture, migration and integration decisions."
  evidence_required: true

approved_design_proposal:
  external_principal:
    type: "TrustedSstPrincipal"
    fields:
      - "stable_subject"
      - "validated_account_id"
      - "entitlements"
      - "request_id"
      - "correlation_id"
    forbidden_fields:
      - "finance_profile_id"
      - "local_resource_owner_id"
    construction_rule: >
      Production construction remains unavailable until a concrete
      authenticated provider contract is approved and implemented.
  finance_profile:
    columns:
      - "id UUID generated by Phinance"
      - "account_id opaque bounded string"
      - "stable_subject opaque bounded string"
      - "created_at timestamp with timezone"
    uniqueness: "UNIQUE(account_id, stable_subject)"
    normalization: "Do not lowercase or destructively normalize opaque identifiers."
  provisioning:
    mode: "idempotent just-in-time"
    preconditions:
      - "authenticated trusted principal provenance"
      - "at least one explicitly accepted finance entitlement"
    transaction_rule: >
      Use PostgreSQL INSERT ON CONFLICT DO NOTHING followed by SELECT inside a
      transaction so concurrent first use returns one owner-local profile.
  migrations:
    table: "finance_profiles"
    integrity: >
      Add profile foreign keys. Stop with a documented blocker rather than
      synthesizing owners when existing rows cannot be mapped safely.
  health_and_readiness:
    health: "Process-focused /health remains 200 while the process is live."
    ready: "Readiness requires both database and trusted-principal provider."
    pre_provider_state: "Financial business traffic remains fail-closed."

atomized_execution:
  - order: 1
    id: "publish-control-plane-running-state"
    objective: "Record authorization, owner scope and retroactive ordering deviation."
    validation: "full control-plane check"
  - order: 2
    id: "port-owner-implementation"
    objective: "Port daa66e5 onto current Finanzas main from a clean worktree."
    validation: "owner contract checker, tests and diff checks"
  - order: 3
    id: "publish-owner-and-readback"
    objective: "Merge the owner PR and verify the remote commit."
    validation: "remote PR and main readback"
  - order: 4
    id: "close-control-plane-lifecycle"
    objective: "Replace running with done and record publication evidence."
    validation: "full control-plane check and remote readback"

execution:
  requires_human_approval: true
  approval_source: "The user explicitly authorized continuation on 2026-08-23."
  allowed_window: "approved-owner-local-profile-and-fail-closed-boundary"
  child_repo_mutation_allowed: true
  runtime_implementation_allowed: true
  dependency_changes_allowed: false
  migration_changes_allowed: true
  infrastructure_changes_allowed: false
  sst_child_mutation_allowed: false
  auth_child_mutation_allowed: false
  jira_write_allowed: false
  ordering_deviation: >
    Owner commit daa66e5 predates the canonical lifecycle. It is preserved but
    is not accepted as published execution until ported to current owner main.

owner_documentation:
  required: true
  status: "planned"
  owner_repo: "finanzas-personales"
  planned_owner_docs:
    - "ARDS_Phinance_API.md"
    - "specs/api/sst-integration.yaml"
    - "specs/api/personal-finance.yaml"
    - "docs/architecture/README.md"
    - "docs/api/README.md"
    - "docs/tasks/README.md"
  planned_runtime_surfaces:
    - "backend/src/phinance_api/application/"
    - "backend/src/phinance_api/infrastructure/"
    - "backend/src/phinance_api/api/"
    - "backend/alembic/versions/"
    - "backend/tests/"
    - "backend/qa/http/"

validation:
  required_checks:
    - "Owner contract checker and full owner test suite."
    - "Profile identity, isolation, concurrency, entitlement and readiness tests."
    - "Migration integrity and existing-data blocker."
    - "Remote owner PR merge and main readback."
    - "4uentes-orchestor: npm run check and git diff --check."

decision:
  status: "approved-for-owner-implementation"
  approver: "4uentes"
  approved_at: "2026-08-23"
  approval_text: "autorizo; ok avancemos"
  blocker: >
    Live trust integration remains blocked by later provider, verifier and
    integrated consumer requests.
