  allowed_window: "manual"
  branch_strategy: "control-plane-analysis-only"
  child_repo_mutation_allowed: false
  runtime_implementation_allowed: false
  jira_write_allowed: false
  implementation_boundary: >
    This request records analysis and a proposed contract boundary only. It
    does not approve child-repo edits, runtime code, migrations, SST UI work,
    auth mechanisms, market-data providers or production deployment.

policy_application:
  human_documentation_language: >
    Human-facing evidence is written in Spanish. Stable identifiers, YAML
    keys, lifecycle statuses, paths and API terms remain in technical English.
  architecture_boundary: >
    Household resources, market instruments, SST trust, financial estimates
    and cross-repo ownership remain proposals until approved by their owners.
  owner_documentation_authority: >
    Control-plane evidence records analysis and orchestration only. Final API,
    domain and capability contracts must be adopted in the
    finanzas-personales backend owner under a child-mutation CR.
  task_atomization: >
    Everyday-resource modeling, market instruments, SST consumer adoption,
    runtime implementation and integrated validation remain separate cuts.
  delegation: >
    Discovery may be delegated with path-verifiable output; architecture,
    financial semantics, sensitive-data and ownership decisions remain with
    the primary agent and human approver.
  visual_documentation: >
    Current evidence uses textual tables and prose. Any future normative
    dependency, lifecycle, sequence or logical-data map must apply the local
    visual-documentation profile or record an owner exception.
  http_qa_harness: >
    The backend owns HTTP contracts, so an approved implementation CR must add
    or explicitly except a versioned reproducible HTTP QA harness.

