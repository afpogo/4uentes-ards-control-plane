    - "sst-fend for consumer UX and fallback behavior"

proposed_domain_invariants:
  - "A household economic resource is not a regulated or market financial instrument even when the product UI calls it an everyday instrument."
  - "Useful consumption, maintenance benefit and avoided cost are different effects from market profit or investment return."
  - "Future cost and cost-of-delay values are estimates with horizon, range, assumptions and confidence; they are never posted ledger facts."
  - "Expiration or deterioration records a resource event and possible waste loss without rewriting the original purchase transaction."
  - "An instrument is a stable reference and never stores a user's mutable holding or trade event."
  - "A posted operation is an auditable fact; correction occurs through reversal and replacement, not destructive editing."
  - "Positions, cost basis, cash effects and performance are derived from posted, non-reversed operations."
  - "Cash-flow transactions and investment operations remain distinct aggregates with explicit generated links when one causes the other."
  - "Every owner record is scoped by the server-resolved finance profile based on validated account_id plus stable subject."
  - "Valuation observations are time-stamped external evidence and never rewrite operation facts."
  - "Money uses exact decimal strings, currencies use ISO 4217 and timestamps use RFC 3339 UTC."
  - "Idempotency and audit events share the same resolved owner scope as the operation."
  - "A broker or bank is not a portfolio and not an instrument; it is an optional institution associated with a financial account."
  - "A user-defined instrument can later be linked to a canonical market instrument through reconciliation, never by destructive identity replacement."

proposed_aggregate_boundaries:
  household_economic_resource:
    responsibility: "personal good or durable asset whose useful state changes through acquisition, use, time, maintenance or disposal"
    classes: ["CONSUMABLE", "DURABLE_ASSET"]
    examples: ["milk", "food", "car", "appliance", "home-equipment"]
    product_alias: "everyday instrument or home instrument"
    contract_rule: "Never expose this resource as a market or regulated financial instrument."
  household_resource_event:
    responsibility: "auditable event that changes quantity, usability or condition"
    types: ["ACQUIRE", "CONSUME", "EXPIRE", "WASTE", "MAINTAIN", "REPAIR", "DEFER", "DISPOSE"]
  economic_effect:
    responsibility: "typed consequence of a transaction or household resource event"
    types: ["CASH_OUTFLOW", "CASH_INFLOW", "QUANTITY_CHANGE", "CONDITION_CHANGE", "UTILITY_REALIZED", "WASTE_LOSS", "COST_AVOIDANCE_ESTIMATE"]
    estimation_rule: "Estimated effects never post cash or profit and always carry provenance and confidence."
  instrument:
    responsibility: "reference identity and classification"
    examples: ["cash", "term-deposit", "bond", "fund", "equity", "option", "loan", "user-defined"]
    extensions: "type-specific metadata without a sparse all-in-one table"
    identity_rule: >
      A user-defined home instrument may start with a local label and OTHER
      code, then be reconciled to a market instrument without rewriting the
      historical operations that referenced the original identity.
  instrument_identifier:
    responsibility: "versionable identifier with scheme, value, market and issuer provenance"
    schemes: ["ISIN", "TICKER", "CUSIP", "SEDOL", "LOCAL", "OTHER"]
    uniqueness_rule: "Uniqueness is scoped by scheme plus market or issuing authority, not by the raw code alone."
  financial_institution:
    responsibility: "optional reference to a broker, bank, wallet provider or other custodian"
    security_rule: "Store display identity and safe metadata only; never credentials or unmasked sensitive account secrets."
  financial_account:
    responsibility: "ownership and custody boundary under one finance profile"
    types: ["BROKERAGE", "CHECKING", "SAVINGS", "CASH", "WALLET", "OTHER"]
    aliases: ["brokerage-account", "cuenta-comitente", "cuenta-corriente", "caja-de-ahorro"]
    institution_rule: "A broker is an institution; a cuenta comitente is a BROKERAGE account at that institution."
    balance_rule: "Balances and holdings are derived from posted operation effects, not mutable account fields."
  portfolio:
    responsibility: "personal grouping of one or more financial accounts under one finance profile"
    holdings_rule: "A portfolio contains an instrument only through a derived non-zero position produced by posted operations."
    first_slice: "one default portfolio, optional user-defined instruments and manual financial accounts"
  investment_operation:
    responsibility: "immutable or reversible business event over one or more financial accounts, cash and optional instrument"
    initial_kinds: ["buy", "sell", "income", "fee", "tax", "deposit", "withdrawal", "transfer", "adjustment"]
    deferred_kinds: ["split", "subscription", "redemption", "exercise", "maturity"]
    account_rule: "A transfer identifies source and destination accounts; other operations identify the affected account."
  operation_effect:
    responsibility: "balanced cash and unit effects generated when an operation is posted"
  position:
    responsibility: "rebuildable read model by finance profile, portfolio and instrument"
  valuation_observation:
    responsibility: "as-of price and provenance used only for valuation views"
  audit_event:
    responsibility: "append-only safe metadata for decisions, posting, reversal and access"

integration_options:
  recommended:
    path: "finanzas-personales-backend -> sst-bend adapter/facade -> sst-fend"
    reason: "Matches the canonical backend-api to BFF to frontend handoff and keeps SST-specific principal translation outside Phinance-API."
  exception:
    path: "finanzas-personales-backend -> sst-fend"
    condition: "Requires an explicit architecture exception and an approved trusted principal-context mechanism."
  solution_rule: "Keep finanzas-personales independent; represent SST as a related external consumer, not as backend ownership."

