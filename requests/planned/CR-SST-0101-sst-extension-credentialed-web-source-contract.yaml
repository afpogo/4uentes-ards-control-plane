created_at: "2026-07-02"
requester: "4uentes"

summary: >
  Define the owner-level CredentialedWebSource v1 producer contract in
  sst-extension by projecting the existing explicit browser-session capture,
  session artifacts and optional private preview candidate. This slice does
  not add a new wire payload, backend SecretRef acquisition or LearningWorkspace
  acceptance flow.

initial_scope:
  solution: "sst"
  services:
    - "sst-extension"
    - "4uentes-orchestor"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-SST-0003"
  jira_epic_key: "SST-29"
  jira_issue_key: "SST-33"
  policy_ref: "docs/policies/owner-documentation-authority-policy.md"
  readiness_review_ref: "evidence/requests/CR-SST-0101/readiness-and-replan-2026-07-12.md"
  related_requests:
    - "CR-SST-0093"
    - "CR-SST-0098"
    - "CR-SST-0099"
    - "CR-SST-0100"
    - "CR-SST-0119"
    - "CR-SST-0121"
    - "CR-SST-0139"
    - "CR-SST-0103"

impact_analysis:
  required: true
  affected_services:
    - service_id: "sst-extension"
      via: "owner specs/docs for CredentialedWebSource producer contract"
      service_kind: "browser-extension"
      ards_kind: "frontend-extension"
      status: "optional-active"
    - service_id: "4uentes-orchestor"
      via: "request lifecycle and evidence"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - frontend-extension
    - credentialed-web-source
    - child-repo-owner-documentation
  capabilities:
    - "browser-extension-session-ingestion"
    - "article-preview-resolution-v1"
  risks:
    - id: SECRET_VALUE_EXPOSURE
      severity: high
    - id: CONTRACT_SCOPE_CREEP
      severity: high
    - id: DOCUMENTED_RUNTIME_OVERCLAIM
      severity: high

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "Private authenticated browser content and provenance."
    - "DictionarySecret and future backend SecretRef security boundary."
    - "Semantic alignment across existing session and preview contracts."
    - "LearningWorkspace acceptance must remain outside this slice."

model_selection:
  policy_ref: "docs/policies/agent-model-selection-policy.md"
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  selected_model: "gpt-5.6-sol"
  reasoning_effort: "max"
  fallback_profile: "gpt-5.5"
  reason: >
    The request defines a privacy-sensitive owner contract over authenticated
    browser content and must distinguish implemented runtime from future
    acceptance and secret-driven acquisition.

subagent_deployment_plan:
  required: false
  executed: false
  reason: >
    Architecture, privacy, security and cross-repo ownership decisions remain
    in the main governance flow. Repository discovery is bounded and was
    performed sequentially in this readiness review.

required_checks:
  - service_id: "sst-extension"
    command: "pnpm check"
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"

execution:
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
    service_id: "sst-extension"
  implementation_boundary: >
    Owner ARDS/SDD documentation in sst-extension only. Runtime changes are not
    required unless owner validation proves the documented projection cannot
    be represented from the existing SessionQueueItem, session ingestion and
    optional previewCandidate contracts; any such runtime expansion requires
    an explicit replan before mutation.
  owner_documentation_required: true
  jira_write_executed: true
  jira_write_ref: "evidence/initiatives/INIT-SST-0003/jira-extension-backlog-sync-summary.md"

owner_documentation:
  required: true
  status: satisfied
  owner_repo: "sst-extension"
  planned_owner_docs:
    - "specs/features/credentialed-web-source.yaml"
    - "specs/integration/node-auth-extension-session-ingestion.yaml"
    - "docs/features/credentialed-web-source.md"
    - "specs/features/00-index.yaml"
    - "specs/00-index.yaml"
  updated_owner_docs:
    - "specs/features/credentialed-web-source.yaml"
    - "docs/features/credentialed-web-source.md"
    - "specs/features/00-index.yaml"
    - "specs/00-index.yaml"
    - "specs/integration/node-auth-extension-session-ingestion.yaml"
    - "docs/00-overview.md"
  evidence_refs:
    - "evidence/requests/CR-SST-0101/implementation-and-validation-2026-07-12.md"

contract_boundary:
  source_type: "credentialed-web"
  capture_mode: "browser-session"
  producer_repo: "sst-extension"
  implemented_inputs:
    - "SessionQueueItem tabs and snapshots"
    - "visual-pdf or textual-pdf capture metadata"
    - "optional consented browser-session previewCandidate"
  provenance_rules:
    - "User action is explicit."
    - "Runtime page URL remains inside the authenticated operational flow."
    - "Owner docs, Jira and central evidence contain no private full URLs or page content."
    - "DictionarySecret plaintext and SecretRef are absent from the extension v1 contract."
  excluded_from_v1:
    - "New BFF or backend payload fields"
    - "Backend DictionarySecret or SecretRef acquisition"
    - "Automatic crawling or private URL renavigation"
    - "LearningWorkspace preview-only acceptance"
    - "KnowledgeDocument or ContentBlock materialization"
    - "rawHtml capture"

validation:
  required_checks:
    - "No plaintext DictionarySecret client flow is introduced."
    - "Producer, implemented artifacts and sanitized provenance are documented in sst-extension."
    - "The contract maps only to observed SessionQueueItem, session ingestion and previewCandidate fields."
    - "No new runtime or wire field is claimed as implemented."
    - "LearningWorkspace preview-only acceptance remains explicitly assigned to CR-SST-0102."
    - "Private authenticated QA remains assigned to CR-SST-0103."
    - "sst-extension pnpm check passes after owner-documentation mutation."
    - "Control-plane npm.cmd run check passes before closure."

decision:
  status: closed-local
  approver: "4uentes"
  decided_at: "2026-07-12"
  note: >
    CredentialedWebSource v1 owner specs/docs are adopted over existing session
    and optional preview runtime without new wire fields or runtime code.
    LearningWorkspace, hardening and final private QA remain in their existing
    requests. Jira reconciliation was not authorized in this execution window.

execution_state:
  started_at: "2026-07-12"
  completed_at: "2026-07-12"
  current_step: "closed-local"
  jira_transition_executed: true
  note: "Owner documentation and checks completed; the authorized Jira reconciliation traversed En curso, En revision and Listo with comments on 2026-07-13."

