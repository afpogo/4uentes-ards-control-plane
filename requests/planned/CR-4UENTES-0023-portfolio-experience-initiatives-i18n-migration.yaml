  predecessor_request_id: "CR-4UENTES-0022"
  feature_id: "portfolio-experience-initiatives-i18n"
  child_repo: "4uentes-portfolio"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-portfolio"
      via: "experience company detail cards, achievements, and I18N ownership"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
