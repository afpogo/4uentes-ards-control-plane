    description: "Add jira:mcp:sync-health npm script."
  - id: implement-generator
    description: "Implement local sync health classification from evidence."
  - id: run-dry-run
    description: "Run sync-health using CR-SST-0042 input evidence."
  - id: validate
    description: "Run JS syntax validation and npm run check."

validation:
  required_checks:
    - "node --check scripts/jira-mcp/generate-sync-health.js"
    - "npm run jira:mcp:sync-health -- --request-id CR-SST-0044 --input-dir evidence/requests/CR-SST-0042 --output-dir evidence/requests/CR-SST-0044"
    - "npm run check"
  evidence_required:
