summary: >
  Recover the valid kind API-port and durable ingress work from a dirty,
  historical sst-4uentes-infra tree by porting only reviewed semantic hunks to
  a future clean owner worktree. This plan is control-plane-only and does not
  authorize owner, cluster, host, runtime or Jira mutation.

