recovery_decision:
  strategy: "selective-semantic-port-to-fresh-owner-worktree"
  owner_base: "fresh-GitHub-develop-readback"
  prohibited_shortcuts:
    - "Do not commit, reset, clean, stash, rebase or switch the dirty historical owner worktree."
    - "Do not merge or cherry-pick the historical branch as a whole."
    - "Do not trust the local origin/develop ref without live remote confirmation."
    - "Do not copy excluded unrelated dirty paths."
    - "Do not replace the historical CR-SST-0210 label as if the original execution had used CR-SST-0229."
  provenance_rule: >
    New owner artifacts use CR-SST-0229 as the canonical orchestrator link and
    retain CR-SST-0210 only in an explicit historical_execution_label or prose
    note describing the lifecycle-ordering deviation.
  sensitive_content_rule: >
    Review every selected hunk before transport. Patch bodies, private URLs,
    credentials, backup locations, Secret values and host-specific paths must
    not enter control-plane evidence or Jira.

historical_runtime_claims_requiring_future_revalidation:
  - "kind API is bound at 127.0.0.1:16443 -> 6443."
  - "Docker publishes 127.0.0.1:8088 -> nginx-ingress NodePort 32080."
  - "Kubernetes and Argo CD recovered after the controlled host restart."
  - "Root, health and JWKS routes returned 200 while the unauthenticated session route returned the expected non-success response."
  - "The public edge recovered with its expected authentication redirects."

atomized_plan:
  - order: 1
    id: "publish-control-plane-plan"
    objective: "Publish this recovery decision and initiative links."
    mutation_scope: "control-plane-only"
    risk: "low"
    validation: "Full control-plane check, PR merge and canonical readback."
  - order: 2
    id: "publish-running-owner-batch"
    objective: "Enumerate the exact future owner paths and authorize selective porting only."
    mutation_scope: "control-plane-only"
    risk: "medium"
    validation: "Running lifecycle is merged and read back before owner edits."
  - order: 3
    id: "create-clean-owner-worktree"
    objective: "Read live GitHub develop, create one clean CR-SST-0229 owner branch and leave the historical tree untouched."
    mutation_scope: "future separately authorized owner Git metadata"
    risk: "medium"
    validation: "Clean status, exact remote SHA and one active owner worktree for CR-SST-0229."
  - order: 4
    id: "classify-and-port-selected-hunks"
    objective: "Manually reconcile the four overlapping paths and port only validated kind-port hunks from the four non-overlapping paths."
    mutation_scope: "future separately authorized owner files"
    risk: "high"
    validation: "No excluded path changes; canonical and historical labels remain distinguishable."
  - order: 5
    id: "validate-owner-declarative-state"
    objective: "Validate specs, runbooks, kind bootstrap and GitOps manifests without applying or recreating infrastructure."
    mutation_scope: "non-mutating owner validation"
    risk: "medium"
    validation: "Owner npm run check and git diff --check pass; no kind create, kubectl apply without client dry-run, restart or host mutation occurs."
  - order: 6
    id: "publish-owner-change"
    objective: "Commit, PR and merge the selective owner change into develop."
    mutation_scope: "future exact owner Git publication batch"
    risk: "medium"
    validation: "Owner PR diff contains only approved paths and merge is read back from live develop."
  - order: 7
    id: "revalidate-runtime-read-only"
    objective: "Recheck each historical runtime claim independently to avoid healthy-container false positives."
    mutation_scope: "future bounded read-only host, Docker, Kubernetes, Argo and HTTP probes"
    risk: "medium"
    validation: "Binding, Service/Ingress, workload readiness and HTTP route layers are reported separately."
  - order: 8
    id: "reconcile-control-plane-and-jira"
    objective: "Publish terminal sanitized evidence, then prepare the exact SST-119 correction as a separate Jira batch."
    mutation_scope: "control-plane publication; Jira write remains separately gated"
    risk: "medium"
    validation: "Owner and control-plane remote readbacks pass before any Jira authorization is requested."

runtime_false_positive_matrix:
  - layer: "host-binding"
    required_evidence: "Independent listeners for 16443 and 8088 with expected owning Docker process."
  - layer: "container-publication"
    required_evidence: "kind control-plane publishes 16443->6443 and 8088->32080."
  - layer: "kubernetes-control-plane"
    required_evidence: "cluster-info and /readyz succeed against 127.0.0.1:16443; nodes are Ready."
  - layer: "ingress-routing"
    required_evidence: "nginx Service NodePort, controller readiness and Ingress objects agree with the durable mapping."
  - layer: "application-workloads"
    required_evidence: "Required SST deployments/statefulsets are Ready and Argo is Synced/Healthy."
  - layer: "http-contract"
    required_evidence: "Root, health, JWKS and negative session routes return their independently expected status/content."

rollback_and_preservation:
  historical_tree: "Never mutate or retire until every selected hunk is integrated, rejected or preserved with explicit evidence."
  owner_candidate_before_merge: "Drop only the clean candidate branch/worktree; the historical dirty tree remains the recovery source."
  owner_after_merge: "Revert the owner commit through a reviewed PR; declarative publication alone does not authorize cluster recreation."
  runtime: "No runtime rollback applies to the planning or owner-publication phases because neither applies manifests nor recreates kind."

