schema_version: "1.0"
phase: 2
id: "CR-SST-0180"
title: "Integrate login, session and timeout corrections"
status: planned
source_request: "requests/inbox/CR-SST-0180-integrate-login-sessions-and-timeout-corrections.yaml"
created_at: "2026-08-15"
requester: "4uentes"

summary: >
  Integrate previously validated authentication controls, converge on one
  active sid family per account, add bounded client and harness requests, and
  stage aggregate security telemetry through the GitOps development flow.

control_plane_context:
  initiative_id: "INIT-SST-0008"
  related_requests: ["CR-SST-0159", "CR-SST-0178", "CR-SST-0179"]
  jira_role: "mirror"
  jira_source_of_truth: false
  jira_write_authorized: false

architecture_decision:
  session_policy: "one-active-session-family-per-account"
  stable_identity: "sid"
  login_rule: "A successful login atomically replaces the previous family for that account."
  refresh_rule: "CAS the current generation while preserving sid; exactly one concurrent refresh wins."
  logout_rule: "Revoke userId+sid terminally so no concurrent descendant can resurrect the family."
  legacy_rule: "A valid no-sid token may migrate exactly once through CAS."
  chat_contract: "Access and refresh tokens carry token_use; chat:connect and session:introspect are explicit scopes."
  timeout_rule: "Cancel after 15000 ms by default and settle client state without retrying credentials or downgrading protocol."

scope:
  child_repo_mutation_targets: ["4uentes-auth", "sst-fend", "sst-extension", "sst-bend", "sst-4uentes-infra"]
  control_plane_repository: "4uentes-orchestor"
  production_data_allowed: false
  production_rollout_allowed: false
  jira_write_allowed: false

risk:
  level: "high"
  score: 9
  drivers: ["AUTH_SECURITY", "SESSION_CONCURRENCY", "CROSS_REPO_RUNTIME", "DEVELOPMENT_GITOPS"]

task_weight:
