schema_version: "1.0"
phase: 2
id: "CR-SST-0120"
title: "Define preview image contract for session-derived articles"
status: in-progress
source_request: "requests/inbox/CR-SST-0120-session-derived-article-preview-image-contract.yaml"
created_at: "2026-07-04"
requester: "4uentes"

summary: >
  Define how articles generated from sst-extension session capture should carry
  or derive preview images when the captured artifact is textual PDF fallback,
  and generalize the behavior into a reusable URL/provided-image preview
  resolver for SST articles.

