  - evidence/requests/CR-SST-0068/admin-view-design.md
  - evidence/requests/CR-SST-0068/core-revision-decision-gate.md

required_checks:
  - service_id: sst-fend
    command: "npm run check"
  - service_id: sst-bend
    command: "npm run check"
  - service_id: 4uentes-auth
    command: "npm run check"
  - service_id: sst-4uentes-infra
    command: "TODO"
    fallback: manual-review
  - service_id: sst-extension
    command: "pnpm run check"
  - service_id: sst-chatbot
    command: ".\\.venv\\Scripts\\python.exe scripts\\check.py"

