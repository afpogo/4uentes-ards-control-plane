schema_version: "1.0"
phase: 2
id: "CR-SST-0068"
title: "Design ARDS/SDD system observability admin runtime"
status: planned
source_request: "requests/inbox/CR-SST-0068-ards-sdd-system-observability-admin-runtime.yaml"
created_at: "2026-06-12"
requester: "4uentes"

initial_scope:
  solution: "sst"
  services: []
  include_optional_services: true

design_boundary:
  objective: "Create operational visibility of ARDS/SDD synchronization across the SST system."
  request_type: "design"
  implementation_phase: "first-runtime-slice-planning"
  runtime_mode: "read-only-observability"
  refresh_semantics: "on-demand-command"
  no_automatic_child_writes: true
  no_product_runtime_changes: true
  no_core_repository_changes: true
  covered_services:
    - "sst-fend"
    - "sst-bend"
    - "4uentes-auth"
    - "sst-extension"
    - "sst-chatbot"
    - "sst-4uentes-infra"

impact_analysis:
  required: true
  affected_services:
    - service_id: sst-fend
      via: solution.core
      service_kind: frontend-spa
      ards_kind: frontend-web
      status: active
    - service_id: sst-bend
      via: solution.core
      service_kind: api
      ards_kind: backend-api
      status: active
    - service_id: 4uentes-auth
      via: solution.shared
      service_kind: shared-auth-provider
      ards_kind: shared-auth-provider
      status: active
    - service_id: sst-4uentes-infra
      via: solution.infrastructure
      service_kind: gitops-infrastructure
      ards_kind: infra-gitops
      status: active
    - service_id: sst-extension
      via: solution.optional
      service_kind: browser-extension
      ards_kind: frontend-extension
      status: optional-active
    - service_id: sst-chatbot
      via: solution.optional
      service_kind: agent-runtime
      ards_kind: backend-api
      status: active
  affected_ards:
    - frontend-web
    - backend-api
    - shared-auth-provider
    - infra-gitops
    - frontend-extension
  capabilities: []
  risks:
    - id: MULTI_SERVICE_SCOPE
      severity: high
    - id: DIRTY_WORKING_TREE_OBSERVED
      service_id: sst-fend
      severity: medium
    - id: DIRTY_WORKING_TREE_OBSERVED
      service_id: sst-bend
      severity: medium
    - id: SHARED_AUTH_PROVIDER
      service_id: 4uentes-auth
      severity: high
    - id: DIRTY_WORKING_TREE_OBSERVED
      service_id: 4uentes-auth
      severity: medium
    - id: INFRA_GITOPS_SCOPE
      service_id: sst-4uentes-infra
      severity: high
    - id: DIRTY_WORKING_TREE_OBSERVED
      service_id: sst-4uentes-infra
      severity: medium
    - id: NON_ACTIVE_SERVICE_STATUS
      service_id: sst-extension
      severity: medium
    - id: DIRTY_WORKING_TREE_OBSERVED
      service_id: sst-extension
      severity: medium
    - id: DIRTY_WORKING_TREE_OBSERVED
      service_id: sst-chatbot
      severity: medium
    - id: MISSING_CHECK_COMMAND
      service_id: sst-4uentes-infra
      severity: high

observability_read_model:
  required: true
  outputs:
    - "read-model-yaml"
    - "read-model-json"
    - "static-html-dashboard"
  repository_state_fields:
    - "sync_status"
    - "core_ref"
    - "resolved_contract_version"
    - "child_commit"
    - "dirty_state"
    - "manifest_hash"
    - "required_paths"
    - "todos_or_exceptions"
    - "latest_sync_report"
    - "local_validation"
    - "core_revision_decision"
  sync_report:
    format: "ards_child_sync_diff"
    comparison_inputs:
      - "core contract"
      - "local binding"
      - "actual child repository files"
    primary_status_criteria:
      - "contract drift"
      - "required path presence"
      - "manifest or binding mismatch"
      - "declared TODOs/exceptions"
    non_primary_status_criteria:
      - "live raw counts"
  solution_state:
    source: "solutions/sst.yaml"
    groups:
      core:
        - "sst-fend"
        - "sst-bend"
      shared:
        - "4uentes-auth"
      optional:
        - "sst-extension"
        - "sst-chatbot"
      infrastructure:
        - "sst-4uentes-infra"
    severity_rule: "Optional and infrastructure services are visible but do not block core status unless an explicit contract conflict exists."
  global_state:
    - "overall_sync_status"
    - "last_refresh"
    - "open_drift_summary"
    - "blocking_conflicts"
    - "core_revision_summary"
    - "recommended_actions"
  core_revision_gate:
    required: true
    evidence_ref: "evidence/requests/CR-SST-0068/core-revision-decision-gate.md"
    decisions:
      - "no-core-change-needed"
      - "needs-core-review"
      - "needs-child-request"
      - "unknown-needs-sync-diff"
    current_baseline:
      - service_id: "sst-fend"
        latest_evidence: "evidence/requests/CR-SST-0065/sst-fend-child-sync-diff.yaml"
        sync_status: "synced"
        candidate_for_core: 0
        conflicts: 0
        decision: "no-core-change-needed"
      - service_id: "sst-bend"
        latest_evidence: "evidence/requests/CR-SST-0065/sst-bend-child-sync-diff.yaml"
        sync_status: "synced"
        candidate_for_core: 0
        conflicts: 0
        decision: "no-core-change-needed"
      - service_id: "4uentes-auth"
        latest_evidence: "TODO"
        decision: "unknown-needs-sync-diff"
      - service_id: "sst-extension"
        latest_evidence: "TODO"
        decision: "unknown-needs-sync-diff"
      - service_id: "sst-chatbot"
        latest_evidence: "TODO"
        decision: "unknown-needs-sync-diff"
      - service_id: "sst-4uentes-infra"
        latest_evidence: "TODO"
        decision: "unknown-needs-sync-diff"
    escalation_rule: "Open a separate core review request before modifying 4uentes-ards-core when any repository is classified as needs-core-review."

admin_view:
  required: true
  artifact_type: "static-local-html"
  refresh: "manual-command-only"
  excluded_runtime_modes:
    - "watcher"
    - "polling"
    - "background daemon"
    - "production deployment"
  repository_table_columns:
    - "repository"
    - "service group"
    - "state"
    - "open drift"
    - "latest check"
    - "recommended action"
  allowed_actions:
    - "read generated state"
    - "review drift report"
    - "recommend request creation before child repo changes"
  forbidden_actions:
    - "write child repository files"
    - "apply automatic remediation"
    - "change 4uentes-ards-core"

required_context:
  - catalog/services/sst-fend.yaml
  - inventory/evidence/git/sst-fend.md
  - catalog/services/sst-bend.yaml
  - inventory/evidence/git/sst-bend.md
