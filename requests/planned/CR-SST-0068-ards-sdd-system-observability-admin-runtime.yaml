model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "High-risk or security/contract-sensitive task."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - cross-repo-impact-reviewer
    - validation-reviewer
  fallback: "If subagents, exact model aliases, or explicit authorization to spawn subagents are unavailable, record the limitation and run architecture, security/contract, cross-repo impact, and validation reviews sequentially with the highest available reasoning profile."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: manual
  branch_strategy: orchestrator-only-until-follow-up-request
  functional_repo_modifications_allowed: false
  core_repo_modifications_allowed: false
  child_repo_automatic_writes_allowed: false
  implementation_preference: "local Node scripts following scripts/verify-*.js style"

acceptance_criteria:
  - "CR-SST-0068 exists in inbox and planned lifecycle states before any implementation request modifies child repositories."
  - "Planned scope includes all services declared by solutions/sst.yaml, including optional and infrastructure services."
  - "The request records this phase as design and first runtime-slice planning, not full runtime implementation."
  - "The read model specifies repository, solution, and global state."
  - "The read model emits a core_revision_decision per repository."
  - "Per-repository reports reuse ards_child_sync_diff semantics."
  - "The admin view is static HTML generated from YAML/JSON read models."
  - "Refresh semantics are on-demand by command, with no watcher or polling in this phase."
  - "No automatic child repository writes are authorized."
  - "Optional and infrastructure drift remains visible without blocking core status unless an explicit contract conflict exists."
  - "4uentes-ards-core review is opened only by a separate request when the core revision gate returns needs-core-review."

decision:
