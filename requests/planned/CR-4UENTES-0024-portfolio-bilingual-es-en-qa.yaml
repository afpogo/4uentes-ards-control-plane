  fixes when they block validation.

initial_scope:
  solution: "4uentes"
  services:
    - "4uentes-portfolio"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-FUENTES-0001"
  product_initiative_id: "INIT-PORTFOLIO-0001"
  parent_request_id: "CR-4UENTES-0021"
  predecessor_request_ids:
    - "CR-4UENTES-0022"
    - "CR-4UENTES-0023"
  feature_id: "portfolio-bilingual-es-en-qa"
  child_repo: "4uentes-portfolio"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-portfolio"
      via: "bilingual QA and language switching"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
    - "frontend-web"
    - "i18n"
    - "qa"
    - "owner-documentation"
  capabilities:
    - "portfolio-bilingual-es-en-qa"

required_context:
  - "requests/planned/CR-4UENTES-0022-portfolio-experience-company-cards-i18n-migration.yaml"
  - "requests/planned/CR-4UENTES-0023-portfolio-experience-initiatives-i18n-migration.yaml"
  - "4uentes-portfolio: src/components/PortFolioLayout/index.tsx"
  - "4uentes-portfolio: src/pages/Dashboard/screens/Experience"
  - "4uentes-portfolio: docs/qa/visual-checklist.md"

risk:
  level: "medium"
  score: 5
  drivers:
    - "language switching is required to verify I18N migrations"
    - "bilingual copy is recruiter-facing and supports CV revalidation"
    - "QA fixes must not become broad copy rewrites"

execution:
  requires_human_approval: false
  allowed_window: "manual"
  branch_strategy: "child-repo-bilingual-qa-cut"
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
    service_id: "4uentes-portfolio"
  owner_documentation_required: true
  implementation_boundary: >
    Validate ES/EN migrated surfaces and apply only scoped fixes that block
    bilingual QA. Do not rewrite professional claims, contact policy, CV
    download gate, mobile layout, or project evidence taxonomy.

owner_documentation:
  required: true
  status: satisfied
  owner_repo: "4uentes-portfolio"
  planned_owner_docs:
    - "docs/qa/visual-checklist.md"
    - "specs/features/00-index.yaml"
  updated_owner_docs:
    - "docs/qa/visual-checklist.md"
    - "specs/features/00-index.yaml"
  owner_refs:
    - repo: "4uentes-portfolio"
      paths:
        - "docs/qa/visual-checklist.md"
        - "specs/features/00-index.yaml"
  evidence_refs:
