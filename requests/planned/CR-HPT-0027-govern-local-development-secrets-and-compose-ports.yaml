  - "The runbook names independent credential domains and a collision-free port matrix."
  - "Every owner mutation, runtime start and cluster operation remains separately gated."
  - "No secret value, private URL or user data is recorded."
  - "Jira receives exactly one En curso Task with the enumerated comments only after plan publication and duplicate preflight."

decision:
  status: "approved-for-plan-and-jira-publication-only"
  approver: "4uentes"
  decided_at: "2026-08-29"
  approval_text: "ok avancemos con el siguiente paso"
