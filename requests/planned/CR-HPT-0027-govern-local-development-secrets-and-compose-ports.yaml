schema_version: "1.0"
phase: 2
id: "CR-HPT-0027"
title: "Govern local development secrets and Docker Compose port allocation"
status: "planned"
source_request: "requests/inbox/CR-HPT-0027-govern-local-development-secrets-and-compose-ports.yaml"
created_at: "2026-08-29"
requester: "4uentes"

summary: >
  Establish one human runbook for coordinated local preparation and separate
  executable owner playbooks for Phinance, SST Bend, 4uentes Automation and
  SST infrastructure. Generate independent credentials, detect port conflicts
  before startup, preserve isolated networks and gate Kubernetes provisioning
  behind separate cluster authorization.

control_plane_context:
  initiative_id: "INIT-HPT-0002"
  predecessor_request_ids: ["CR-HPT-0021", "CR-SST-0228"]
  discovered_dependency_request_id: "CR-CP-0021"
  reservation_pull_request: 186
  reservation_head_commit: "5a38a545dc93c2807bd6d82ded34f52ef8f595fe"
  reservation_merge_commit: "07e494ead42448c5191296c84f9697a0fc59e9aa"
  planning_base: "origin/main@07e494ead42448c5191296c84f9697a0fc59e9aa"
  jira_role: "mirror"
  jira_source_of_truth: false
  jira_project_key: "HPT"
  jira_epic_key: "HPT-5"
  jira_issue_key: "HPT-19"

impact_analysis:
  required: true
  affected_services:
    - "finanzas-personales-backend"
    - "sst-bend"
    - "4uentes-automation"
    - "sst-4uentes-infra"
  future_mutable_owner_repositories:
    - "finanzas-personales"
    - "sst-bend"
    - "4uentes-automation"
    - "sst-4uentes-infra"
  current_mutation_scope: "control-plane documentation and Jira mirror only"
  architecture_change: "No shared runtime or trust network; coordination is limited to contracts, preflight and owner-owned commands."

risk:
  level: "high"
  score: 13
  drivers: ["SECRETS", "DATABASE_CREDENTIAL_ROTATION", "CROSS_REPO_OWNERSHIP", "LOCAL_RUNTIME_COORDINATION", "SHARED_CLUSTER_BOUNDARY"]

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"

model_selection:
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  primary_profile: "gpt-5.6-sol"
  reasoning_effort: "max"
  fallback_profile: "gpt-5.5 high"
  reason: "The work governs credentials, persistent databases, ports and authority across four repositories."

subagent_deployment_plan:
  mode: "none"
  reason: "No delegation was requested and proactive delegation is disabled; security and ownership decisions stay with the primary agent."

architecture_decision:
  coordination_model: "one control-plane runbook plus separate owner playbooks"
  central_secret_store_for_local_compose: false
  shared_secret_values: false
  shared_compose_project: false
  shared_docker_network: false
  control_plane_runtime_automation: false
  rationale:
    - "The control plane owns lifecycle and orchestration evidence, not product runtime automation."
    - "Each technical owner must generate and consume its own ignored local credentials."
    - "Port coordination does not require joining network or authentication boundaries."
    - "Kubernetes credentials have a different custody and authorization lifecycle from local Compose."

credential_domains:
  - id: "phinance-local-postgres"
    owner: "finanzas-personales"
    reuse_allowed: false
    current_pattern: "CSPRNG generator and ignored Docker Secret file"
  - id: "phinance-kubernetes-development-postgres"
    owner: "sst-4uentes-infra"
    reuse_allowed: false
    current_pattern: "Secret contract only; provisioning absent and separately gated"
  - id: "sst-bend-local-postgres-and-pgadmin"
    owner: "sst-bend"
    reuse_allowed: false
    current_pattern: "owner remediation required"
  - id: "automation-local-postgres-pgadmin-and-n8n-key"
    owner: "4uentes-automation"
    reuse_allowed: false
    current_pattern: "base .env bootstrap remediation required"
  - id: "automation-provider-credentials"
    owner: "4uentes-automation and human/provider custodian"
    reuse_allowed: false
    current_pattern: "human supplied; generation is outside this lifecycle"

target_local_port_contract:
  bind_policy: "loopback-only for local host surfaces unless an owner contract records an exception"
  entries:
    - {owner: "sst-bend", surface: "api", variable: "SST_API_HOST_PORT", default: 3005}
    - {owner: "sst-bend", surface: "scrapper", variable: "SST_SCRAPPER_HOST_PORT", default: 3200}
    - {owner: "sst-bend", surface: "postgres", variable: "SST_POSTGRES_HOST_PORT", default: 5432}
    - {owner: "sst-bend", surface: "pgadmin", variable: "SST_PGADMIN_HOST_PORT", default: 5051}
    - {owner: "4uentes-automation", surface: "n8n", variable: "N8N_HOST_PORT", default: 5678}
    - {owner: "4uentes-automation", surface: "pgadmin", variable: "N8N_PGADMIN_HOST_PORT", default: 5050}
    - {owner: "finanzas-personales", surface: "api", variable: "PHINANCE_API_HOST_PORT", default: 8766}
  internal_only:
    - "finanzas-personales PostgreSQL"
    - "4uentes-automation PostgreSQL"

playbook_contract:
  default_mode: "Plan/Preflight with no mutations"
  operations:
    - id: "prepare-local-secrets"
      authorization: "future owner slice"
      requirement: "CSPRNG, ignored files, restrictive ACL, no stdout value and overwrite refusal"
    - id: "validate-ports"
      authorization: "read-only"
      requirement: "inspect Compose configuration, Docker reservations and host listeners before startup"
    - id: "validate-compose"
      authorization: "read-only"
      requirement: "render each project independently without exposing interpolated secret values in evidence"
    - id: "start-local"
      authorization: "future explicit runtime operation"
      requirement: "start owner projects independently after successful preflight"
    - id: "rotate"
      authorization: "future explicit database-aware operation"
      requirement: "coordinate database role, consumers, rollback and persistent volume state"
    - id: "provision-cluster-secret"
      authorization: "future exact infrastructure batch"
      requirement: "fixed context and namespace, independent credential and no command-line literal values"

atomized_plan:
  - order: 1
    id: "publish-control-plane-plan-and-mirror"
    objective: "Publish this plan, the human runbook map and one Jira Task under HPT-5."
    mutation_scope: "control-plane and exact Jira batch only"
    validation: "Full check, Git merge/readback and Jira duplicate/readback evidence pass."
  - order: 2
    id: "reconcile-automation-onboarding"
    objective: "Require canonical publication of CR-CP-0021 before any 4uentes-automation mutation."
    mutation_scope: "dependency reconciliation only"
    validation: "CR-CP-0021 and the canonical 4uentes-automation identity are reachable from the approved base."
  - order: 3
    id: "adopt-sst-bend-local-secret-and-port-contract"
    objective: "Replace embedded Compose credentials, bind host surfaces to loopback and parameterize owner-prefixed ports."
    mutation_scope: "future separately authorized clean sst-bend worktree"
    validation: "Owner docs, secret-safe static review, Compose render and database-aware bootstrap tests pass."
  - order: 4
    id: "adopt-automation-local-secret-and-port-contract"
    objective: "Generate the base local secrets safely and parameterize n8n and pgAdmin ports without changing trust networks."
    mutation_scope: "future separately authorized clean 4uentes-automation worktree"
    validation: "Owner docs/specs/checks, Compose render and secret-safe bootstrap tests pass."
  - order: 5
    id: "reconcile-phinance-local-owner-pattern"
    objective: "Reuse the published CR-HPT-0021 generator and add only contract gaps proven by the common runbook."
    mutation_scope: "future separately authorized clean finanzas-personales worktree if changes are required"
    validation: "Existing generator remains CSPRNG-based, localhost-only and independent from Kubernetes credentials."
  - order: 6
    id: "provision-phinance-kubernetes-secret"
    objective: "Implement the owner provisioning path only after storage encryption or an explicit temporary-risk decision."
    mutation_scope: "future exact sst-4uentes-infra and shared-cluster batch"
    validation: "Owner checks, fixed context/namespace, required key names and sanitized runtime readback pass."
  - order: 7
    id: "run-integrated-synthetic-local-qa"
    objective: "Prove collision-free concurrent startup, health, teardown and repeatability with synthetic data."
    mutation_scope: "future explicit local runtime batch"
    validation: "All allocated ports are unique, stacks retain isolated networks and no secret value enters evidence."

rollback_and_rotation:
  compose_config_rollback: "Restore the last approved owner Compose configuration and port defaults."
  secret_file_rollback: "Do not overwrite existing material automatically; preserve the previous credential until every consumer and database role has switched."
  persistent_database_rule: "A password file replacement alone does not rotate an initialized PostgreSQL role."
  ephemeral_phinance_rule: "Volume teardown is allowed only through an explicit disposable-data authorization."
  kubernetes_rule: "Cluster Secret rotation and rollback remain infrastructure-owned and independently authorized."

owner_documentation:
  required: true
  status: "planned-for-future-authorized-owner-slices"
  repositories:
    - repo: "finanzas-personales"
      planned_surfaces: ["backend/docs/deployment/", "backend/specs/deployment/", "compose.yaml", "backend/scripts/"]
    - repo: "sst-bend"
      planned_surfaces: ["AGENTS.md", "docs/", "specs/", "docker-compose.yml", "docker-compose.override.yml", ".env.example", "scripts/"]
    - repo: "4uentes-automation"
      planned_surfaces: ["AGENTS.md", "docs/operations/", "specs/system/", "docker-compose.yml", ".env.example", "scripts/"]
    - repo: "sst-4uentes-infra"
      planned_surfaces: ["docs/runbooks/", "specs/infra/deployment-contracts/", "scripts/", "k8s-manifests/"]

execution:
  approval_status: "approved-for-plan-and-jira-publication-only"
  control_plane_mutation_allowed: true
  git_plan_publication_allowed: true
  jira_write_allowed: true
  jira_write_scope: "Create exactly one Task for CR-HPT-0027 under HPT-5, start it as En curso, add the enumerated start and progress comments, and read it back after duplicate preflight; do not assign or perform other writes."
  child_repo_mutation_allowed: false
  local_runtime_mutation_allowed: false
  cluster_mutation_allowed: false
