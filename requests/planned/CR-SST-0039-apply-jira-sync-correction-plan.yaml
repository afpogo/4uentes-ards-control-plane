schema_version: "1.0"
phase: 2
id: "CR-SST-0039"
title: "Apply Jira sync correction plan for feature-state tickets"
status: planned
source_request: "requests/inbox/CR-SST-0039-apply-jira-sync-correction-plan.yaml"
created_at: "2026-06-07"
requester: "4uentes"

initial_scope:
  solution: "sst"
  services: []
  include_optional_services: false

impact_analysis:
  required: true
  affected_services: []
  affected_ards: []
  capabilities:
    - jira-mcp-ticketing
    - jira-backlog-sync-state-machine
    - control-plane-process-lifecycle
  risks:
    - id: EXTERNAL_JIRA_WRITE
      severity: high
    - id: DUPLICATE_JIRA_ISSUE
      severity: high
    - id: INCORRECT_ISSUE_DESCRIPTION_UPDATE
      severity: high

control_plane_scope:
  repository: "4uentes-orchestor"
  reason: "This request writes to Jira as an external mirror and records evidence in the control-plane. It does not modify functional repositories."

required_context:
  - "requests/planned/CR-SST-0038-resolve-sst-tag-prefix-engine-jira-ambiguity.yaml"
  - "evidence/requests/CR-SST-0038/ambiguity-resolution.md"
  - "docs/requests/jira-write-connection-contract.md"
  - "evidence/requests/CR-SST-0039/jira-write-connection-definition.md"
  - "environments/local/jira-writer.local.example.yaml"
  - "scripts/jira-mcp/doctor.js"
  - "scripts/jira-mcp/update-existing-issues.js"
  - "scripts/jira-mcp/create-issues.js"

required_checks:
  - service_id: 4uentes-orchestor
    command: "npm run check"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:metadata -- --connect --request-id CR-SST-0039 --output-dir evidence/requests/CR-SST-0039"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:duplicates -- --connect --request-id CR-SST-0039 --output-dir evidence/requests/CR-SST-0039"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:reconcile -- --connect --request-id CR-SST-0039 --output-dir evidence/requests/CR-SST-0039"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:doctor -- --request-id CR-SST-0039 --output-dir evidence/requests/CR-SST-0039 --mode read-only"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:policy-check -- --request-id CR-SST-0039 --output-dir evidence/requests/CR-SST-0039 --expected-count 9"

risk:
  level: high
  score: 9
  drivers:
    - id: EXTERNAL_JIRA_WRITE
      severity: high
    - id: DUPLICATE_JIRA_ISSUE
      severity: high
    - id: INCORRECT_ISSUE_DESCRIPTION_UPDATE
      severity: high

task_weight:
  classification: complex-high-risk-task
  risk_level: high
  drivers:
    - EXTERNAL_JIRA_WRITE
    - EXTERNAL_MCP_CONNECTIVITY
    - CONTROL_PLANE_PROCESS_LIFECYCLE

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The task performs external Jira writes and must preserve control-plane authority and evidence."

subagent_deployment_plan:
  required: true
  parallelizable: false
  roles:
    - security-contract-reviewer
    - validation-reviewer
  fallback: "If subagent tools are unavailable or not explicitly requested, the main agent must perform write-boundary and validation review sequentially."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: manual
  branch_strategy: control-plane-only
  read_only_boundary:
    allowed:
      - "refresh Jira metadata through MCP"
      - "refresh Jira duplicate search through MCP"
      - "refresh Jira reconciliation through MCP"
      - "run doctor and policy-check"
      - "write non-secret evidence"
    forbidden:
      - "modify functional repositories"
      - "store tokens, cookies, private URLs, cloudId, or OAuth material in Git"
  write_boundary:
    allowed_after_approval:
      - "edit Jira issue descriptions selected by correction-plan-preview.json"
      - "create Jira issue candidates selected by correction-plan-preview.json"
    required_before_write:
      - "Jira writer connection definition exists"
      - "writer/gateway or manual operator origin is authorized"
      - "writer actor has minimal Jira permissions for SST"
      - "doctor summary under CR-SST-0039"
      - "correction plan preview under CR-SST-0039"
      - "policy-check PASS under CR-SST-0039"
      - "blocked correction items equals 0"
      - "human approval for Jira write actions"

implementation_steps:
  - id: refresh-read-only-evidence
    description: "Run metadata, duplicate search, and reconciliation under CR-SST-0039."
  - id: generate-write-plan
    description: "Run doctor and policy-check under CR-SST-0039."
  - id: request-write-approval
    description: "Ask for explicit approval before executing update/create commands."
  - id: define-write-connection
    description: "Define the authorized Jira writer connection, actor, auth method, allowlist checks, and local config contract."
  - id: apply-updates
    description: "Run update-existing against correction-plan-preview.json if approved."
  - id: apply-creates
    description: "Run create against correction-plan-preview.json if approved."
  - id: validate
    description: "Record write evidence and run npm run check."

validation:
  required_checks:
    - "npm run check"
    - "read-only Jira metadata, duplicate search, and reconciliation refreshed under CR-SST-0039"
    - "doctor has blocked=0 under CR-SST-0039"
    - "policy-check PASS under CR-SST-0039"
    - "write evidence recorded for update/create actions if approved"
  evidence_required:
    - "jira_write_connection_definition"
    - "jira_required_fields_summary"
    - "duplicate_search_summary"
    - "jira_reconciliation_summary"
    - "doctor_summary"
    - "correction_plan_preview"
    - "jira_update_summary"
    - "created_ticket_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "This request is not complete until write evidence exists or write approval is explicitly denied."
  - "After runtime write blocking, this request requires an authorized writer/gateway or manual operator connection before retrying Jira writes."
  - "No functional repositories are modified."
