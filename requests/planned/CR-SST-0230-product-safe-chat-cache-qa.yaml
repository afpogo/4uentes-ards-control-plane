validation:
  - "sst-bend focused unit/HTTP tests prove request-scoped hit, miss and bypass semantics, empty-array hit, mixed-partition precedence and Redis failure behavior."
  - "sst-bend tests prove ordinary message/event append advances the generation and no stale fill can resurrect a previous generation."
  - "sst-bend npm run check and git diff --check."
  - "4uentes-auth tests prove the exact history-only enum allowlist, body/status parity, malformed header drop and absence on upstream errors."
  - "4uentes-auth npm run check and git diff --check."
  - "CR-SST-0207 integrated harness proves miss, hit, bounded invalidation, miss, hit and product-contract cleanup through the Auth facade."
  - "Evidence contains no token, cookie, credential, message/event body, principal, conversation ID, Redis key, private URL or datastore error detail."
  - "4uentes-orchestor npm run check before plan publication, running publication and closure."

acceptance:
  - "A successful saved-history response exposes exactly one X-SST-Chat-History-Cache value: hit, miss or bypass."
  - "The first history read after an ordinary committed turn reports miss and the next identical read reports hit when Redis is available."
  - "Redis unavailability reports bypass while returning the authoritative PostgreSQL body without a false deletion or failure claim."
  - "Auth forwards only a valid outcome for successful history and never exposes other upstream cache/timing metadata."
  - "History bodies, status codes, ownership checks, durable write ordering and the existing Socket.IO boundary remain unchanged."
  - "QA never calls Redis directly, never receives cache keys and never uses an administrative eviction endpoint."
  - "No change reaches sst-fend, sst-chatbot, Infra, schema, secrets, production or direct GitOps."

