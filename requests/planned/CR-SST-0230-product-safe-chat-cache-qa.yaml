contract:
  route:
    bend: "GET /4uentes/v1/chat/conversations/:id/messages"
    auth_facade: "GET /api/chat/conversations/:id/messages"
  response_header:
    name: "X-SST-Chat-History-Cache"
    values: ["hit", "miss", "bypass"]
    emission_scope: "successful 200 history responses only"
    body_change: "none"
  outcome_semantics:
    hit: "Both saved-history partitions, messages and events, were served from the current Redis generation. An empty cached array still counts as a hit."
    miss: "Redis was usable but at least one saved-history partition was absent for the current generation and PostgreSQL supplied that partition before cache fill."
    bypass: "The conversation used the volatile path, Redis was not configured, or Redis was unavailable and PostgreSQL served saved history fail-open."
    combined_precedence: "bypass over miss over hit"
  bend_rules:
    - "Compute the outcome from request-scoped read results; never store a last outcome in mutable process-global or singleton state."
    - "Keep PostgreSQL ownership revalidation before history and preserve PostgreSQL as the durable authority."
    - "Cache errors never alter the successful body/status and never become false hit or miss claims."
    - "Do not emit the header on validation, authentication, authorization, not-found or other error responses."
  auth_rules:
    - "Forward the header only for successful history responses and only when its normalized value is exactly hit, miss or bypass."
    - "Drop absent, repeated, malformed or unknown values and all other upstream cache or timing metadata."
    - "Do not persist, log, reinterpret or synthesize a cache outcome in 4uentes-auth."
  forbidden_metadata:
    - "conversation ID"
    - "tenant, account, user or session identity"
    - "message or event content"
    - "Redis key, host, URL or credential"
    - "PostgreSQL query or private URL"
    - "latency, key cardinality or datastore error detail"
  invalidation_sequence:
    - "Create a temporary conversation through the authenticated Auth facade."
    - "Produce one synthetic turn through the existing protected Socket.IO product path."
    - "Save the conversation explicitly through the Auth facade."
    - "Read history twice through Auth to observe miss then hit and warm the current generation."
    - "Produce another ordinary synthetic turn; its committed message/event append advances the existing cache generation."
    - "Read history twice through Auth to observe miss then hit after bounded product-owned invalidation."
    - "Delete the saved conversation through the Auth facade and verify the existing terminal behavior."

