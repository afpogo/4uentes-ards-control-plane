implementation:
  - "Create an isolated Infra worktree from current origin/develop and preserve unrelated user work."
  - "Set CHAT_RETENTION_V1_ENABLED=true and CHAT_TEMPORARY_TTL_SECONDS=120 only in the development overlay."
  - "Update Infra owner specs, state and runbook with the QA-only configuration, rollback and orchestrator link."
  - "Run the full Infra check, Kustomize render, client dry-run and secret-safe diff review."
  - "Publish and merge the Infra PR, then observe Argo reconciliation without direct apply."
  - "Diagnose localhost:8088 and request an exact operational gate if recovery requires restart or recreation."
  - "Verify localhost and reserved-ngrok reachability before handing control back to CR-SST-0207."

owner_documentation:
  required: true
  status: "planned"
  owner_repos: ["sst-4uentes-infra"]
  planned_surfaces:
    - "specs/infra/environments/development.yaml"
    - "specs/infra/deployment-contracts/sst-bend.yaml"
    - "specs/states/enable-development-retention-qa.yaml"
    - "docs/runbooks/argocd-kind-development.md"

validation:
  - "Infra npm run check."
  - "Development Kustomize render and kubectl dry-run=client."
  - "Rendered ConfigMap contains true and 120 only for development."
  - "Argo CD reports Synced/Healthy at the merged revision."
  - "localhost JWKS returns 200 and the reserved public edge reaches the same ingress surface."
  - "4uentes-orchestor npm run check before handoff or closure."

acceptance:
  - "Development enables retention through GitOps without changing production defaults."
  - "The temporary TTL is 120 seconds and is documented as a QA-only override."
  - "The durable localhost endpoint and reserved ngrok edge are both usable for CR-SST-0207."
  - "No secret value, credential, token, cookie or private URL is recorded."

rollback: >
  Revert the Infra PR so development returns to CHAT_RETENTION_V1_ENABLED=false
  and CHAT_TEMPORARY_TTL_SECONDS=86400, then let Argo CD reconcile. Runtime
  recovery actions use the separately approved operational rollback.

decision:
  status: "approved-running-publication"
