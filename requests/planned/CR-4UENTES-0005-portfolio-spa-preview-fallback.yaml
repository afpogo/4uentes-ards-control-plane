      via: "Vite preview/dev middleware and owner documentation"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
    - "preview-routing"
    - "browser-smoke"
    - "publication-readiness"
  capabilities:
    - "portfolio-spa-preview-fallback"
  risks:
    - id: "DIRECT_ROUTE_404"
      severity: "high"
    - id: "PREVIEW_DIFFERS_FROM_STATIC_HOSTING"
      severity: "medium"

required_context:
