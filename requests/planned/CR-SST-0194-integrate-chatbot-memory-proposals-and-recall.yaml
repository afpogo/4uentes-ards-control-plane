      Version and implement trusted tenant/account/user/application scope before
      chatbot memory integration starts.
  execution_blocked_until:
    - "The global CR namespace is reconciled without rewriting existing identities."
    - "The identity-scope predecessor receives a free ID, approval, implementation and closure evidence."
    - "CR-SST-0193 is locally closed after its normal identity path passes."
