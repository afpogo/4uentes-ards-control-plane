  - id: "chatbot-memory-adapters"
    objective: "Compose governed proposal and recall adapters with bounded provider context."
    owners: ["sst-chatbot"]
    risk: "high"
    validation: "Fake-provider proposal, recall, citations, cancellation and secret-boundary tests."
  - id: "integrated-memory-smoke"
    objective: "Prove real login through cross-session cited recall without provider-owned memory."
    owners: ["4uentes-auth", "sst-bend", "sst-chatbot"]
    risk: "high"
    validation: "All owner checks plus the full control-plane check."
