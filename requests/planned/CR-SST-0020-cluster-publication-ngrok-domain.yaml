subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - cross-repo-impact-reviewer
    - validation-reviewer
  fallback: "If subagents or exact model aliases are unavailable, record the limitation and run the same review steps sequentially with the highest available reasoning profile."
  evidence_required: true

publication_analysis:
  local_entrypoint_observed: "http://localhost:8088/"
  target_outcome: "internet-accessible productive domain through ngrok"
  analysis_tracks:
    - id: current-cluster-state
      owner_role: cross-repo-impact-reviewer
      required_evidence:
        - "kubectl context, namespaces, pods, services, ingress, images and Argo CD app state"
    - id: ingress-and-ngrok-edge
      owner_role: architecture-reviewer
      required_evidence:
        - "current ingress hosts and paths"
        - "ngrok tunnel or edge options"
        - "TLS and hostname routing implications"
    - id: auth-public-exposure
      owner_role: security-contract-reviewer
      required_evidence:
        - "CORS, cookies, CSRF, callback URLs and public API/JWKS exposure"
    - id: branch-and-image-policy
      owner_role: cross-repo-impact-reviewer
      required_evidence:
        - "current develop/dev image references"
        - "main branch feasibility"
        - "tag or digest promotion recommendation"
    - id: validation-and-release-gates
      owner_role: validation-reviewer
      required_evidence:
        - "local ingress smoke"
        - "public ngrok smoke"
        - "rollback path"
  constraints:
    - "Do not change child repositories before analysis evidence is recorded."
    - "Do not switch GitOps branch or image tags without a separate approved execution step."
    - "Treat ngrok/domain secrets and tokens as secrets; never commit live values."

execution:
  requires_human_approval: true
  allowed_window: manual
  branch_strategy: one-branch-per-repo

