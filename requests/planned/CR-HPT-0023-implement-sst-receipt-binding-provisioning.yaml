api_contract:
  base_path: "/4uentes/v1/integrations/receipt-intake/binding"
  operations:
    - "GET /4uentes/v1/integrations/receipt-intake/binding"
    - "POST /4uentes/v1/integrations/receipt-intake/binding"
    - "POST /4uentes/v1/integrations/receipt-intake/binding/rotate"
    - "DELETE /4uentes/v1/integrations/receipt-intake/binding"
  middleware: [verifyJWT, resolveAccountContext, "requireAccountRole([owner])"]
  account_source: "req.accountContext from active SST membership"
  binding_id: "rb_ plus at least 128 bits of CSPRNG entropy"
  active_cardinality: "one per account"
  lifetime_days: 90
  rotation: "atomic revoke old and create replacement"

owner_documentation:
  required: true
  status: "planned"
  owner_repo: "sst-bend"
  planned_owner_docs:
    - "specs/api/receipt-intake-binding-v1.yaml"
    - "specs/capabilities/outbound/receipt-intake-binding-provisioning-v1.yaml"
    - "docs/api/30-receipt-intake-binding.md"
    - "docs/capabilities/outbound/receipt-intake-binding-provisioning-v1.md"
    - "docs/tasks/2026-08-28-cr-hpt-0023-receipt-binding-provisioning.md"

implementation_plan:
  - "Create an isolated SST worktree preserving the CR-HPT-0019 local owner result."
  - "Add a reversible schema extension for account ownership, stable reviewer membership references, expiry and revocation."
  - "Implement owner-only get/create/rotate/revoke use cases using existing account middleware."
  - "Generate opaque binding IDs with at least 128 bits of entropy and enforce one active binding per account."
  - "Resolve reviewer membership IDs against active memberships of the same account."
  - "Publish owner API/capability docs, unit/contract tests and an HTTP harness."
  - "Run npm run check in SST and the full control-plane npm run check."

validation:
  owner_command: "npm run check"
  focused_command: "node scripts/test-receipt-binding-provisioning.js"
  control_plane_command: "npm run check"

