  policy_ref: "docs/policies/agent-model-selection-policy.md"
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  primary_profile: "gpt-5.6-sol"
  reasoning_effort: "max"
  fallback_profile: "gpt-5.5-high"

subagent_deployment_plan:
  required: false
  roles: []
  reason: "RBAC, account authority and persistence decisions remain with the primary agent under the current core delegation policy."

execution:
  requires_human_approval: true
  approval_source: "User instructed implementation of the five enumerated gates on 2026-08-28."
  child_repo_mutation_allowed: true
  owner_repo: "sst-bend"
  active_owner_worktree_mutation_allowed: false
  isolated_worktree_required: true
  isolated_base_ref: "feat/CR-HPT-0019/receipt-intake-acceptance@72a406d plus its preserved local owner result"
  isolated_branch: "feat/CR-HPT-0023/receipt-binding-provisioning"
  isolated_worktree_path: "worktrees/CR-HPT-0023-sst-owner"
