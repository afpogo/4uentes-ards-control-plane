architecture_decision:
  session_policy: "multiple-independent-session-families-per-account"
  stable_identity: "sid"
  active_store: "one mutable refresh-family record per sid"
  refresh_rule: "CAS the exact current generation and preserve sid; exactly one concurrent refresh may win."
  logout_rule: "Normal logout revokes only userId+sid; logout-all remains a separate operation."
  legacy_rule: "A valid refresh without sid may migrate exactly once through exact-generation CAS."
  ambiguous_write_rule: "Fail closed and require re-login; never retry an old refresh automatically."
  reuse_rule: "Observe before enforce; enforcement requires completed client-coordination gates and separate approval."
