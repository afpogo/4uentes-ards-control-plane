schema_version: "1.0"
phase: 2
id: "CR-CP-0004"
title: "Promote Initiative model to core"
status: "planned"
source_request: "requests/inbox/CR-CP-0004-core-initiative-model.yaml"
created_at: "2026-07-07"
requester: "4uentes"

summary: >
  Promote the local Initiative model as a reusable ARDS/SDD construct for
  grouping broad outcomes, CRs, evidence, and optional Jira Epic mirrors.

control_plane_context:
  initiative_id: "INIT-CP-0002"
  parent_initiative_id: "INIT-CP-0001"
  related_jira_epic_key: "SST-36"
  target_jira_epic_key: "ARDS-1"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-orchestor"
      via: "local initiative model source"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
    - service_id: "4uentes-ards-core"
      via: "future core initiative model/template"
      service_kind: "ards-standard-source"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - "initiative"
    - "request-lifecycle"
    - "jira-mirror"

required_context:
  - "specs/initiatives/initiative-model.yaml"
  - "docs/requests/initiative-model.md"
  - "initiatives/00-index.yaml"
  - "scripts/verify-initiatives.js"

risk:
  level: "medium"
  score: 6
  drivers:
    - "Jira Epic must remain mirror, not source of truth"
    - "core model must not import local initiative IDs or evidence"

execution:
  requires_human_approval: true
  allowed_window: "manual"
  branch_strategy: "separate-core-promotion-branch"
  child_repo_mutation_allowed: false
  core_repo_mutation_allowed: true
  implementation_boundary: >
    Promote Initiative shape, statuses, and template. Keep concrete INIT files
    local to the orchestrator.

jira:
  role: "mirror"
  source_of_truth: false
  project_key: "ARDS"
  mirror_project_key: "ARDS"
  epic_key: "ARDS-1"
  related_epic_key: "SST-36"
  replaced_misplaced_epic_key: "PORT-12"
  issue_key: "ARDS-5"
  replaced_misplaced_issue_key: "PORT-16"
  desired_artifact: "Task under the new INIT-CP-0002 Epic"
  sync_ref: "evidence/initiatives/INIT-CP-0002/jira-epic-sync-summary.md"

validation:
  required_checks:
    - "4uentes-orchestor: npm.cmd run check:initiatives"
    - "4uentes-orchestor: npm.cmd run check"
    - "4uentes-ards-core: core initiative template validation command, TODO"
  evidence_required:
    - "initiative_model_core_mapping"
    - "jira_mirror_boundary_decision"
    - "validation_results"

decision:
  status: "pending"
  approver: "TODO"
