schema_version: "1.0"
phase: 2
id: "CR-SST-0093"
title: "Define credentialed web source and session PDF capture boundary"
status: planned
source_request: "requests/inbox/CR-SST-0093-credentialed-web-source-session-pdf-capture.yaml"
created_at: "2026-06-30"
requester: "4uentes"

summary: >
  Define CredentialedWebSource as a future governed SST input that can use
  either an authenticated browser session from sst-extension or, later, a
  backend-controlled DictionarySecret reference. This request records the
  current sst-extension session PDF capture gap and keeps child repository
  mutation out of scope.

initial_scope:
  solution: "sst"
  services:
    - "4uentes-orchestor"
  include_optional_services: false

control_plane_context:
  related_secret_request: "CR-SST-0086"
  related_learning_requests:
    - "CR-SST-0088"
    - "CR-SST-0089"
    - "CR-SST-0090"
  governing_jira_issue_key: "SST-26"
  jira_role: "mirror"
  jira_source_of_truth: false

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-orchestor"
      via: "request lifecycle, evidence, feature state, documentation"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
    - service_id: "sst-extension"
      via: "read-only discovery; future implementation target"
      service_kind: "browser-extension"
      ards_kind: "frontend-extension"
      status: "optional-active"
    - service_id: "sst-bend"
      via: "future credentialed source and artifact acceptance target"
      service_kind: "api"
      ards_kind: "backend-api"
      status: "active"
    - service_id: "sst-fend"
      via: "future Dictionary/LearningWorkspace UI target"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
    - control-plane
    - request-lifecycle
    - evidence
    - dictionary-secret-management-v1
    - learning-content-preview-import
    - browser-extension-session-capture
    - credentialed-web-source
  capabilities:
    - "dictionary-secret-management-v1"
    - "learning-content-tags"
  risks:
    - id: PRIVATE_PAGE_CAPTURE_LEAK
      severity: high
    - id: SECRET_VALUE_EXPOSURE
      severity: high
    - id: SILENT_TEXT_FALLBACK_AS_VISUAL_PDF
      severity: high
    - id: TAB_FOCUS_AND_SESSION_STATE_DISRUPTION
      severity: medium
    - id: CHILD_REPO_SCOPE_CREEP
      severity: medium

required_context:
  - "AGENTS.md"
  - "specs/integration/policies.yaml"
  - "docs/policies/"
  - "docs/requests/dictionary-secret-management-contract.md"
  - "state/features/dictionary-secret-management.current.yaml"
  - "requests/planned/CR-SST-0086-dictionary-secret-release-readiness.yaml"
  - "evidence/requests/CR-SST-0088/learning-source-model.md"
  - "evidence/requests/CR-SST-0089/runtime-contract.md"
  - "sst-extension/specs/features/sessions.yaml"
  - "sst-extension/specs/features/text-article-pdf.yaml"
  - "sst-extension/src/features/sessions/create-session-capture-service.ts"
  - "sst-extension/src/platform/tabs/capture-session-tab-fullpage-pdf.ts"

required_checks:
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"

risk:
  level: high
  score: 8
  drivers:
    - PRIVATE_PAGE_CAPTURE_LEAK
    - SECRET_VALUE_EXPOSURE
    - SILENT_TEXT_FALLBACK_AS_VISUAL_PDF
    - TAB_FOCUS_AND_SESSION_STATE_DISRUPTION
    - CHILD_REPO_SCOPE_CREEP

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "Private authenticated web pages can contain sensitive user-owned information."
    - "Future DictionarySecret usage must not reveal plaintext to UI, agents, logs, or evidence."
    - "The current browser extension capture path affects user tabs and session state."
    - "The request crosses dictionary secrets, browser extension capture, and LearningWorkspace ingestion boundaries."

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-high-reasoning-profile"
  reason: >
    The work defines a privacy/security boundary across credentialed content
    acquisition, browser session capture, and future secret use.

subagent_deployment_plan:
  required: false
  parallelizable: false
  roles: []
  fallback: "Main agent performed read-only child repo discovery and control-plane documentation because no child repo mutation is executed in this request."
  evidence_required: true

execution:
  requires_human_approval: false
  allowed_window: manual
  branch_strategy: "control-plane-only"
  implementation_boundary: >
    This request may modify only 4uentes-orchestor request, evidence, state, and
    documentation files. It must not modify sst-extension, sst-bend, sst-fend,
    4uentes-auth, infra repos, or 4uentes-ards-core. Future child repo work must
    be opened as a separate approved implementation request.
  child_repo_mutation_allowed: false
  future_child_repo_target:
    service_id: "sst-extension"
    reason: "Fix session capture so each tab is foregrounded, settled, captured, classified, and the original active tab is restored."

validation:
  required_checks:
    - "Control-plane validation passes."
    - "Evidence distinguishes observed facts from recommended changes."
    - "No plaintext secret, cookie, JWT, private page payload, or captured page content is stored in evidence."
    - "No child repository files are modified."
  evidence_required:
    - "session_pdf_capture_gap_analysis"
    - "credentialed_web_source_boundary"
    - "future_implementation_plan"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "text-article-pdf remains valid as a single active-tab textual PDF path."
  - "Session capture, not text-article-pdf, is the expected path for multi-tab private web sessions."
  - "CredentialedWebSource v1 should prefer extension-driven browser-session capture before backend DictionarySecret-driven capture."
  - "Backend secret-driven capture must use SecretRef and policy, never plaintext secret transfer to frontend or agents."
