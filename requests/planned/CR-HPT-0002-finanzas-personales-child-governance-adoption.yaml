      - "finanzas-personales-backend"
  owner_documentation_required: true
  implementation_boundary: >
    Change only AGENTS, docs, specs, policy manifests, control-plane linkage and
    validation metadata. Do not implement UI, API, auth, persistence, OCR or AI.

owner_documentation:
  required: true
  status: planned
  owner_repo: "finanzas-personales"
  planned_owner_docs:
    - "docs/policies/README.md"
    - "specs/00-index.yaml"
    - "specs/ards/contract-binding.yaml"
    - "specs/integration/policies.yaml"
  owner_refs:
    - repo: "finanzas-personales/backend"
      paths:
        - "docs/policies/README.md"
        - "specs/00-index.yaml"
        - "specs/ards/contract-binding.yaml"
        - "specs/integration/policies.yaml"

jira:
  role: "mirror"
  source_of_truth: false
  project_key: "HPT"
  epic_key: "HPT-1"
  issue_key: "HPT-3"
  issue_type: "Tarea"
  current_status_observed: "Por hacer"
  execution_authorized: false

validation:
  required_checks:
    - "finanzas-personales backend: .venv/Scripts/python.exe -m pytest"
