  - "4uentes-ards-core: standard/ARDS_BACKEND_API_CORE_PROFILE_v1.md"
  - "finanzas-personales: frontend/AGENTS.md"
  - "finanzas-personales: backend/AGENTS.md"

risk:
  level: "medium"
  score: 6
  drivers:
    - "request-driven child repo mutation"
    - "historical two-root plan is reconciled to one active backend owner"
    - "policy adoption must not redefine core canon"

task_weight:
  classification: "long-context-task"
  risk_level: "medium"
  drivers:
    - "cross-repo policy reconciliation"
    - "owner documentation enforcement"

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  primary_profile: "gpt-5.6-sol"
  reasoning_effort: "high"
  fallback_profile: "gpt-5.4-fast-high"
  reason: "Long-context child policy adoption with owner enforcement."

subagent_deployment_plan:
