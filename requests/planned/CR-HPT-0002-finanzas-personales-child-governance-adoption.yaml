  parallelizable: false
  roles: []
  fallback: "Keep policy applicability and owner decisions in the main agent."
  evidence_required: true

execution:
  requires_human_approval: true
  approval_source: "User requested continued execution on 2026-08-22."
  allowed_window: "manual-current-session"
  branch_strategy: "child-repo-governance-only"
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
