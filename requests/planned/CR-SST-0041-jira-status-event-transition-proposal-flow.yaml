  fallback_profile: "highest-available-reasoning-profile"
  reason: "The task defines event and transition authority before any automated state mutation is allowed."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - validation-reviewer
  fallback: "If subagent tools are unavailable, the main agent must perform architecture, write-boundary, and validation review sequentially."
  evidence_required: true

execution:
  requires_human_approval: false
  allowed_window: local
  branch_strategy: control-plane-only
  read_only_boundary:
    allowed:
      - "inspect local control-plane state and evidence"
      - "define Jira status event contract"
      - "define transition proposal lifecycle"
      - "write non-secret documentation and evidence"
    forbidden:
      - "write Jira issue status"
      - "modify feature_state status"
      - "transition functional repositories"
      - "store tokens, cookies, private URLs, cloudId, or OAuth material in Git"

implementation_steps:
  - id: define-event-intake-contract
    description: "Define how jira-status-observation-results.json becomes local event input."
  - id: define-transition-proposal-contract
    description: "Define the proposal structure before any feature_state or request lifecycle transition."
  - id: define-guards
    description: "Define guards for duplicate signals, Jira status drift, and missing local evidence."
  - id: define-future-runner-boundary
    description: "Define what a future runner may evaluate and what it must not mutate."
  - id: validate
    description: "Run npm run check and record evidence."

validation:
  required_checks:
    - "npm run check"
  evidence_required:
    - "transition_proposal_flow_analysis"
    - "subagent_deployment_evidence"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "CR-SST-0041 does not implement automatic transitions."
  - "The first executable future step should be a dry-run proposal generator."
  - "Jira status observations are operational signals, not canonical state."

