schema_version: "1.0"
phase: 2
id: "CR-SST-0114"
title: "Implement contextual tagging over text selection"
status: done
source_request: "requests/inbox/CR-SST-0114-sst-fend-contextual-text-selection-tagging.yaml"
created_at: "2026-07-04"
requester: "4uentes"

summary: >
  Implement contextual controls for applying LearningContentTag and relevance
  to selected text inside the editable sheet.

control_plane_context:
  initiative_id: "INIT-SST-0001"
  active_feature_state: "learning-content-tags"
  parent_request_id: "CR-SST-0113"
  jira_epic_key: "SST-27"
  active_jira_issue_key: "SST-6"
  jira_subtask_key: "SST-44"
  current_jira_status_observed: "Por hacer"
  jira_role: "mirror"
  jira_source_of_truth: false

impact_analysis:
  required: true
  affected_services:
    - service_id: "sst-fend"
      via: "Selection popover/context menu and annotation preview"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
    - service_id: "4uentes-orchestor"
      via: "request lifecycle and owner enforcement"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - frontend-web
    - learning-content-tags
    - child-repo-owner-documentation
  risks:
    - id: ARTICLE_TAG_LEARNING_TAG_CONFLATION
      severity: high

execution:
  requires_human_approval: false
  allowed_window: manual
  branch_strategy: "one-branch-per-repo"
  child_repo_mutation_allowed: true
  child_repo_mutation_targets:
    - service_id: "sst-fend"
      local_path_ref: "environments/local/bindings.local.yaml#sst-fend"
  implementation_boundary: >
