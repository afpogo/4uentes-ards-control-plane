    remains gated by CR-SST-0115 and CR-SST-0116.
  owner_documentation:
    required: true
    status: satisfied
    owner_refs:
      - repo: "sst-fend"
        paths:
          - "docs/38-learning-workspace-frontend.md"
          - "specs/38-learning-workspace-frontend.yml"
    evidence_refs:
      - "evidence/requests/CR-SST-0114/intent-summary.md"
      - "evidence/requests/CR-SST-0114/jira-sync-summary.md"
      - "evidence/requests/CR-SST-0114/owner-documentation-summary.md"

required_checks:
  - service_id: "sst-fend"
    command: "npm.cmd run check"
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"

validation:
  required_checks:
    - "Selected text can receive content tags and relevance."
    - "The UI clearly distinguishes article tags from content annotations."
  evidence_required:
    - "intent_summary"
    - "jira_sync_summary"
    - "subagent_delegation"
    - "implementation_summary"
    - "owner_documentation_summary"
    - "validation_results"

decision:
  status: closed-local
  approver: "4uentes"
  note: >
    CR-SST-0114 closes locally as the first contextual tagging runtime cut for
    SST-44. Jira remains a mirror and requires explicit synchronization once
    Atlassian MCP tenant access is available.
