architecture_decisions:
  temporary:
    storage: "Redis or compatible volatile memory with TTL; never PostgreSQL"
    recovery: "active sessions of the same authenticated user until finish or TTL expiry"
  saved_in_sst:
    storage: "PostgreSQL authoritative with Redis cache-aside"
    recovery: "after logout, across devices and future sessions"
  local_state: "message content remains in application memory; local storage keeps only non-sensitive conversation reference/cursor"
  transport: "Socket.IO for browser session fan-out; Redis adapter/pub-sub when horizontal scaling requires it; gRPC is not a browser sync dependency"
  durable_write_order: "authorize, PostgreSQL commit, then Redis update or eviction"
  deletion_semantics:
    clear_local: "clear this browser only"
    finish_temporary: "delete volatile conversation and notify active sessions"
    delete_from_sst: "delete durable conversation and evict its cache"
validation:
  - "Review the state machine and privacy boundary before child execution."
  - "4uentes-orchestor npm run check before publication or closure."
acceptance:
  - "No temporary conversation is written to PostgreSQL."
  - "Durable persistence happens only after explicit user consent."
  - "Every server read, promotion and deletion is scoped to the authenticated principal."
  - "Each owner mutation is represented by an approved child request."
rollback: "Withdraw the proposed contract before child execution; no runtime state changes exist in this request."
