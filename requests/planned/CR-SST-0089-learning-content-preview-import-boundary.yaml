schema_version: "1.0"
phase: 2
id: "CR-SST-0089"
title: "Define learning-content preview/import runtime boundary"
status: planned
source_request: "requests/inbox/CR-SST-0089-learning-content-preview-import-boundary.yaml"
created_at: "2026-06-28"
requester: "4uentes"

summary: >
  Plan the first sst-bend runtime boundary for learning-content source preview
  and import. The boundary accepts a CourseSource manifest or WebArticleSource
  payload and returns KnowledgeDocument, ContentBlock arrays, TagSuggestion
  arrays, and warnings. Persistence remains preview-only by default until a
  later approved closure changes that gate.

initial_scope:
  solution: "sst"
  services:
    - "sst-bend"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-SST-0001"
  initiative_file: "initiatives/INIT-SST-0001-tags-governance-continuity.yaml"
  preceding_request_id: "CR-SST-0088"
  preceding_design_evidence: "evidence/requests/CR-SST-0088/learning-source-model.md"
  governing_request: "CR-SST-0089"
  parent_jira_issue_key: "SST-4"
  active_jira_issue_key: "SST-6"
  jira_role: "mirror"
  jira_source_of_truth: false
  active_feature_state: "learning-content-tags"
  active_feature_state_file: "state/features/learning-content-tags.current.yaml"
  current_feature_state_status: "implemented-local"

impact_analysis:
  required: true
  affected_services:
    - service_id: "sst-bend"
      via: "initial_scope.services"
      service_kind: "api"
      ards_kind: "backend-api"
      status: "active"
    - service_id: "4uentes-orchestor"
      via: "control-plane planning and evidence"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - backend-api
    - control-plane
    - request-lifecycle
    - evidence
    - learning-content-preview-import
    - jira-mirror
  capabilities:
    - "learning-content-tags"
  risks:
    - id: CHILD_REPO_MUTATION_WITHOUT_IMPLEMENTATION_PLAN
      severity: high
    - id: PREVIEW_ONLY_GATE_BYPASS
      severity: high
    - id: SCRAPING_OR_PERSISTENCE_SCOPE_CREEP
      severity: high
    - id: SOURCE_DOCUMENT_MODEL_DRIFT
      severity: medium
    - id: JIRA_MCP_EXTERNAL_ACCESS_BLOCKER
      severity: medium

required_context:
  - "AGENTS.md"
  - "specs/integration/policies.yaml"
  - "docs/policies/"
  - "initiatives/INIT-SST-0001-tags-governance-continuity.yaml"
  - "state/features/learning-content-tags.current.yaml"
  - "catalog/services/sst-bend.yaml"
  - "requests/planned/CR-SST-0088-learning-source-model-boundary.yaml"
  - "evidence/requests/CR-SST-0088/learning-source-model.md"
  - "evidence/requests/CR-SST-0088/runtime-boundary-and-follow-up.md"
  - "evidence/requests/CR-SST-0015/parser-boundary-recommendation.md"
  - "evidence/requests/CR-SST-0016/backend-poc-summary.md"
  - "evidence/requests/CR-SST-0089/source-course-analysis.md"

required_checks:
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check:initiatives"
  - service_id: "sst-bend"
    command: "No child repository command in this planning step; future implementation must run focused tests/build/check inside sst-bend."

risk:
  level: high
  score: 7
  drivers:
    - CHILD_REPO_MUTATION_WITHOUT_IMPLEMENTATION_PLAN
    - PREVIEW_ONLY_GATE_BYPASS
    - SCRAPING_OR_PERSISTENCE_SCOPE_CREEP
    - SOURCE_DOCUMENT_MODEL_DRIFT
    - JIRA_MCP_EXTERNAL_ACCESS_BLOCKER

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "The follow-up implementation will touch sst-bend runtime API boundaries."
    - "The design must prevent persistence, scraping, and automatic publishing from entering v1 by accident."
    - "The request crosses from control-plane planning into a future child repository mutation gate."

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-high-reasoning-profile"
  reason: >
    Runtime boundary selection for a child backend API changes future
    contracts, persistence gates, and AI processing authority, so the
    architecture-boundary policy requires high reasoning.

subagent_deployment_plan:
  required: false
  parallelizable: true
  roles:
    - id: "backend-boundary-review"
      objective: "Review future sst-bend endpoint shape, validation gates, and no-persistence default."
      risk: high
      suggested_profile: "high_reasoning_task"
      validation: "Contract evidence maps inputs, outputs, warnings, and forbidden actions."
    - id: "source-model-consistency-review"
      objective: "Check alignment with CR-SST-0088 LearningSource, KnowledgeDocument, and ContentBlock model."
      risk: medium
      suggested_profile: "long_context_task"
      validation: "No runtime field contradicts the source/document model."
  fallback: "Main agent performs the reviews sequentially when subagents are unavailable."
  evidence_required: true

execution:
  requires_human_approval: false
  allowed_window: manual
  branch_strategy: "one-branch-per-repo"
  implementation_boundary: >
    This request creates the control-plane runtime boundary and future
    implementation plan only. It does not modify sst-bend, does not add an
    endpoint, does not persist content, does not scrape remote sites, does not
    create TagDefinition records, and does not write Jira.
  child_repo_mutation_allowed: false
  future_child_repo_mutation_condition: >
    A later execution step may modify sst-bend only after this request boundary
    is accepted and the implementation evidence names the exact files, tests,
    rollback strategy, and preview-only persistence behavior.
  jira_read_executed: false
  jira_write_executed: false
  jira_write_target:
    desired_artifact: "No write in this planning step"
    desired_initial_status: "not requested"
  jira_read_blocked_reason: "Existing CR-SST-0087 evidence records Atlassian MCP 403 app-not-installed; Jira remains mirror-only."

runtime_boundary:
  target_service: "sst-bend"
  input_modes:
    - "CourseSource manifest"
    - "WebArticleSource payload"
  course_source_selectors:
    docsPath: "simple shortcut when a course has a stable docs directory"
    documentSelectors: "include/exclude globs for nested or distributed course documents"
    assetSelectors: "include globs for images, scripts, installers, and lab references"
  outputs:
    - "KnowledgeDocument"
    - "ContentBlock[]"
    - "TagSuggestion[]"
    - "warnings[]"
  required_content_blocks_or_aliases:
    - "clase"
    - "ejemplo"
    - "definicion"
    - "recordar"
    - "code"
    - "docs"
    - "nota"
    - "image"
    - "titulo"
    - "subt"
    - "subtitulo"
    - "importante"
    - "resumen"
  persistence_default: "preview-only"
  forbidden_v1_actions:
    - "mass_scraping"
    - "automatic_publish"
    - "automatic_TagDefinition_creation"
    - "persist_without_explicit_approval"
    - "automatic_jira_closure"

validation:
  required_checks:
    - "Control-plane validation passes."
    - "Evidence references INIT-SST-0001, CR-SST-0088, and SST-6."
    - "Evidence keeps Jira as mirror, not source of truth."
    - "No child repositories are modified in this planning step."
    - "Runtime contract preserves preview-only persistence by default."
    - "Runtime contract supports nested/distributed course documents through selectors."
    - "TranscriptionSource remains outside implementation scope."
    - "state/features/learning-content-tags.current.yaml remains implemented-local until runtime validation exists."
  evidence_required:
    - "runtime_contract"
    - "future_implementation_plan"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "CR-SST-0089 follows CR-SST-0088 and must not re-open the source/document model."
  - "The first endpoint should behave as preview/import planning, not as publish or persisted ingestion."
  - "Unknown prefixes and missing assets should return warnings, not silent mutation."
  - "CourseSource is accepted as a manifest; WebArticleSource is accepted as a bounded payload, not as a crawler seed."
  - "Future sst-fend rendering remains outside this backend runtime boundary."
