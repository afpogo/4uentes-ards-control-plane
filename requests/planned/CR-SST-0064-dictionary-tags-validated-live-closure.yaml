implementation_tracks:
  - id: "control-plane-lifecycle-and-decisions"
    service_id: "4uentes-orchestor"
    objective: "Create the SST-10 governing lifecycle and record closure decisions."
    expected_work:
      - "Record CR-SST-0064 as the governing request for SST-10."
      - "Document that TagDefinition CRUD is outside this validated-live closure."
      - "Document that dictionary closure is independent from article-tags, learning-content, bitacora, and prefix-engine runtime."
      - "Record sst-extension account-context as a non-blocking follow-up."
  - id: "backend-dictionary-live-smoke"
    service_id: "sst-bend"
    objective: "Validate dictionary domain runtime locally."
    expected_work:
      - "Run existing dictionary unit/stage scripts."
      - "Run live QA smoke where JWT/account context is available."
      - "Capture sanitized pass/fail evidence without tokens."
  - id: "bff-dictionary-boundary-smoke"
    service_id: "4uentes-auth"
    objective: "Validate BFF /api/diccionario/* boundary."
    expected_work:
      - "Validate authenticated read/management routes through BFF."
      - "Confirm status and payload preservation for tag-values/tag-occurrences."
      - "Capture sanitized network evidence without bearer tokens or cookies."
  - id: "frontend-dictionary-manual-qa"
    service_id: "sst-fend"
    objective: "Validate /dictionary against local BFF."
    expected_work:
      - "Authenticate a QA user if needed."
      - "Open /dictionary and validate list/create/update/reveal/tag filtering."
      - "Capture screenshots and console/network observations."

acceptance_criteria:
  - "CR-SST-0064 exists as the governing SST-10 request before functional repo changes."
  - "Backend dictionary checks and live smoke are executed or blocked with exact reason."
  - "BFF /api/diccionario/* smoke is executed or blocked with exact reason."
  - "Frontend /dictionary QA is executed or blocked with exact reason."
  - "TagDefinition CRUD/governance decision is recorded as outside this closure."
  - "sst-extension account-context is recorded as non-blocking follow-up."
  - "dictionary-tags advances to validated-live only if runtime evidence passes."
  - "No Jira status is used as canonical state without local evidence."

