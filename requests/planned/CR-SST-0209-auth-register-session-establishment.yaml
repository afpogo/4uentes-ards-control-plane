validation:
  - "4uentes-auth npm run check without starting MongoDB."
  - "Unit/contract tests use repository fakes and prove one session family, safe response and both cookie names."
  - "Negative tests prove failed registration creates no session and leaks no credential material."
  - "UI-only development QA proves register -> hard reload -> refresh -> /chat without DB access or seeders."
  - "4uentes-orchestor npm run check before closure."
acceptance:
  - "Register establishes one revocable web session with the same security profile as login."
  - "Hard navigation refreshes successfully without a second credential request."
  - "No password, refresh token, CSRF value, JWT or verifier is retained in evidence."
