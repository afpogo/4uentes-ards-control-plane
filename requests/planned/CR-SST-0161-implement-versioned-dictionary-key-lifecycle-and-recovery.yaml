execution:
  requires_human_approval: true
  approval_status: "granted"
  approval_source: >
    User instruction dated 2026-08-15 approving CR-SST-0161 implementation in
    sst-bend and sst-4uentes-infra, limited to development and excluding
    Kubernetes apply, database use, live rotation/re-encryption,
    production/KMS/TLS and Jira writes.
  approval_consumed_for: "Bounded child-repository implementation in sst-bend and sst-4uentes-infra."
  allowed_window: manual
  branch_strategy: one-branch-per-repo
  child_repo_mutation_allowed: true
  child_repo_mutation_targets: ["sst-bend", "sst-4uentes-infra"]
  implementation_boundary: >
    Development-only implementation may add keyring resolution, startup
    validation, dry-run inventory, owner documentation and tests. No live key
    rotation, re-encryption, Kubernetes apply, production/KMS/TLS claim or
    plaintext key handling may run until a separately approved execution gate
    proves backup, rollback, old-key resolution and secret-safe evidence.

implementation_plan:
  status: "decision-ready"
  evidence_ref: "evidence/requests/CR-SST-0161/governed-preflight-2026-08-13.md"
  dependency_reconciliation_ref: "evidence/requests/CR-SST-0163/development-baseline-reconciliation-2026-08-13.md"
  target_environment: "development"
  proposed_provider: "manual-local-k8s-secrets"
  compatibility_contract:
    persisted_selector: "ProtectedSecretValue.keyRef"
    active_selector: "SST_DICTIONARY_SECRETS_KEY_REF"
    configured_key_refs: "SST_DICTIONARY_SECRETS_KEY_REFS"
    legacy_key_ref: "env:SST_DICTIONARY_SECRETS_MASTER_KEY"
    rule: >
      Encryption uses only the configured active keyRef. Decryption resolves
      the exact persisted keyRef from an explicit allowlist and fails closed
      when the reference or material is absent. Existing records keep their
      persisted keyRef and do not require a schema migration.
  execution_units:
    - id: SST94-01
      objective: "Update backend and infrastructure owner contracts before runtime code."
      output: "Versioned key resolution, custody, failure and rollback rules are normative."
      risk: high
      validation: "Owner specs and docs agree on environment variables and exclusions."
    - id: SST94-02
      objective: "Introduce an allowlisted key-provider abstraction with backward-compatible single-key defaults."
      output: "New writes use the active keyRef; reads resolve record.keyRef; unknown refs fail closed."
      risk: high
      validation: "Unit tests cover active, old, missing, malformed and tampered key refs without logging key material."
    - id: SST94-03
      objective: "Add startup configuration validation and secret-safe keyRef inventory/dry-run tooling."
      output: "Startup rejects invalid active configuration and inventory reports only keyRef/count/status metadata."
      risk: medium
      validation: "No keys, plaintext, ciphertext, nonce or authentication tag appears in output."
    - id: SST94-04
      objective: "Adopt versioned development Secret and ConfigMap contracts without applying manifests."
      output: "The current legacy key remains mounted while a new versioned key can be staged and selected."
      risk: high
      validation: "Infra kustomize and client dry-run checks pass."
    - id: SST94-05
      objective: "Prove local compatibility using synthetic keys and in-memory fixtures only."
      output: "Old ciphertext stays readable, new ciphertext uses the active keyRef and rollback to the old active selector is demonstrated."
      risk: high
      validation: "Backend checks and negative-security tests pass without database, seeders or live secrets."
    - id: SST94-06
      objective: "Prepare a separately gated development rotation and re-encryption runbook."
      output: "Backup, preflight, dry-run, apply, verification and rollback steps are explicit."
      risk: high
      validation: "No live rotation or re-encryption is executed in the implementation PRs."
  acceptance_criteria:
    - "A record encrypted with an old configured keyRef remains readable after the active keyRef changes."
    - "New records and secret-value rotations persist only the active keyRef."
    - "Unknown, missing or disallowed keyRef values fail closed with sanitized errors and audit outcomes."
    - "Single-key development configuration remains backward compatible during adoption."
    - "Startup validates the active keyRef and all declared key materials without printing material."
    - "Inventory and dry-run outputs contain only sanitized keyRef/count/result metadata."
    - "No additional protected_secret_values schema migration is introduced unless implementation proves it necessary and the plan is re-approved."
    - "Backend, infrastructure and control-plane checks pass before adoption."
  definition_of_done:
    - "Backend and infrastructure owner docs are updated in their owner repositories."
    - "Synthetic no-database compatibility, rollback and negative-security tests pass."
    - "No live Kubernetes mutation, live-key rotation or production claim was performed."
    - "A separate operator approval remains required for any development rotation or re-encryption run."
    - "Jira SST-94 is synchronized only through a new enumerated Jira authorization batch."
  excluded:
    - "Production provider selection, KMS, envelope encryption or external secret operator adoption"
    - "Production TLS, certificate custody or etcd-at-rest claims"
    - "Live database mutation, bulk re-encryption or live key rotation"
    - "Changes to sst-fend, node-auth, sst-extension or unrelated infrastructure"
    - "Jira transition, comment or field update"

