implementation:
  - "Consume retention HTTP operations only through the CR-SST-0211 4uentes-auth facade; keep the direct Bend exception limited to Socket.IO."
  - "Show an unambiguous Temporary or Saved in SST status near the conversation controls."
  - "Require an explicit Save in SST action; do not use a preselected consent checkbox."
  - "Separate Clear this device, Finish temporary conversation and Delete from SST actions."
  - "Keep message content in application memory and only an opaque reference/cursor in browser session state."
  - "Recover saved history on demand after local clear and surface TTL/Redis degradation without claiming deletion."
