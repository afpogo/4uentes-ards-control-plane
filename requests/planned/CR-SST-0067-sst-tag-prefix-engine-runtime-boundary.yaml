implementation_tracks:
  - id: "control-plane-runtime-contract"
    service_id: "4uentes-orchestor"
    objective: "Define the SST-12 runtime contract and non-goals before child repo changes."
    expected_work:
      - "Record CR-SST-0067 as the governing request for SST-12."
      - "Define preview/import request and response boundaries."
      - "Keep Learning Content and Bitacora as consumers/future scopes, not implementation targets."
      - "Record persistence decision: preview-only first unless implementation evidence justifies storage."
  - id: "backend-prefix-runtime"
    service_id: "sst-bend"
    objective: "Promote the existing prefix engine POC to a runtime boundary."
    expected_work:
      - "Locate current tag-prefix entities, registry, engine, and tests."
      - "Expose a runtime preview/import endpoint or equivalent application service boundary."
      - "Return structured ContentBlock, TagValue, TagOccurrence, AssetRef, ExternalReference, and ImportedReference results."
      - "Validate initial scopes: diccionario, articulos, learning-content, bitacora as governed/reserved scopes."
      - "Add focused backend tests and smoke evidence."
  - id: "deferred-bff-frontend-consumers"
    service_id: "4uentes-auth/sst-fend"
    optional: true
    objective: "Keep consumers deferred until backend runtime contract is stable."
    expected_work:
      - "Document follow-up needs for BFF pass-through and frontend reference-chip rendering."
      - "Do not implement UI in this CR unless backend runtime evidence is complete and scope is expanded."

acceptance_criteria:
  - "CR-SST-0067 exists as the governing request before functional repo changes."
  - "SST-12 Jira issue is observed read-only before implementation."
  - "Backend runtime contract is documented and maps to the global tags governance contract."
  - "Implementation does not create a parallel tag model for Learning Content or Bitacora."
  - "Persistence is explicit: preview-only or persisted import, with evidence."
  - "sst-bend checks/tests pass or blockers are recorded with exact cause."
  - "state/features/sst-tag-prefix-engine.current.yaml advances only after runtime evidence exists."
  - "Jira status/labels are updated only after control-plane evidence supports the transition."

