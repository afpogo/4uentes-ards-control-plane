  - "finanzas-personales: backend/specs/capabilities/outbound/00-index.yaml"
  - "finanzas-personales: backend/specs/api/00-index.yaml"

risk:
  level: "high"
  score: 8
  drivers:
    - "architecture and cross-service contract"
    - "auth and authorization boundary"
    - "sensitive financial and receipt data"

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "architecture exception decision"
    - "security and data ownership"
    - "producer-consumer compatibility"

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  primary_profile: "gpt-5.6-sol"
  reasoning_effort: "max"
  fallback_profile: "gpt-5.5"
  reason: "Architecture, auth and sensitive-data contract require high reasoning."

subagent_deployment_plan:
  required: false
  parallelizable: false
  roles: []
  fallback: "Do not delegate architecture, auth or sensitive-data decisions."
  evidence_required: true

