  requires_human_approval: true
  allowed_window: "future-approved-window"
  branch_strategy: "child-repo-contract-docs-only"
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
    service_ids:
      - "finanzas-personales-frontend"
      - "finanzas-personales-backend"
  owner_documentation_required: true
  implementation_boundary: >
    Update only owner architecture, API and capability contracts. Do not build a
    BFF, choose auth implementation, expose Python publicly or implement runtime.

owner_documentation:
  required: true
  status: planned
  owner_repo: "finanzas-personales"
  planned_owner_docs:
    - "docs/architecture/README.md"
    - "docs/api/README.md"
    - "specs/capabilities/inbound/00-index.yaml"
    - "specs/capabilities/outbound/00-index.yaml"
    - "specs/api/00-index.yaml"
  owner_refs:
    - repo: "finanzas-personales/frontend"
      paths:
        - "docs/architecture/README.md"
        - "specs/capabilities/inbound/00-index.yaml"
    - repo: "finanzas-personales/backend"
      paths:
        - "docs/api/README.md"
        - "specs/capabilities/outbound/00-index.yaml"
        - "specs/api/00-index.yaml"

jira:
  role: "mirror"
  source_of_truth: false
  project_key: "HPT"
  epic_key: "HPT-1"
  issue_key: "HPT-4"
  issue_type: "Tarea"
  current_status_observed: "Por hacer"
