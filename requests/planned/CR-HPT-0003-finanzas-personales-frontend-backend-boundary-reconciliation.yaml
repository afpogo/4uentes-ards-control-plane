      severity: "high"
    - id: "AUTHORIZATION_BOUNDARY_UNDEFINED"
      severity: "high"
    - id: "SENSITIVE_FINANCIAL_DATA_CONTRACT_INCOMPLETE"
      severity: "high"

required_context:
