schema_version: "1.0"
phase: 2
id: "CR-SST-0032"
title: "Implement Jira MCP read-only project verification"
status: planned
source_request: "requests/inbox/CR-SST-0032-jira-mcp-read-only-verification.yaml"
created_at: "2026-06-05"
requester: "4uentes"

initial_scope:
  solution: "sst"
  services: []
  include_optional_services: false

impact_analysis:
  required: true
  affected_services: []
  affected_ards: []
  capabilities:
    - jira-mcp-ticketing
    - feature-bugfix-state-read-model
  risks:
    - id: EXTERNAL_MCP_CONNECTIVITY
      severity: high
    - id: OAUTH_AND_PERMISSION_BOUNDARY
      severity: high
    - id: READ_ONLY_RUNTIME_ASSURANCE
      severity: medium

control_plane_scope:
  repository: "4uentes-orchestor"
  reason: "Jira MCP verification is a control-plane external connector operation, not a product service change."

required_context:
  - "requests/planned/CR-SST-0029-jira-mcp-ticketing-integration.yaml"
  - "evidence/requests/CR-SST-0029/implementation-plan.md"
  - "evidence/requests/CR-SST-0029/jira-mcp-connection-summary.md"
  - "evidence/requests/CR-SST-0029/jira-project-and-issue-type-summary.md"
  - "environments/local/jira-mcp.local.example.yaml"
  - "scripts/jira-mcp/generate-dry-run.js"
  - "docs/requests/jira-mcp-ticketing-playbook.md"
  - "docs/ai/model-selection-policy.md"

required_checks:
  - service_id: 4uentes-orchestor
    command: "npm run check"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:dry-run"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:verify"

risk:
  level: high
  score: 7
  drivers:
    - id: EXTERNAL_MCP_CONNECTIVITY
      severity: high
    - id: OAUTH_AND_PERMISSION_BOUNDARY
      severity: high
    - id: READ_ONLY_RUNTIME_ASSURANCE
      severity: medium

task_weight:
  classification: complex-high-risk-task
  risk_level: high
  drivers:
    - EXTERNAL_MCP_CONNECTIVITY
    - OAUTH_AND_PERMISSION_BOUNDARY
    - CONTROL_PLANE_EXTERNAL_CONNECTOR

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The task introduces external MCP connectivity and OAuth/permission boundaries, even though the planned behavior is read-only."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - security-contract-reviewer
    - implementation-planner
    - validation-reviewer
  fallback: "If subagent tools are unavailable, the main agent must perform connector security, implementation planning, and validation review sequentially."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: manual
  branch_strategy: control-plane-only
  read_only_boundary:
    allowed:
      - "connect to Atlassian MCP"
      - "discover available MCP tools"
      - "read visible Jira resources"
      - "read visible Jira projects"
      - "verify project key SST"
      - "write non-secret evidence"
    forbidden:
      - "create Jira issues"
      - "edit Jira issues"
      - "comment on Jira issues"
      - "transition Jira issues"
      - "store tokens, cookies, private URLs, or secrets in Git"
  implementation_steps:
    - id: add-mcp-client-dependency-or-bridge
      description: "Select the smallest viable MCP client path for Atlassian remote MCP, preferring the official SDK and falling back to mcp-remote if needed."
    - id: add-jira-mcp-verify-command
      description: "Implement npm run jira:mcp:verify as a read-only command."
    - id: discover-tools
      description: "List available Atlassian MCP tools and fail safely if Jira tools are absent."
    - id: verify-project
      description: "Confirm project key SST is visible and record evidence."
    - id: validate
      description: "Run npm run check, npm run jira:mcp:dry-run, and npm run jira:mcp:verify."

validation:
  required_checks:
    - "npm run check"
    - "npm run jira:mcp:dry-run"
    - "npm run jira:mcp:verify"
  evidence_required:
    - "jira_mcp_project_verification"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "Functional repositories are not modified by this request."
  - "This request implements only the read-only MCP verification phase."
  - "Write-capable Jira operations require a later approved request or an explicit advancement of CR-SST-0029."
