created_at: "2026-07-04"
requester: "4uentes"

summary: >
  Persist accepted annotated text context in backend runtime and expose it
  through the governed BFF/API path.

control_plane_context:
  initiative_id: "INIT-SST-0001"
  active_feature_state: "learning-content-tags"
  parent_request_id: "CR-SST-0115"
  jira_epic_key: "SST-27"
  active_jira_issue_key: "SST-6"
  jira_subtask_key: "SST-46"
  current_jira_status_observed: "Por hacer"
  jira_role: "mirror"
  jira_source_of_truth: false

impact_analysis:
  required: true
  affected_services:
    - service_id: "sst-bend"
      via: "Persistence and query/read model for accepted annotations"
      service_kind: "api"
      ards_kind: "backend-service"
      status: "active"
    - service_id: "node-auth"
      via: "BFF pass-through or contract adaptation"
      service_kind: "bff"
      ards_kind: "backend-service"
      status: "active"
    - service_id: "4uentes-orchestor"
      via: "request lifecycle and owner enforcement"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - backend-service
    - bff-contract
    - learning-content-tags
    - child-repo-owner-documentation
  risks:
    - id: ACCEPTED_CONTEXT_NOT_QUERYABLE
      severity: high

execution:
  requires_human_approval: false
  allowed_window: manual
  branch_strategy: "one-branch-per-repo"
  child_repo_mutation_allowed: true
  child_repo_mutation_targets:
    - service_id: "sst-bend"
      local_path_ref: "environments/local/bindings.local.yaml#sst-bend"
    - service_id: "node-auth"
      local_path_ref: "environments/local/bindings.local.yaml#4uentes-auth"
  implementation_boundary: >
    This CR may implement persistence and BFF/API support for accepted annotated
    text context. It must preserve preview versus accept semantics.
  owner_documentation:
    required: true
    status: satisfied
    owner_refs:
      - repo: "sst-bend"
        paths:
          - "docs/api/26-learning-workspaces.md"
          - "specs/api/learning-workspaces.yaml"
          - "docs/capabilities/outbound/learning-workspace-context.md"
          - "specs/capabilities/outbound/learning-workspace-context.yaml"
      - repo: "node-auth"
        paths:
          - "docs/bf/06-integrations-api.md"
          - "specs/integrations-api.yaml"
          - "docs/capabilities/inbound/sst-bend--learning-workspace-context.md"
          - "docs/capabilities/outbound/learning-workspace-context.md"
          - "specs/capabilities/inbound/sst-bend--learning-workspace-context.yaml"
          - "specs/capabilities/outbound/learning-workspace-context.yaml"
    evidence_refs:
      - "evidence/requests/CR-SST-0116/intent-summary.md"
      - "evidence/requests/CR-SST-0116/jira-sync-summary.md"
      - "evidence/requests/CR-SST-0116/owner-documentation-summary.md"

required_checks:
  - service_id: "sst-bend"
    command: "npm.cmd run check"
  - service_id: "node-auth"
    command: "npm.cmd run check"
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"

validation:
  required_checks:
    - "Accepted annotations are persisted with source anchors and selectors."
    - "Accepted context can be read or queried without relying on draft preview state."
  evidence_required:
    - "intent_summary"
    - "jira_sync_summary"
    - "subagent_delegation"
    - "pre_implementation_analysis"
    - "implementation_summary"
    - "owner_documentation_summary"
    - "validation_results"

decision:
  status: closed-local
  approver: "4uentes"
  note: >
    CR-SST-0116 closes locally as the runtime persistence cut for SST-46. Jira
    remains a mirror and requires explicit synchronization once Atlassian MCP
    tenant access is available.
