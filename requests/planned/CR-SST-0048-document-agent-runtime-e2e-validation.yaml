model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "High-risk or security/contract-sensitive task."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - cross-repo-impact-reviewer
    - validation-reviewer
  fallback: "If subagents or exact model aliases are unavailable, record the limitation and run the same review steps sequentially with the highest available reasoning profile."
  evidence_required: true

runtime_questions:
  - "Does sst-fend already produce a structured document-agent event or operation intent?"
  - "Does 4uentes-auth expose or enforce tenant, account, and user scope validation needed by the handoff?"
  - "Does sst-bend persist a durable job before document processing execution?"
  - "Are idempotency_key and correlation_id preserved end to end?"
  - "Is there an executable smoke or E2E path that can prove the contract?"

contract_acceptance_criteria:
  - "Frontend event or operation intent includes tenant_id, user_id, idempotency_key, and correlation_id."
  - "Auth boundary validates user, tenant, and account scope before backend job execution."
  - "Backend persists a durable job before document processing starts."
  - "Retry policy, audit metadata, idempotency, and correlation data are retained."
  - "Validation evidence names the exact commands, routes, fixtures, or gaps observed."

execution_boundaries:
  allowed:
    - "inspect functional repositories through local bindings"
    - "run read-only inventory commands"
    - "run repo checks if working tree preservation is confirmed"
    - "create local evidence and gap matrix"
    - "make scoped repo changes only after approval remains valid for this planned request"
  forbidden:
    - "write Jira"
    - "close SST-8"
    - "touch unrelated feature areas"
    - "overwrite child-repo dirty working tree changes"
    - "store secrets, tokens, cookies, private Jira URLs, or cloudId in Git"

implementation_steps:
  - id: repo-runtime-inventory
    description: "Inspect sst-fend, sst-bend, and 4uentes-auth for document-agent runtime surfaces."
  - id: contract-gap-matrix
    description: "Compare observed runtime code against CR-SST-0008 operation_intent, handoff_payload, and document_agent_event contracts."
  - id: e2e-path-decision
    description: "Decide whether an executable E2E smoke can run now or whether implementation gaps must be split."
  - id: validation-or-plan
    description: "Produce E2E validation evidence or a repo-scoped implementation plan."
  - id: state-decision
    description: "Recommend whether document-agent remains validated-local or can advance after evidence."

execution:
  requires_human_approval: true
  allowed_window: manual
  branch_strategy: one-branch-per-repo

validation:
  required_checks:
    - "npm run check"
  evidence_required:
    - "repo_runtime_inventory"
    - "contract_gap_matrix"
    - "e2e_validation_plan_or_results"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: pending
  approver: TODO

planner_notes:
  - "Functional repositories were not modified while creating this planned request."
  - "Functional repository checks were not executed while creating this planned request."
  - "SST-8 remains the Jira operational mirror; closing it requires a separate approved Jira write request."
