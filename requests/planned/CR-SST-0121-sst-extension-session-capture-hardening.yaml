schema_version: "1.0"
phase: 2
id: "CR-SST-0121"
title: "Harden sst-extension session capture reliability, privacy, and limits"
status: in-progress
source_request: "requests/inbox/CR-SST-0121-sst-extension-session-capture-hardening.yaml"
created_at: "2026-07-05"
requester: "4uentes"

summary: >
  Follow-up hardening request for sst-extension session capture reliability,
  privacy, storage limits, partial failure behavior, and textual PDF robustness.

initial_scope:
  solution: "sst"
  services:
    - "sst-extension"
    - "4uentes-orchestor"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-SST-0003"
  jira_epic_key: "SST-29"
  jira_issue_key: "TBD"
  discovered_from:
    - "CR-SST-0119 / SST-49 code review risk assessment"
    - "CR-SST-0103 / SST-35 manual QA: multi-tab visual capture permission gap"
  policy_ref: "docs/policies/owner-documentation-authority-policy.md"
  risk_assessment_ref: "evidence/requests/CR-SST-0119/code-review-risk-assessment.md"

impact_analysis:
  required: true
  affected_services:
    - service_id: "sst-extension"
      via: "session capture lifecycle, local artifact retention, storage limits, and failure handling"
      service_kind: "browser-extension"
      ards_kind: "frontend-extension"
      status: "optional-active"
    - service_id: "4uentes-orchestor"
      via: "request lifecycle and evidence"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - frontend-extension
    - browser-extension-session-capture
    - child-repo-owner-documentation
  risks:
    - id: MV3_BACKGROUND_SUSPENSION
      severity: high
    - id: LOCAL_PRIVATE_ARTIFACT_RETENTION
      severity: high
    - id: STORAGE_OR_PAYLOAD_OVERSIZE
      severity: high
    - id: PARTIAL_CAPTURE_LOSS
      severity: medium
    - id: MULTI_TAB_VISUAL_CAPTURE_PERMISSION_GAP
      severity: high
      disposition: >
        Use optional <all_urls> only as an explicit, user-triggered visual-capture
        lease; remove it after success or failure and clean up stale leases when
        the MV3 background starts again.

required_checks:
  - service_id: "sst-extension"
    command: "pnpm check"
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"

execution:
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
    service_id: "sst-extension"
  owner_documentation_required: true
  jira_write_executed: false
  jira_write_ref: "TBD"
  source_review_ref: "evidence/requests/CR-SST-0119/code-review-risk-assessment.md"
  execution_state: "implementation-started-2026-07-23"
  authorization_ref: "User authorization recorded in the active Codex session on 2026-07-23."
  security_review:
    status: "findings-corrected-and-revalidated"
    evidence_ref: "evidence/requests/CR-SST-0121/permission-lease-security-review-2026-07-23.md"
  implementation_evidence_ref: "evidence/requests/CR-SST-0121/permission-lease-implementation-and-validation-2026-07-23.md"

owner_documentation:
  required: true
  status: satisfied
  owner_repo: "sst-extension"
  planned_owner_docs:
    - "specs/features/sessions.yaml"
    - "docs/00-overview.md"
    - "docs/qa/session-capture-validation.md"
  evidence_refs:
    - "evidence/requests/CR-SST-0121/permission-lease-implementation-and-validation-2026-07-23.md"
    - "evidence/requests/CR-SST-0121/permission-lease-security-review-2026-07-23.md"

validation:
  required_checks:
    - "Long-running session capture cannot remain stuck in capturing due to MV3 worker suspension."
    - "Synced items do not retain private PDF artifacts longer than the selected retention policy allows."
    - "Per-tab and per-session storage/payload limits have typed outcomes."
    - "Partial tab failures do not silently discard all already captured tabs."
    - "Textual PDF layout handles long URLs or long tokens."
    - "<all_urls> remains optional and is requested only from an explicit visual capture action."
    - "The temporary global host permission is removed after success, failure, or a later MV3 background cleanup."
    - "Text-only capture does not request the global host permission."
    - "Permission denial produces a visible, typed result without losing the session."
    - "Private-preview consent remains independent from permission to generate the local visual PDF."

task_weight:
  classification: "complex-high-risk-task"
  drivers:
    - "Private page-derived artifacts and local storage retention."
    - "Manifest V3 background lifecycle."
    - "Potential BFF payload and extension storage limits."
    - "Runtime reliability under large tab sessions."

model_selection:
  primary_profile: "gpt-5.5"
  note: "Future implementation should use high-reasoning profile; subagents recommended for runtime/storage/privacy slices."

subagent_deployment_plan:
  required: true
  roles:
    - "runtime-lifecycle-reviewer"
    - "storage-privacy-reviewer"
    - "payload-limit-reviewer"
    - "validation-reviewer"
  executed: true
  execution:
    - role: "runtime-lifecycle-reviewer"
      task: "Implement optional visual permission lease, MV3 cleanup, owner docs, and tests in sst-extension."
      task_name: "/root/extension_permission"
    - role: "validation-reviewer"
      task: "Independent read-only security and lifecycle review after implementation."
      task_name: "/root/permission_review"
      disposition: "Findings returned to implementation; CR remains open."
    - role: "deployment-readiness-reviewer"
      task: "Read-only reconciliation plan for the already-approved backend, BFF, and frontend implementations."
      task_name: "/root/runtime_reconcile"
  fallback: "If subagents are unavailable, execute sequentially and record fallback evidence."

decision:
  status: approved-plan
  approver: "4uentes"
  authorized_at: "2026-07-23"
  notes:
    - "Advanced for consent, retention, lifecycle and bounded-payload prerequisites. No Jira key is inferred; duplicate/read-only preflight precedes any mirror write."
    - "Reserved after SST-49 QA/manual review. Not part of SST-49 closure and separate from SST-50 preview image contract."
    - "The approved permission decision is an ephemeral optional <all_urls> lease for visual session capture, with best-effort finally cleanup and stale-lease cleanup after MV3 restart."
