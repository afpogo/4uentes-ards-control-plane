schema_version: "1.0"
phase: 2
id: "CR-SST-0100"
title: "Show session capture progress and per-tab degradations"
status: closed-local
source_request: "requests/inbox/CR-SST-0100-sst-extension-session-ui-progress.yaml"
created_at: "2026-07-02"
requester: "4uentes"

summary: >
  Improve sst-extension session UI so users can see visual/text/failure counts
  and per-tab warnings after capture.

initial_scope:
  solution: "sst"
  services:
    - "sst-extension"
    - "4uentes-orchestor"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-SST-0003"
  jira_epic_key: "SST-29"
  jira_issue_key: "SST-32"
  policy_ref: "docs/policies/owner-documentation-authority-policy.md"

impact_analysis:
  required: true
  affected_services:
    - service_id: "sst-extension"
      via: "popup/sidepanel UI, presentation helpers, specs/docs/tests"
      service_kind: "browser-extension"
      ards_kind: "frontend-extension"
      status: "optional-active"
    - service_id: "4uentes-orchestor"
      via: "request lifecycle and evidence"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - frontend-extension
    - browser-extension-session-capture
    - child-repo-owner-documentation
  risks:
    - id: PRIVATE_CONTENT_UI_EXPOSURE
      severity: high
    - id: UI_LAYOUT_REGRESSION
      severity: medium

required_checks:
  - service_id: "sst-extension"
    command: "pnpm test"
  - service_id: "sst-extension"
    command: "pnpm build"
  - service_id: "sst-extension"
    command: "pnpm check"
  - service_id: "4uentes-orchestor"
    command: "npm.cmd run check"

