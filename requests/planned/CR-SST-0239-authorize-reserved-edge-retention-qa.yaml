subagent_deployment_plan:
  mode: "none"
  reason: "No delegation was requested; the public-edge security boundary remains on one auditable execution path."

contract:
  surface: "reserved ngrok HTTPS development edge"
  edge_authentication: "existing GitHub OAuth Traffic Policy"
  preferred_access_path: "already allowlisted operator completes OAuth interactively in the controlled browser"
  fallback_access_path: "stop and request exact authorization before any local allowlist configuration or ngrok service restart"
  qa_path: "browser-origin product requests through the public single origin; no direct backing-service route"
  application_identity: "new synthetic SST identity created only after edge authentication"
  qa_matrix_source: "CR-SST-0207"
  cleanup: "conversation cleanup through product contracts in a finally path; identity deletion remains unavailable and out of scope"
  evidence: "status, outcome and counts only; no secrets, private URL, identifiers or content"

execution:
  requires_human_approval: true
  approval_status: "pending-plan-publication-authorization"
  control_plane_mutation_allowed: true
  child_repo_mutation_allowed: false
  runtime_mutation_allowed: false
  planned_runtime_scope: "one separately authorized operator-authenticated reserved-edge QA session with synthetic data"
  ngrok_configuration_mutation_allowed: false
  ngrok_service_restart_allowed: false
  deployment_allowed: false
  cluster_mutation_allowed: false
  production_mutation_allowed: false
  datastore_mutation_allowed: false
  secret_mutation_allowed: false
  jira_write_allowed: false

atomized_execution:
  - order: 1
    id: "publish-and-readback-plan"
    objective: "Merge this planned lifecycle and read it back from canonical main before any runtime access."
    validation: "Control-plane full check passes and the merge is reachable from origin/main."
  - order: 2
    id: "oauth-browser-preflight"
    objective: "After exact authorization, verify an allowed operator can complete edge OAuth without changing policy or config."
    validation: "Unauthenticated requests remain redirected and the controlled authenticated browser reaches the SST origin."
  - order: 3
    id: "run-reserved-edge-matrix"
    objective: "Create synthetic SST state and execute the CR-SST-0207 retention matrix through the browser origin."
    validation: "The applicable HTTP and realtime rows match localhost semantics without a direct service route."
  - order: 4
    id: "product-contract-cleanup"
    objective: "Delete synthetic conversations through product APIs and record any unavoidable identity residue."
    validation: "No direct datastore access; cleanup outcomes are counts-only and secret-safe."
  - order: 5
    id: "reconcile-source-qa"
    objective: "Update CR-SST-0207 evidence and determine whether any remaining limit blocks closure."
    validation: "Reserved-edge status is evidence-backed; identity cleanup is not silently waived or absorbed."
  - order: 6
    id: "separate-tracker-and-terminal-gates"
    objective: "Use fresh preflights and exact authorizations for any Jira mirror or terminal publication."
    validation: "No Jira write occurs under this planning authorization."

owner_documentation:
  required: true
  status: "existing-owner-runbooks-sufficient-for-plan"
  owner_repo: "sst-4uentes-infra"
  role: "edge configuration, OAuth access policy and operational procedure authority"
  planned_change: "none unless execution finds an owner documentation gap"
  sources:
    - "docs/runbooks/ngrok-durable-development.md"
    - "docs/runbooks/add-oauth-collaborator-access.md"
    - "docs/runbooks/access-urls-and-credentials.md"
    - "specs/states/implement-durable-ngrok-edge.yaml"

validation:
  - "Unauthenticated reserved-edge requests still stop at the ngrok OAuth boundary."
  - "An already allowlisted operator completes OAuth interactively; automation never captures or persists the OAuth credential or cookie."
  - "All SST calls use the public browser origin and existing Auth facade or Socket.IO product boundaries."
  - "Synthetic conversations are removed through product contracts even when a QA row fails."
  - "Evidence excludes private URLs, account names, emails, conversation IDs, cookies, tokens, credentials and message bodies."
  - "4uentes-orchestor npm run check and git diff --check pass before plan publication and terminal closure."

acceptance:
  - "The reserved-edge CR-SST-0207 matrix reaches the application only after successful OAuth."
  - "OAuth remains enabled with the existing least-privilege individual-user policy; no bypass or public unauthenticated application route is introduced."
  - "Retention behavior through the reserved edge matches the already accepted localhost contracts."
  - "No owner repository, ngrok config, service, deployment, cluster, datastore, secret or production state changes without a later exact authorization."
  - "Synthetic identity cleanup remains an explicit separate follow-up when no product deletion contract exists."

proposed_jira_batch:
  status: "not-authorized"
  prerequisites: ["plan merged and read back", "fresh duplicate and hierarchy preflight", "exact operator authorization"]
  candidate:
