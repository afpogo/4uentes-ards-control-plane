    issue_type: "Subtask"
    parent: "SST-113"
    summary: "[CR-SST-0239] Validar retencion por el edge reservado"
  proposed_operations: ["create exactly one candidate if no compatible mirror exists", "transition only that issue to En curso"]
  forbidden_operations: ["comments", "links", "assignment changes", "edits to SST-117, SST-113, SST-86 or any other issue"]

knowledge_to_execution_documentation:
  policy_id: "knowledge-to-execution-documentation-policy"
  primary_role: "execution-plan"
