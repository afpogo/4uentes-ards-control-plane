schema_version: "1.0"
phase: 2
id: "CR-SST-0152"
title: "Govern minimal SST development release train"
status: running
source_request: "requests/inbox/CR-SST-0152-sst-governed-development-release-train.yaml"
created_at: "2026-08-06"
requester: "4uentes"
summary: >
  Recompose, validate and serially promote the minimum stable SST train from
  sst-bend through 4uentes-auth to sst-fend. Browser extension work and the
  preview cohort are deferred; CR-SST-0149 remains a separate frontend draft.

control_plane_context:
  initiative_id: "INIT-SST-0004"
  initiative_file: "initiatives/INIT-SST-0004-infrastructure-production-readiness.yaml"
  historical_baseline_request_id: "CR-SST-0003"
  historical_baseline_role: "deployment-workflow-and-gitops-evidence-only"
  promotion_manifest: "evidence/requests/CR-SST-0152/promotion-manifest.yaml"
  recomposition_plan: "evidence/requests/CR-SST-0152/recomposition-plan.md"
  amendment_evidence: "evidence/requests/CR-SST-0152/minimal-train-amendment-2026-08-06.md"
  related_frontend_request_ids: ["CR-SST-0153", "CR-SST-0154"]
  jira_role: "mirror"
  jira_source_of_truth: false
  jira_epic_key: "TODO"
  jira_task_key: "TODO"
  jira_write_authorization_status: "not-granted"

agent_execution:
  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  task_weight: "complex-high-risk-task"
  primary_profile: "gpt-5.6-sol"
  reasoning_effort: "max"
  fallback_profile: "gpt-5.5"
  fallback_reasoning_effort: "high"
  fallback_rule: >
    Preserve all auth, contract, owner-documentation and release gates; atomize
    or block if the fallback cannot do so safely.
  policy_refs:
    - "specs/integration/policies.yaml"
    - "docs/policies/agent-model-selection-policy.md"
    - "docs/policies/agent-resource-degradation-policy.md"
    - "docs/policies/agent-task-atomization-policy.md"
    - "docs/policies/agent-delegation-policy.md"
    - "docs/policies/agent-context-management-policy.md"
    - "docs/policies/agent-architecture-boundary-policy.md"
    - "docs/policies/owner-documentation-authority-policy.md"
    - "docs/policies/work-tracker-control-plane-authority-policy.md"
    - "docs/policies/jira-cr-mirror-hierarchy-policy.md"
  subagent_deployment_plan:
    mode: "none"
    reason: "Current execution policy disables delegation; auth, contracts and ownership remain in the primary agent."

impact_analysis:
  required: true
  affected_services:
    - {service_id: "sst-bend", via: "recomposed backend release candidate", service_kind: "backend-api", ards_kind: "backend-service", status: "active"}
    - {service_id: "4uentes-auth", via: "recomposed auth/BFF release candidate", service_kind: "backend-bff", ards_kind: "backend-service", status: "active"}
    - {service_id: "sst-fend", via: "recomposed frontend release candidate", service_kind: "frontend-web", ards_kind: "frontend-web", status: "active"}
    - {service_id: "sst-4uentes-infra", via: "automatic image-tag evidence only", service_kind: "infra-gitops", ards_kind: "infra-gitops", status: "observe-only"}
    - {service_id: "4uentes-orchestor", via: "request lifecycle, release gates and evidence", service_kind: "control-plane", ards_kind: "control-plane", status: "active"}
  affected_ards:
    - "release-promotion"
    - "child-repo-owner-documentation"
    - "learning-workspace-context"
    - "article-persisted-filters"
    - "article-text-ingestion"
    - "gitops-rollout-evidence"
  risks:
    - {id: "MIXED_HISTORICAL_BRANCH_SCOPE", severity: critical}
    - {id: "AUTH_OR_SECRET_EXPOSURE", severity: critical}
    - {id: "MIGRATION_OR_ROLLBACK_FAILURE", severity: critical}
    - {id: "UNAPPROVED_RUNTIME_PROMOTION", severity: critical}
    - {id: "OWNER_DOCUMENTATION_DRIFT", severity: high}

execution:
  requires_human_approval: true
  approval_model: "minimal-train control-plane amendment merge approves recomposition; every child merge requires a new approval"
  allowed_window: "manual-gated"
  branch_strategy: "fresh-isolated-worktree-from-revalidated-origin-develop"
  child_repo_mutation_allowed: true
  child_repo_mutation_targets:
    - {service_id: "sst-bend", local_path_ref: "environments/local/bindings.local.yaml#sst-bend"}
    - {service_id: "4uentes-auth", local_path_ref: "environments/local/bindings.local.yaml#4uentes-auth"}
    - {service_id: "sst-fend", local_path_ref: "environments/local/bindings.local.yaml#sst-fend"}
  excluded_repositories:
    - {service_id: "sst-extension", reason: "Explicitly deferred; preserve its partial worktree without commit, push or deletion."}
    - {service_id: "sst-4uentes-infra", reason: "No manual PR; consume only automatic image-tag commits from app workflows."}
    - {service_id: "sst-chatbot", reason: "Not selected and no authorized deployable delta exists."}
    - {service_id: "4uentes-ards-core", reason: "Canonical standard source is outside this lifecycle."}
  deferred_request_ids: ["CR-SST-0120", "CR-SST-0137", "CR-SST-0138", "CR-SST-0139", "CR-SST-0140"]
  implementation_boundary: >
    Recompose only allowlisted stable-train paths and hunks. Exclude all preview
    migrations, DTOs, APIs and UI; exclude CR-SST-0125, historical workflows,
    logs, local evidence, unreferenced images, formatting-only hunks and any
    artifact without an approved lifecycle.
  prohibited_runtime_actions:
    - "workflow_dispatch"
    - "manual infra pull request"
    - "kubectl mutation"
    - "forced Argo CD sync"
    - "manual image mutation outside Actions/GHCR/GitOps"

interfaces:
  new_apis: false
  preserved_endpoint: "POST /4uentes/v1/learning-workspaces/sources/preview"
  preserved_boundary: "preview, accept and accepted context remain separate"
  frontend_only_requests:
    - {request_id: "CR-SST-0153", rule: "A preview never feeds accepted context."}
    - {request_id: "CR-SST-0154", rule: "Use existing manual_text, article_draft and article types without DTO or endpoint changes."}

owner_documentation:
  required: true
  status: planned
  owner_refs:
    - repo: "sst-bend"
      paths:
        - "specs/api/learning-workspaces.yaml"
        - "docs/api/26-learning-workspaces.md"
        - "specs/capabilities/outbound/learning-workspace-context.yaml"
        - "docs/capabilities/outbound/learning-workspace-context.md"
        - "specs/capabilities/outbound/article-persisted-filters.yaml"
        - "docs/capabilities/outbound/article-persisted-filters.md"
    - repo: "4uentes-auth"
      paths:
        - "specs/integrations-api.yaml"
        - "docs/bf/03-routing.md"
        - "specs/capabilities/outbound/learning-workspace-context.yaml"
        - "docs/capabilities/outbound/learning-workspace-context.md"
        - "specs/capabilities/outbound/article-persisted-filters.yaml"
        - "docs/capabilities/outbound/article-persisted-filters.md"
    - repo: "sst-fend"
      paths:
        - "specs/33-articles-frontend.yml"
        - "docs/33-articles-frontend.md"
        - "specs/35-home-frontend.yml"
        - "docs/35-home-frontend.md"
        - "specs/38-learning-workspace-frontend.yml"
        - "docs/38-learning-workspace-frontend.md"
  evidence_refs:
    - "evidence/requests/CR-SST-0152/policy-and-subagent-evidence.md"
    - "evidence/requests/CR-SST-0152/recomposition-plan.md"
    - "evidence/requests/CR-SST-0152/minimal-train-amendment-2026-08-06.md"

required_checks:
  - {service_id: "sst-bend", command: "LearningWorkspace, tag engine, article kind, filter retirement, semantic extension, Plaud atomicity/convergence, build, check and ephemeral migrations up/down/up"}
  - {service_id: "4uentes-auth", command: "build, check and native Text/Web, session semantics, quick-save and legacy-filter retirement scripts"}
  - {service_id: "sst-fend", command: "LearningWorkspace, ArticleCreateFlow, Articles and Home suites; css:types:check; full check"}
  - {service_id: "4uentes-orchestor", command: "npm.cmd run check"}
  - {service_id: "all", command: "owner docs, source/candidate comparison, git diff --check and secret scan"}

promotion:
  draft_preparation: "parallel-allowed"
  merge_and_rollout_order:
    - "sst-bend"
    - "4uentes-auth"
    - "sst-fend"
    - "CR-SST-0149 after main frontend merge"
  required_evidence_per_merge:
    - "independent human merge approval"
    - "successful develop push workflow"
    - "develop-<sha> image tag and digest"
    - "automatic infra image-tag commit"
    - "Argo CD Synced and Healthy"
    - "effective image and feature smoke results"
  closure_gate: "CR-SST-0153, CR-SST-0154 and CR-SST-0152 close only after live rollout and E2E evidence; Jira Listo needs a separate approved batch."

rollback:
  mechanism: "audited Git change restoring known image pins; normal Argo reconciliation"
  known_good_pins:
    sst-bend: "develop-8d36a91832a3"
    4uentes-auth: "develop-82f84da4a99f"
    sst-fend: "develop-164c19cfcb88"

decision:
  status: "blocked-pending-learning-preview-allowlist-amendment-merge"
  approver: "human-direct-execution-request-2026-08-07"
  approval_evidence: "evidence/requests/CR-SST-0152/execution-start-2026-08-07.md"
  blocker_evidence: "evidence/requests/CR-SST-0152/stable-allowlist-gap-2026-08-07.md"
  current_blocker_evidence: "evidence/requests/CR-SST-0152/learning-preview-allowlist-gap-2026-08-07.md"
  ordering_deviation: >
    PR #3 merged before this minimal-train correction. The deviation is
    explicit and no child-repository mutation is authorized by that merge for
    the newly reduced scope.

