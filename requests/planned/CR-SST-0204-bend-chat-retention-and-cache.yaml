implementation:
  - "Publish authenticated list/get/create/promote/finish/delete semantics with idempotency and ownership checks."
  - "Store temporary messages under opaque user/conversation keys with sliding or fixed TTL selected in the owner contract."
  - "Use PostgreSQL as the authority for saved conversations and Redis as cache-aside for reads."
  - "Commit durable writes before cache update/eviction and prevent stale cache resurrection after deletion."
  - "Fan out updates to active sessions through the existing realtime boundary."
