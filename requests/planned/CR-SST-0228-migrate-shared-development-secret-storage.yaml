architecture_decision:
  recommended_path: "guarded-in-place-control-plane-migration"
  rationale:
    - "Avoids destroying local-path PostgreSQL and MongoDB state."
    - "CR-SST-0221 already proved provider reload, rewrite, rotation and rollback semantics on Kubernetes v1.32."
    - "A key-free owner playbook can make the current-node mutation auditable while key material remains outside Git."
  required_node_layout:
    encryption_runtime_directory: "/var/lib/4uentes/kubernetes-encryption"
    api_server_manifest: "/etc/kubernetes/manifests/kube-apiserver.yaml"
    key_file_permissions: "root-only 0600"
    git_key_material_allowed: false
    independent_encrypted_recovery_copy_required: true
  alternatives:
    - id: "controlled-recreation-and-restore"
      status: "allowed-only-after-separate-data-disposition-approval"
      tradeoff: "Most reproducible bootstrap, but highest data-loss and outage risk."
    - id: "discard-development-data-and-recreate"
      status: "rejected-unless-operator-explicitly-classifies-all-current-data-as-disposable"
      tradeoff: "Simpler execution but irreversible loss of current PostgreSQL, MongoDB and cluster state."

