atomized_plan:
  - order: 1
    id: "publish-readiness-plan"
    objective: "Publish this plan, read-only inventory and owner-documentation targets."
    mutation_scope: "control-plane-only"
    risk: "low"
    validation: "Full control-plane check, PR merge and canonical readback."
  - order: 2
    id: "resolve-human-recovery-inputs"
    objective: "Name custodian, destinations, outage, data-loss tolerance and rollback retention."
    mutation_scope: "human-decision-only"
    risk: "critical"
    validation: "Every TODO in unresolved_human_inputs is replaced by an explicit decision."
  - order: 3
    id: "publish-owner-playbook"
    objective: "Implement key-free backup, in-place activation, rewrite, prefix audit and rollback automation in sst-4uentes-infra."
    mutation_scope: "future separately authorized clean owner worktree"
    risk: "high"
    validation: "Owner npm run check, static secret scan, PowerShell parser and disposable dry-run pass."
  - order: 4
    id: "create-and-verify-backups"
    objective: "Create encrypted etcd, PostgreSQL and MongoDB recovery artifacts and validate their restore path."
    mutation_scope: "future exact read/backup authorization; no evidence payloads"
    risk: "critical"
    validation: "Encrypted artifacts, checksum/integrity PASS and bounded restore proof."
  - order: 5
    id: "activate-v1-with-identity-fallback"
    objective: "Install v1 key/config, patch the static API server manifest and verify API recovery."
    mutation_scope: "future exact shared-cluster authorization"
    risk: "critical"
    validation: "API ready, both nodes Ready, Argo Synced/Healthy and existing consumers unchanged."
  - order: 6
    id: "rewrite-and-audit-all-secrets"
    objective: "Rewrite the frozen Secret inventory through the API and verify secretbox v1 raw prefixes silently."
    mutation_scope: "future exact Secret rewrite authorization"
    risk: "critical"
    validation: "Pre/post inventory cardinality matches; every object has the expected provider prefix and remains API-readable."
  - order: 7
    id: "bounded-consumer-validation"
    objective: "Validate auth, backend, chatbot, Redis, PostgreSQL and Mongo readiness without forced restarts unless separately enumerated."
    mutation_scope: "readiness first; restart waves require exact authorization"
    risk: "high"
    validation: "All current workloads Ready and sst-app Synced/Healthy after each approved wave."
  - order: 8
    id: "remove-identity-and-prove-rotation"
    objective: "Remove identity only after v1 audit, rotate writer to v2, retain v1 and prove bounded rollback."
    mutation_scope: "future exact cryptographic transition authorization"
    risk: "critical"
    validation: "v2 steady state, API readiness and retained-v1 recovery PASS."
  - order: 9
    id: "publish-terminal-evidence"
    objective: "Publish sanitized owner/control-plane evidence and reconcile predecessor state."
    mutation_scope: "Git publication; Jira remains a separate exact batch"
    risk: "medium"
    validation: "Owner and control-plane full checks, merges and remote readbacks pass."

rollback_contract:
  before_first_encrypted_write: "Restore the original static pod manifest and remove the staged runtime config."
  after_encrypted_writes_begin: >
    Keep secretbox v1 available. Either restore API readiness with v1 plus
    identity, or put identity first, rewrite every Secret to the baseline and
    verify plaintext prefixes before removing encryption flags.
  disaster_recovery: >
    Restore the encrypted pre-migration etcd snapshot and original API server
    manifest only under the custodian-approved recovery playbook.
  automatic_abort_conditions:
    - "API server does not recover inside the approved timeout."
    - "Any Secret becomes unreadable through the Kubernetes API."
    - "Raw prefix audit cardinality differs from the frozen inventory."
    - "Either shared node is NotReady."
    - "Argo CD is not Synced/Healthy after the bounded wait."
    - "Any current owner workload loses readiness."

