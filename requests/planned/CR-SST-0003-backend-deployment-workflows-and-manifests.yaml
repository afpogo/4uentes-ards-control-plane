orchestration:
  interaction_model:
    - "Use control-plane request first to authorize cross-repo deployment work."
    - "Use infra outbound capabilities as the platform source of truth."
    - "Use child-repo ARDS artifacts to record adoption or rollout of platform expectations."
  child_repo_adoption:
    4uentes-auth:
      preferred_artifact: "specs/capabilities/inbound/platform-gitops-deployment.yaml"
      additional_artifact: "specs/capabilities/inbound/platform-ci-gates.yaml"
      rationale: "This repo already supports inbound capability adoption."
    sst-bend:
      preferred_artifact: "specs/states/deployment-gitops-rollout.yaml"
      alternative_artifact: "specs/capabilities/inbound/platform-gitops-deployment.yaml"
      rationale: "Current repo rules model sst-bend as outbound-only for capabilities, so platform adoption needs either a state artifact or an explicit policy exception."
  workflow_gap_summary:
    - "sst-bend still contains a direct deploy workflow that calls Argo CD sync."
    - "sst-bend CI builds a Docker image locally but does not publish the tag consumed by infra."
    - "4uentes-auth has no versioned GitHub Actions workflow for image build/publish."
    - "Infra manifests already define the runtime image references and GitOps path."
  expected_execution_slices:
    - repo: sst-4uentes-infra
      outcome: "Confirm deployment contract, tag strategy and CI/GitOps boundary."
    - repo: sst-bend
      outcome: "Replace direct deploy semantics with build/publish and deployment adoption evidence."
    - repo: 4uentes-auth
      outcome: "Add build/publish workflow and deployment adoption evidence for the shared auth/BFF runtime."

