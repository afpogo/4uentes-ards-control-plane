    service_id: "4uentes-auth"
    objective: "Ensure structured article tags cross the BFF/auth boundary intentionally."
    expected_work:
      - "Inspect article create/update pass-through or BFF transformation behavior."
      - "Preserve structured tag payloads without lossy string-only conversion."
      - "Validate auth-protected article tag operations."
  - id: "frontend-article-tags-ui"
    service_id: "sst-fend"
    objective: "Adopt structured tags in article create/update workflows."
    expected_work:
      - "Inspect current article editor tag model."
      - "Support selecting or entering structured tags for create/update."
      - "Render returned article tags from includeTags=true consistently."
