  - {order: 1, id: "publish-control-plane-plan", objective: "Merge and read back this lifecycle.", risk: "medium", validation: "Control-plane full check and remote readback."}
  - {order: 2, id: "publish-running-owner-plan", objective: "Refresh sst-bend develop and publish exact owner paths before editing.", risk: "high", validation: "Owner boundary review and control-plane full check."}
  - {order: 3, id: "freeze-historical-schema", objective: "Remove mutable runtime-schema ownership from the historical creation migration.", risk: "high", validation: "Static review, migration tests and owner docs."}
  - {order: 4, id: "prove-database-paths", objective: "Prove fresh up, historical upgrade, relevant down/up and target schema parity.", risk: "high", validation: "Disposable PostgreSQL with synthetic fixtures only."}
  - {order: 5, id: "publish-and-reconcile", objective: "Publish owner correction and reconcile control-plane/Jira through later exact gates.", risk: "high", validation: "Owner CI, both full checks and canonical readbacks."}

