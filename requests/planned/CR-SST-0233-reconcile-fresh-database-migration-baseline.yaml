  observed_failure: "duplicate document_agent_jobs.tenant_id on a fresh database"
  cause: >
    The historical creation migration imports the current DocumentAgentJob
    runtime schema, which now includes the later adoption fields.
  authority_rule: >
    Historical migrations describe schema at their own point in time; runtime
    models describe the current target and must not change historical behavior.

preferred_correction:
  strategy: "freeze-historical-create-schema"
  requirements:
    - "Freeze the historical migration to its original document_agent_jobs table shape."
    - "Keep 20260829010000-adopt-article-agent-processing-v1 as sole owner of the new columns."
    - "Preserve databases where the historical migration already ran."
    - "Do not hide drift with broad catch-and-ignore behavior."
    - "Add a complete empty-PostgreSQL migration regression."
    - "Validate relevant down/up behavior or document and approve any residual."

