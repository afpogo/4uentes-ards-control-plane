schema_version: "1.0"
phase: 2
id: "CR-SST-0040"
title: "Define Jira and control-plane status synchronization policy"
status: "inbox"
created_at: "2026-06-07"
requester: "4uentes"

business_context: >
  CR-SST-0039 synchronized the open feature-state backlog into Jira. The next
  operational question is how Jira issue status changes and control-plane
  lifecycle changes should remain aligned without making Jira the source of
  truth.

requested_change: >
  Define the status synchronization policy between Jira and the control-plane.
  The policy must clarify who updates Jira, who updates control-plane state,
  what changes are automatic, what changes require evidence, and how Jira
  status observations become control-plane events.

expected_outcome: >
  A documented policy and implementation plan for bidirectional status
  synchronization signals. Jira remains an operational mirror, while the
  control-plane remains authoritative for feature_state and CR-SST lifecycle
  transitions.

initial_scope:
  solution: "sst"
  services: []
  include_optional_services: false

impact_analysis:
  required: true
  affected_services: []
  affected_ards: []
  capabilities:
    - jira-backlog-sync-state-machine
    - jira-mcp-ticketing
    - control-plane-process-lifecycle
  risks:
    - id: JIRA_CONTROL_PLANE_AUTHORITY_DRIFT
      severity: high
    - id: AUTOMATIC_STATUS_TRANSITION_RISK
      severity: high
    - id: EVIDENCELESS_DONE_TRANSITION
      severity: high

