schema_version: "1.0"
phase: 2
id: "CR-SST-0049"
title: "Define Jira backlog ticket format and dry-run payloads"
status: "inbox"
created_at: "2026-06-07"
requester: "4uentes"

summary: >
  Define the Jira ticket format for deferred backlog items registered in the
  control-plane and generate dry-run payloads without writing to Jira Cloud.

business_context: >
  CR-SST-0047 separated stable backlog identities from CR-SST execution
  numbers. The control-plane now needs a consistent Jira-visible ticket format
  so deferred items can be reviewed by backlog id first, then assigned to a
  concrete CR-SST only when they are promoted for execution.

requested_change: >
  Add a dry-run command that reads state/jira-backlog-registry.yaml and renders
  Jira issue payloads. The summary must always include the backlog id. The
  assigned CR-SST must remain explicit in the description and labels when an
  item has been promoted.

expected_outcome: >
  The control-plane can preview the exact Jira tickets that would be created for
  deferred backlog items without performing external writes.

initial_scope:
  solution: "sst"
  repository: "4uentes-orchestor"
  include_functional_repositories: false

required_context:
  - "requests/done/CR-SST-0047-jira-backlog-registry-and-cr-allocation-policy.yaml"
  - "state/jira-backlog-registry.yaml"
  - "docs/requests/jira-backlog-registry-policy.md"
  - "docs/requests/jira-mcp-deferred-backlog-e2e-policy.md"
  - "package.json"

validation:
  required_checks:
    - "node --check scripts/jira-mcp/generate-backlog-dry-run.js"
    - "npm run jira:mcp:backlog-dry-run -- --request-id CR-SST-0049 --output-dir evidence/requests/CR-SST-0049"
    - "npm run check"
  evidence_required:
    - "backlog_ticket_payload_dry_run"
    - "implementation_summary"
    - "changed_files_summary"
    - "validation_results"

execution:
  requires_human_approval: false
  jira_write_allowed: false
  functional_repo_changes_allowed: false
  external_write_allowed: false

risk:
  level: "high"
  score: 7
  drivers:
    - "Jira-visible ticket identity affects future backlog synchronization."
    - "This request prepares future external writes, but must remain dry-run."
    - "Backlog id and assigned CR-SST must not be conflated."

decision:
  status: "approved"
  approver: "4uentes"
  note: "Approved as a local dry-run and documentation change only."
