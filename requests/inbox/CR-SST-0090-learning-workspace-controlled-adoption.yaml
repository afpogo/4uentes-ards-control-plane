schema_version: "1.0"
phase: 2
id: "CR-SST-0090"
title: "Adopt SST LearningWorkspace as governed runtime learning container"
status: inbox
created_at: "2026-06-28"
requester: "4uentes"

business_context: >
  SST needs a governed runtime container for courses, sources, documents,
  assets, labs, learning specs, import warnings, progress, and recallable user
  learning context. The model must preserve the CR-SST-0030 boundary: SST does
  not create a per-user ARDS/SDD and does not clone project governance files per
  user.

requested_change: >
  Define LearningWorkspace as an account/user-scoped runtime model under SST
  user internal memory. The model bridges CR-SST-0031 memory, CR-SST-0088
  learning sources, and CR-SST-0089 preview/import while keeping sst-bend as the
  only authority for persistence, scope filtering, import consolidation, and
  chatbot context reads.

expected_outcome: >
  The control-plane records the LearningWorkspace boundary, chatbot read
  contract, preview/import consolidation rules, future implementation phases,
  and security rules before any sst-bend, sst-chatbot, or sst-fend repository is
  modified.
