schema_version: "1.0"
phase: 1
id: "CR-CP-0028"
title: "Promote knowledge-to-execution documentation policy to Core"
status: "inbox"
created_at: "2026-09-05"
requester: "4uentes"

business_context: >
  CR-CP-0026 defined, validated and published the control-plane policy that
  distinguishes Learning, Playbook, Runbook and Specs/manifests while keeping
  technical authority, execution authorization and evidence feedback explicit.
  Shared reuse now requires a Core-owned canon instead of copying the local
  definition into adopters.

requested_change: >
  Promote knowledge-to-execution-documentation-policy to 4uentes-ards-core as
  a provider-agnostic, core-profile-scoped policy through a separate Core owner
  workflow and preserve the control plane as origin and handoff producer.

expected_outcome: >
  Core can become the canonical owner of the reusable policy after its own
  validation and publication, while local adoption and every child rollout
  remain explicit, profile-scoped and request-driven.

initial_scope:
  initiative_id: "INIT-CP-0003"
  predecessor_request_id: "CR-CP-0026"
  origin_policy_id: "knowledge-to-execution-documentation-policy"
  origin_repository: "4uentes-orchestor"
  target_repository: "4uentes-ards-core"
  target_policy_class: "core-profile-scoped"
  delivery: "control-plane reservation, promotion plan and owner handoff"

constraints:
  - "This inbox reserves identity and authorizes control-plane planning only."
  - "Do not modify 4uentes-ards-core from this control-plane workflow."
  - "A separate Core owner workflow must accept the handoff before any Core mutation."
  - "Do not modify functional, Auth or infrastructure repositories under this request gate."
  - "Do not reinterpret CR-CP-0027 as Core promotion; it is a distinct active Infra adoption lifecycle."
  - "Do not use policy_overlay: the candidate is a durable shared policy, not a contextual delta."
  - "Core publication alone must not prove child adoption."
  - "Do not publish done state before owner publication, validation and canonical readback are evidenced."
  - "Jira is a mirror; no create, edit, comment or transition is authorized by this reservation."
  - "Preserve the dirty originating worktree and do not merge it wholesale."

