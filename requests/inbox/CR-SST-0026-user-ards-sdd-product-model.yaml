schema_version: "1.0"
phase: 2
id: "CR-SST-0026"
title: "Define SST user ARDS/SDD product model"
status: "inbox"
created_at: "2026-06-03"
requester: "4uentes"

business_context: >
  SST's main product direction is a user-owned ARDS/SDD. External sources,
  summaries, tags, concepts, evidence, decisions, and agent derivations should
  become governed user knowledge instead of isolated saved documents or plain
  database rows.

requested_change: >
  Define the product model for a user ARDS/SDD in SST, including source records,
  knowledge entries, evidence references, visibility states, approval states,
  account/user scope, and the authority boundary between agent-produced
  proposals and backend-validated user ARDS mutations.

expected_outcome: >
  A control-plane request plan that makes the user ARDS/SDD the primary SST
  product model and prepares later implementation work without modifying
  functional repositories.

initial_scope:
  solution: "sst"
  services:
    - sst-fend
    - sst-bend
    - sst-chatbot
    - 4uentes-auth
  include_optional_services: false

impact_analysis:
  required: true
  affected_services: []
  affected_ards: []
  capabilities:
    - user-workspace-provisioning
    - generated-workspace-governance
    - user-activity-ards-memory
    - application-context-connector
  risks:
    - id: USER_ARDS_PRODUCT_BOUNDARY
      severity: high
    - id: USER_DATA_AUTHORIZATION_SCOPE
      severity: high
    - id: AGENT_AUTHORITY_BOUNDARY
      severity: high

required_context:
  - "solutions/sst.yaml"
  - "catalog/services/sst-fend.yaml"
  - "catalog/services/sst-bend.yaml"
  - "catalog/services/sst-chatbot.yaml"
  - "catalog/services/4uentes-auth.yaml"
  - "requests/done/CR-SST-0021-ards-core-memory-runtime-phases.yaml"
  - "requests/done/CR-SST-0022-local-fake-orchestrator-handoff-adapter.yaml"
  - "docs/ai/model-selection-policy.md"

required_checks:
  - service_id: 4uentes-orchestor
    command: "npm run check"

risk:
  level: "high"
  score: 8
  drivers:
    - USER_ARDS_PRODUCT_BOUNDARY
    - USER_DATA_AUTHORIZATION_SCOPE
    - AGENT_AUTHORITY_BOUNDARY
    - MULTI_SERVICE_CONTRACT_SCOPE

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - USER_ARDS_PRODUCT_BOUNDARY
    - USER_DATA_AUTHORIZATION_SCOPE
    - AGENT_AUTHORITY_BOUNDARY
    - MULTI_SERVICE_CONTRACT_SCOPE

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "User ARDS/SDD product modeling crosses user data, authorization, agent proposal authority, and multi-service SST contracts."

subagent_deployment_plan:
  required: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - cross-repo-impact-reviewer
    - validation-reviewer
  parallelizable: true
  fallback: "Subagent tools require explicit user delegation; if not explicitly requested, the main agent must perform architecture, security, cross-repo, and validation reviews sequentially."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: "manual"
  branch_strategy: "orchestrator-only"

validation:
  required_checks:
    - "npm run check"
  evidence_required:
    - "user_ards_product_model"
    - "authority_boundary_summary"
    - "changed_files_summary"
    - "impacted_services_summary"

decision:
  status: "pending"
  approver: "TODO"

planner_notes:
  - "This request must not treat ARDS as a database. Storage is implementation detail; ARDS/SDD is the governed user knowledge model."
  - "Functional repositories must not be modified during inbox/planned lifecycle creation."
