schema_version: "1.0"
phase: 1
id: "CR-SST-0229"
title: "Reconcile historical SST kind API-port stabilization"
status: "inbox"
created_at: "2026-08-28"
requester: "4uentes"

business_context: >
  Historical work stabilized the SST development kind API at
  127.0.0.1:16443 and the durable ingress binding at
  127.0.0.1:8088 -> 32080. That work was performed under the unpublished
  label CR-SST-0210, which collides with a different canonical request, and
  the observed owner-repository artifacts remain in a dirty local worktree.

requested_change: >
  Reconcile the completed historical execution under a unique canonical
  identity without rewriting its provenance: inventory the exact owner
  artifacts and runtime evidence, determine which changes are unpublished,
  prepare an owner-scoped recovery and publication plan, and define the later
  Jira correction for SST-119 as a separately authorized mirror operation.

expected_outcome: >
  The kind API-port stabilization is attributable to CR-SST-0229, the stale
  CR-SST-0210 label remains historical provenance only, owner changes are not
  mistaken for canonical publication, and any future integration or tracker
  correction proceeds through explicit validation and authorization gates.

initial_scope:
  solution: "sst"
  primary_initiative_id: "INIT-SST-0004"
  quality_reconciliation_initiative_id: "INIT-SST-0009"
  coordinator_request_id: "CR-SST-0222"
  control_repository: "4uentes-orchestor"
  owner_repository: "sst-4uentes-infra"
  target_environment: "development"
  target_cluster: "cluster.sst-dev.kind"
  historical_label: "CR-SST-0210"
  historical_jira_issue: "SST-119"

ordering_deviation: >
  Owner-repository edits, controlled cluster recreation, host restart
  validation and Jira synchronization occurred before this canonical request
  was reserved. CR-SST-0229 records that deviation; it does not retroactively
  convert the collided label into valid authorization or prove that the dirty
  owner changes were published.

constraints:
  - "This inbox reserves identity and supports planning only."
  - "Do not modify, clean, stage, commit, publish or retire the dirty sst-4uentes-infra worktree during reservation."
  - "Do not mutate or recreate the cluster, restart the host, access backups or secrets, or change runtime bindings."
  - "Separate observed current owner-repository facts from historical evidence and unresolved publication state."
  - "Do not reuse CR-SST-0210 as a canonical identity; it belongs to the published memory identity scope."
  - "Keep robots.txt and llms.txt outside SST scope and do not create either file."
  - "Jira is a mirror; no correction to SST-119 is authorized by this reservation."
  - "Do not expose credentials, private URLs, cloud identifiers, account identifiers, secret values or backup contents in evidence."

