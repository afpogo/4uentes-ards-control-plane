schema_version: "1.0"
phase: 2
id: "CR-4UENTES-0015"
title: "Portfolio contact exposure policy"
status: "inbox"
created_at: "2026-07-04"
requester: "4uentes"

summary: >
  Define and apply the public contact exposure policy for 4uentes-portfolio,
  keeping professional contact paths visible while removing unnecessary direct
  personal data from the contact screen.

initial_scope:
  solution: "4uentes"
  services:
    - "4uentes-portfolio"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-PORTFOLIO-0001"
  parent_request_id: "CR-4UENTES-0014"
  feature_id: "portfolio-contact-exposure-policy"
  child_repo: "4uentes-portfolio"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-portfolio"
      via: "visible contact screen, contact metadata, CV/contact policy, and owner docs"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
    - "contact-asset"
    - "privacy-boundary"
    - "publication-readiness"
    - "owner-documentation"
  capabilities:
    - "portfolio-contact-exposure-policy"

required_context:
  - "requests/planned/CR-4UENTES-0014-portfolio-experience-copy-review.yaml"
  - "4uentes-portfolio: docs/portfolio-intent.md"
  - "4uentes-portfolio: docs/evidence/README.md"
  - "4uentes-portfolio: specs/features/00-index.yaml"
  - "4uentes-portfolio: src/pages/Dashboard/screens/Contacts/"
  - "4uentes-portfolio: src/pages/Home/components/Hero/index.tsx"

execution:
  requires_human_approval: false
  allowed_window: "manual"
  branch_strategy: "child-repo-small-ui-content-cut"
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
    service_id: "4uentes-portfolio"
  owner_documentation_required: true
  implementation_boundary: >
    Mutate contact copy/metadata and owner docs only. Do not change GitHub
    enrichment, project labels, experience copy, runtime architecture,
    deployment, or assets.

owner_documentation:
  required: true
  status: planned
  owner_repo: "4uentes-portfolio"
  planned_owner_docs:
    - "docs/portfolio-intent.md"
    - "docs/evidence/README.md"
    - "specs/features/00-index.yaml"

validation:
  required_checks:
    - "4uentes-portfolio: npm.cmd run check"
    - "4uentes-orchestor: npm.cmd run check"
  evidence_required:
    - "contact_exposure_policy"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: "approved-for-local-execution"
  approver: "4uentes"
  blocker: "none"
