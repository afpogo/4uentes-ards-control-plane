schema_version: "1.0"
phase: 2
id: "CR-SST-0194"
title: "Integrate governed memory proposals and recall into SST chatbot"
status: "inbox"
created_at: "2026-08-17"
requester: "4uentes"
business_context: >
  The governed RAG kernel and HTTP chat runtime are implemented but remain
  disconnected from canonical SST user memory.
requested_change: >
  Add sst-bend memory adapters, proposal output and a memory-aware chat runtime
  that composes authorized recall without exposing principal scope to the LLM.
expected_outcome: >
  A chat turn can propose a fact or intention and a later turn can recall
  accepted memory with citations and sanitized failure behavior.
initial_scope:
  solution: "sst"
  services: ["sst-chatbot", "sst-bend", "4uentes-auth"]
constraints:
  - "Execution requires later explicit child-repository approval."
  - "sst-chatbot cannot write canonical memory directly."
  - "Provider output cannot expand identity, scope or entitlements."
decision:
  status: "approved-for-planning"
  approver: "4uentes"
  decided_at: "2026-08-17"
