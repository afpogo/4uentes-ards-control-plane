schema_version: "1.0"
phase: 2
id: "CR-SST-0020"
title: "Analyze SST cluster publication through ngrok with productive domain and branch policy"
status: "inbox"
created_at: "2026-05-29"
requester: "4uentes"

business_context: >
  SST is currently deployed locally in a Kubernetes cluster and reachable on
  the workstation through the local ingress endpoint. The next objective is to
  analyze the deployed application deeply and define the steps required to
  publish it to the internet with a productive accessible domain through ngrok.
  The analysis must also review whether GitOps/image build sources should move
  from the current development branch to main or another release branch.

requested_change: >
  Start the orchestrator lifecycle for a cluster publication analysis. The
  first deliverable is an auditable plan and evidence trail before changing
  child repositories, manifests, CI, GitOps, ngrok configuration, DNS, or branch
  policies.

expected_outcome: >
  A deep analysis plan for publishing SST through ngrok, including current
  cluster state, ingress behavior, public URL/domain options, branch/build
  policy, risks, validation gates, and the sequence of changes needed to reach a
  production-like internet-accessible deployment.

