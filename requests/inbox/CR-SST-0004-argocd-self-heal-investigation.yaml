id: "CR-SST-0004"
title: "Argo CD self-heal investigation and operating tutorial"
status: "inbox"
created_at: "2026-05-19"
requester: "4uentes"

business_context: >
  The SST platform currently enables automated sync, prune and self-heal in
  Argo CD, but the operational meaning, safety boundaries and evolution path
  are not yet documented in a way that supports confident human or AI-assisted
  decision making.

requested_change: >
  Investigate the current Argo CD self-heal behavior used by
  `sst-4uentes-infra`, explain what it does in practice, when it helps, its
  pros and cons, and how the platform could evolve from the current local
  development model to a more controlled staging/production posture.

expected_outcome: >
  Produce a control-plane tutorial that explains self-heal in the current SST
  infrastructure, including runtime meaning, examples of drift correction,
  operational guidance, risks, and recommended future evolution.

