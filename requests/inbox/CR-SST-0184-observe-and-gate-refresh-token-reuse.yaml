schema_version: "1.0"
phase: 1
id: "CR-SST-0184"
title: "Observe and gate refresh token reuse"
status: "inbox"
created_at: "2026-08-15"
requester: "4uentes"
business_context: >
  A stale rotating refresh can indicate theft or a legitimate duplicate caused
  by clients and lost responses. Early enforcement would create false positives.
requested_change: >
  Add secret-safe family reuse telemetry in off/observe modes and define an
  evidence-based gate before any enforce-mode revocation.
expected_outcome: >
  SST measures stale-generation reuse without PII or raw tokens and makes a
  separate reviewed enforcement decision.
