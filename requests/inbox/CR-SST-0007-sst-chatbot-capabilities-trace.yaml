title: "Trace sst_chatbot capabilities for 4uentes-orchestor"
status: "inbox"
created_at: "2026-05-20"
requester: "4uentes"

business_context: >
  A local SST chatbot integration repository exists under the SST workspace and
  defines ARDS/SDD capabilities, including a boundary for handoff to the
  4uentes-orchestor repository. The control-plane needs trace evidence before
  deciding whether this repository becomes a cataloged service or an external
  capability producer.

requested_change: >
  Inspect the local sst_chatbot repository read-only, enumerate its capability
  specs and orchestrator-related contracts, and document whether 4uentes-
  orchestor currently catalogs or consumes those capabilities.

expected_outcome: >
  Produce control-plane evidence that lists the capabilities defined by
  sst_chatbot, identifies the orchestrator boundary contract, and records
  missing adoption/catalog gaps in 4uentes-orchestor.

