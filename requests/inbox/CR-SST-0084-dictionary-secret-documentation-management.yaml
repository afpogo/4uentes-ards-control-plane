schema_version: "1.0"
phase: 1
id: "CR-SST-0084"
title: "Dictionary Secret Documentation Management"
status: inbox
created_at: "2026-06-24"
requester: "4uentes"

summary: >
  Add a Dictionary capability for user-owned operational secrets: document
  secret metadata, classify secret types, protect sensitive values, reveal or
  copy values only through explicit audited actions, and associate secrets with
  connection profiles. This capability does not replace an enterprise vault.

initial_scope:
  solution: "sst"
  services:
    - "sst-bend"
    - "4uentes-auth"
    - "sst-fend"
  include_optional_services: false

out_of_scope:
  - "sst-extension runtime adoption in v1"
  - "seed_phrase or wallet recovery phrase storage"
  - "enterprise vault replacement"
  - "exporting secret values to JSON, CSV, docs, prompts, analytics, logs, or evidence"

notes:
  - "Use encrypted-at-rest storage from v1; plaintext secret values must never be persisted."
  - "Lists and searches return metadata only. Secret values are returned only by explicit reveal/copy endpoints."
  - "Reveal/copy actions must be audited and account/user scoped."
  - "Connection profiles cover web, API, database, SSH/SFTP, SMTP, OAuth app, cloud, webhook, VPN, Kubernetes, CI/CD, payment, AI, storage, and repository providers."
