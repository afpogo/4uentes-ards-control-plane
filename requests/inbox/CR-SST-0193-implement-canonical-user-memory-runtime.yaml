schema_version: "1.0"
phase: 2
id: "CR-SST-0193"
title: "Implement canonical SST user memory persistence and APIs"
status: "inbox"
created_at: "2026-08-17"
requester: "4uentes"
business_context: >
  The first memory vertical requires sst-bend to own private durable events,
  proposals, facts, intentions, threads and recall evidence.
requested_change: >
  Implement scoped persistence, migrations, repositories, validation,
  idempotency and internal/authenticated APIs in sst-bend.
expected_outcome: >
  SST can durably accept and retrieve governed user memory without allowing
  the chatbot or frontend to bypass backend authority.
initial_scope:
  solution: "sst"
  services: ["sst-bend"]
constraints:
  - "Execution requires later explicit child-repository approval."
  - "All reads and writes must isolate tenant, account and user."
  - "Raw chat must not automatically become accepted memory."
decision:
  status: "approved-for-planning"
  approver: "4uentes"
  decided_at: "2026-08-17"
