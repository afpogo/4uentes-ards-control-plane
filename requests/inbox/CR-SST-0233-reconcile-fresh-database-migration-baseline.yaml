schema_version: "1.0"
phase: 1
id: "CR-SST-0233"
title: "Reconcile the SST fresh-database migration baseline"
status: "inbox"
created_at: "2026-08-30"
requester: "4uentes"

business_context: >
  A disposable PostgreSQL validation of the current sst-bend development line
  reached the article-processing migration and failed because the historical
  document_agent_jobs creation migration imports the mutable current runtime
  model. That model now contains columns owned by the later adoption migration.

requested_change: >
  Restore a deterministic sst-bend migration chain without changing the
  published article-processing contract: freeze the historical table schema at
  its original shape, keep the adoption migration as the sole owner of the new
  columns, add reproducible migration regression coverage and document owner
  authority and rollback behavior.

expected_outcome: >
  Empty and representative historical PostgreSQL schemas reach the same target
  without duplicate columns, data loss or implicit schema synchronization, and
  the relevant rollback/reapplication path is proven on synthetic disposable data.

