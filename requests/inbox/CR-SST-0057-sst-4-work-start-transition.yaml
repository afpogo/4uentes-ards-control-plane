schema_version: "1.0"
phase: 2
id: "CR-SST-0057"
title: "Start SST-4 work for SST Tags Governance"
status: "inbox"
created_at: "2026-06-07"
requester: "4uentes"

summary: >
  Govern the current transition of Jira issue SST-4 / sst-tags-governance from
  pending work toward active work, without reopening historical CR-SST requests.

business_context: >
  SST-4 represents the feature-state ticket for SST Tags Governance. It is
  currently linked to historical request evidence from CR-SST-0010,
  CR-SST-0014, CR-SST-0015, and CR-SST-0016, but the current operational action
  needs a new governing CR-SST so the transition and follow-up work are
  auditable.

requested_change: >
  Prepare the control-plane to treat SST-4 as the next selected work item,
  record the involved historical CR-SST requests as provenance, and define how
  Jira should be transitioned and observed.

expected_outcome: >
  SST-4 can be moved to active work under CR-SST-0057, while CR-SST-0010,
  CR-SST-0014, CR-SST-0015, and CR-SST-0016 remain historical origin evidence.

initial_scope:
  solution: "sst"
  repository: "4uentes-orchestor"
  feature_state: "sst-tags-governance"
  jira_issue_key: "SST-4"
  include_functional_repositories: false

origin_requests:
  - "CR-SST-0010"
  - "CR-SST-0014"
  - "CR-SST-0015"
  - "CR-SST-0016"

required_context:
  - "state/features/sst-tags-governance.current.yaml"
  - "evidence/requests/CR-SST-0055/unified-jira-radar.md"
  - "docs/requests/jira-status-event-transition-contract.md"
  - "evidence/requests/CR-SST-0055/jira-status-observation-results.json"

validation:
  required_checks:
    - "npm run check"
  evidence_required:
    - "transition_scope_review"
    - "involved_cr_sst_matrix"
    - "validation_results"

execution:
  requires_human_approval: true
  jira_write_allowed: true
  jira_write_note: "Transitioning SST-4 in Jira requires either manual operator action or a future controlled transition writer."
  functional_repo_changes_allowed: false
  external_write_allowed: true

risk:
  level: "medium"
  score: 5
  drivers:
    - "Jira status transition must not imply local feature_state completion."
    - "Historical CR-SST requests must remain provenance, not active execution requests."
    - "The controlled Jira transition writer is not yet implemented."

decision:
  status: "approved-for-planning"
  approver: "4uentes"
  note: "Use CR-SST-0057 as the current governing request for SST-4 transition planning."
