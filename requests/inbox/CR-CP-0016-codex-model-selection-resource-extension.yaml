business_context: >
  Codex now exposes the GPT-5.6 family while the current agent model selection
  policy still routes work through GPT-5.3, GPT-5.4, and GPT-5.5 aliases.

requested_change: >
  Extend the existing agent-model-selection-policy without changing its id.
  Use GPT-5.6 Sol for normal and high resource availability, retain the
  previous routing matrix for low resources, and allow Spark only for safe,
  bounded work under very-low resources. Keep runtime detection deferred to
  INIT-CP-0003 / ARDS-13.

expected_outcome: >
  Codex planning records task weight, resource availability, model, reasoning
  effort, fallback, and signal source without modeling billing resources.

