schema_version: "1.0"
phase: 2
id: "CR-SST-0023"
title: "Investigate local SST infra unauthorized resource APIs and scraper 500 errors"
status: inbox
created_at: "2026-06-02"
requester: "4uentes"

business_context: >
  Local SST access through localhost:8088 is returning unauthorized errors when
  listing or creating resources such as articles, and scraper access returns a
  server error. The issue may involve frontend routing, backend authorization,
  shared auth, scraper integration, or local infrastructure wiring.

requested_change: >
  Investigate localhost:8088 with Chrome DevTools and inspect involved
  repositories to identify the root cause and required remediation path.

expected_outcome: >
  Produce evidence-backed diagnosis for unauthorized resource API failures and
  scraper 500 failures, with any required fixes scoped through the request
  lifecycle before modifying child repositories.

