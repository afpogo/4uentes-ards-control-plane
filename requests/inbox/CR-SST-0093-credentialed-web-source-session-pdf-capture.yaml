schema_version: "1.0"
phase: 2
id: "CR-SST-0093"
title: "Define credentialed web source and session PDF capture boundary"
status: inbox
created_at: "2026-06-30"
requester: "4uentes"

business_context: >
  DictionarySecret must evolve from documented secret metadata into a governed
  SST resource that can support private web content acquisition without exposing
  plaintext secrets to frontend state, agents, logs, or evidence. The first
  practical concern is the existing sst-extension session capture path: private
  pages already authenticated in the user's browser must be captured tab by tab
  as trustworthy artifacts before any backend secret-driven acquisition is
  considered.

requested_change: >
  Record the ARDS/SDD boundary for CredentialedWebSource and the current
  sst-extension session PDF capture gap. Do not mutate child repositories in
  this request. Prepare a future implementation request that fixes session
  capture to foreground, settle, capture, classify, and restore each tab
  deterministically.

expected_outcome: >
  The control-plane has evidence that text-article-pdf is a single active-tab
  textual path, while session capture is the correct extension path for private
  authenticated pages and requires a focused child-repo fix before it becomes a
  dependable CredentialedWebSource input.
