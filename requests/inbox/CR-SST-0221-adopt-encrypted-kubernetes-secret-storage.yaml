id: "CR-SST-0221"
title: "Adopt encrypted Kubernetes Secret storage for SST development"
status: "inbox"
created_at: "2026-08-27"
requester: "4uentes"
summary: >
  Plan a reproducible encryption-at-rest and secret-lifecycle baseline for the
  shared SST development kind cluster, including key custody, recovery,
  rotation, migration, verification and rollback without exposing Secret
  values.
requested_scope:
  initiative_id: "INIT-SST-0008"
  target_environment: "development"
  target_cluster: "cluster.sst-dev.kind"
  owner_repositories: ["4uentes-orchestor", "sst-4uentes-infra"]
  triggering_request: "CR-HPT-0021"
  affected_runtime_owners: ["4uentes-auth", "sst-bend", "sst-chatbot", "finanzas-personales"]
constraints:
  - "This inbox reserves planning identity only; no child repository, cluster, Secret, key or runtime mutation is authorized."
  - "No Secret value, private key, credential, token, raw etcd payload or decrypted manifest may enter Git, Jira, logs or evidence."
  - "Kubernetes API encryption at rest, Git-stored sealed material and runtime secret delivery are separate decisions and must not be conflated."
  - "Any existing-cluster migration or kind recreation requires an explicit data-preservation, outage, rollback and operator approval gate."
  - "Jira SST-89 is the initiative mirror; no Jira write is authorized by this reservation."
requested_next_step: >
  Merge and read back this reservation, then publish a read-only adoption plan
  with alternatives, recommendation, phased rollout and executable validation
  gates before any infrastructure change.
