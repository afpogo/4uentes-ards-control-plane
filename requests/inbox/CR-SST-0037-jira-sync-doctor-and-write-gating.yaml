schema_version: "1.0"
phase: 2
id: "CR-SST-0037"
title: "Stabilize Jira sync doctor and external write gating"
status: "inbox"
created_at: "2026-06-07"
requester: "4uentes"

business_context: >
  The control-plane now has Jira MCP scripts, a ticket policy, and a declarative
  backlog sync machine. Current Jira issues still contain legacy ticket
  description fields and the operational command surface is hard to reason
  about because read-only, diagnostic, and external write scripts are exposed
  together.

requested_change: >
  Stabilize the Jira/control-plane sync workflow before any further Jira writes.
  Add a read-only doctor concept for analysis, validation, verification, and
  correction planning. Keep actual Jira correction or update actions behind
  explicit write approval and separate commands.

expected_outcome: >
  Operators can run a safe doctor command to understand control-plane state,
  Jira reconciliation state, command readiness, and candidate corrections. Jira
  writes remain blocked unless a later approved write phase consumes the
  doctor's correction plan.

initial_scope:
  solution: "sst"
  services: []
  include_optional_services: false

impact_analysis:
  required: true
  affected_services: []
  affected_ards: []
  capabilities:
    - jira-mcp-ticketing
    - control-plane-process-lifecycle
    - jira-backlog-sync-state-machine
  risks:
    - id: EXTERNAL_WRITE_CONFUSION
      severity: high
    - id: JIRA_DESCRIPTION_DRIFT
      severity: high
    - id: EVIDENCE_OUTPUT_DRIFT
      severity: high
    - id: REQUEST_LIFECYCLE_AMBIGUITY
      severity: medium

required_context:
  - "requests/planned/CR-SST-0034-control-plane-jira-backlog-sync-state-machine.yaml"
  - "requests/planned/CR-SST-0035-jira-backlog-sync-machine-dry-runner.yaml"
  - "requests/planned/CR-SST-0036-jira-backlog-sync-machine-read-only-actions.yaml"
  - "docs/requests/jira-feature-ticket-policy.md"
  - "state/jira-backlog-sync-machine.yaml"
  - "scripts/jira-mcp/"

required_checks:
  - service_id: 4uentes-orchestor
    command: "npm run check"
  - service_id: 4uentes-orchestor
    command: "Get-ChildItem scripts\\jira-mcp -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:doctor -- --request-id CR-SST-0037 --output-dir evidence/requests/CR-SST-0037 --mode read-only"

risk:
  level: "high"
  score: 8
  drivers:
    - EXTERNAL_WRITE_CONFUSION
    - JIRA_DESCRIPTION_DRIFT
    - EVIDENCE_OUTPUT_DRIFT
    - CONTROL_PLANE_PROCESS_LIFECYCLE

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - EXTERNAL_WRITE_CONFUSION
    - EXTERNAL_MCP_CONNECTIVITY
    - CONTROL_PLANE_PROCESS_LIFECYCLE
    - EVIDENCE_OUTPUT_DRIFT

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The task stabilizes external Jira synchronization boundaries and controls future write actions."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - validation-reviewer
  fallback: "If subagent tools are unavailable, the main agent must perform architecture, write-boundary, and validation review sequentially."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: "manual"
  branch_strategy: "control-plane-only"

validation:
  required_checks:
    - "npm run check"
    - "Get-ChildItem scripts\\jira-mcp -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }"
    - "npm run jira:mcp:doctor -- --request-id CR-SST-0037 --output-dir evidence/requests/CR-SST-0037 --mode read-only"
  evidence_required:
    - "doctor_summary"
    - "correction_plan_preview"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: "pending"
  approver: "TODO"

planner_notes:
  - "The doctor is read-only by default."
  - "The doctor may propose corrections but must not apply Jira writes."
  - "Actual Jira create, edit, comment, transition, or close operations require a separate approved write phase."
  - "No functional repositories are modified."
