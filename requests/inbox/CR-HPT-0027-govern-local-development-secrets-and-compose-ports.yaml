schema_version: "1.0"
phase: 1
id: "CR-HPT-0027"
title: "Govern local development secrets and Docker Compose port allocation"
status: "inbox"
created_at: "2026-08-29"
requester: "4uentes"

business_context: >
  CR-HPT-0021 published a secure localhost-only Docker Compose path for
  Phinance and prepared a separate Kubernetes Secret contract. Read-only
  discovery then found that SST Bend and 4uentes Automation use independent
  Compose stacks, do not share one secure bootstrap contract, and reserve the
  same host port 5050 for pgAdmin.

requested_change: >
  Define an owner-preserving runbook and atomized playbooks for generating,
  consuming, validating, rotating and retiring local development credentials,
  while assigning collision-free configurable host ports across Phinance,
  SST Bend and 4uentes Automation. Keep Kubernetes Secret provisioning as an
  independently authorized infrastructure operation.

expected_outcome: >
  Developers can prepare and validate the three local stacks reproducibly
  without committing or reusing credentials, exposing databases unnecessarily,
  joining trust domains, or discovering host-port collisions only after
  containers start.

initial_scope:
  initiative_id: "INIT-HPT-0002"
  jira_epic_key: "HPT-5"
  solution: "finanzas-personales"
  control_repository: "4uentes-orchestor"
  candidate_owner_repositories:
    - "finanzas-personales"
    - "sst-bend"
    - "4uentes-automation"
    - "sst-4uentes-infra"
  predecessor_request_ids:
    - "CR-HPT-0021"
    - "CR-SST-0228"
  discovered_dependency:
    request_id: "CR-CP-0021"
    status: "not-canonical-on-observed-base"
    rule: "Do not mutate 4uentes-automation until its onboarding lifecycle is published and read back."

observed_problem:
  host_port_collision: "SST Bend pgAdmin and 4uentes Automation pgAdmin both request host port 5050."
  phinance_local_secret: "Existing CSPRNG generator plus ignored Docker Secret file with owner-only Windows ACL."
  sst_bend_secret_gap: "Development database and pgAdmin credentials are embedded in Compose and require owner remediation."
  automation_secret_gap: "Base-stack credentials are supplied through .env and lack one bounded general bootstrap playbook."
  kubernetes_gap: "phinance-postgres-secret has an owner contract but is absent and shared-cluster encryption remains a separate gate."

constraints:
  - "This reservation authorizes control-plane lifecycle and sanitized documentation only."
  - "Do not modify child repositories, Docker Compose files, containers, networks, volumes, listeners, cluster resources, Secrets, keys or datastores."
  - "Do not read, copy, print, commit or send credential values to Git, Jira, logs or evidence."
  - "Never reuse one credential across local Compose, Kubernetes, SST Bend, 4uentes Automation or another environment."
  - "Do not connect 4uentes Automation directly to the Phinance or SST trust network merely to coordinate local startup."
  - "Keep every executable playbook in its technical owner repository; the control plane owns lifecycle, orchestration maps and evidence only."
  - "Parameterize host ports with owner-prefixed variables and bind local management surfaces to loopback unless an owner contract explicitly requires otherwise."
  - "PostgreSQL rotation must update the initialized database and every consumer; replacing only a secret file is not a valid rotation."
  - "Kubernetes provisioning requires a later exact authorization and must not source values from application .env files."
  - "Jira remains an operational mirror and requires a planned lifecycle plus an exact write batch before creation."

identity_preflight:
  observed_at: "2026-08-29"
  filesystem_match: false
  git_history_match: false
  jira_match: false
  skipped_ids:
