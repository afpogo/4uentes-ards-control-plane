  datastore_access_allowed: false
  jira_write_allowed: false

requested_next_step: >
  Publish and read back this minimal reservation, refresh the canonical base,
  create one clean planning worktree, and produce the owner-specific impact
  plan, runbook map, port matrix, secret lifecycle and exact Jira write batch
  before requesting any child or runtime mutation.

decision:
