schema_version: "1.0"
phase: 2
id: "CR-SST-0035"
title: "Implement Jira backlog sync state machine dry-runner"
status: "inbox"
created_at: "2026-06-07"
requester: "4uentes"

business_context: >
  CR-SST-0034 defined the Jira backlog synchronization state machine as a
  declarative ARDS/SDD control-plane contract. The next step is to make the
  orchestrator execute the machine in a local dry-run mode so future Jira
  operations are driven by events and guarded transitions instead of ad hoc
  script execution.

requested_change: >
  Add a control-plane-only dry-runner for state/jira-backlog-sync-machine.yaml.
  The runner must simulate read-only sync events, write non-secret evidence, and
  stop before external Jira writes.

expected_outcome: >
  The control-plane can execute a dry-run event trace from idle to
  ready-for-approval using the declarative Jira backlog sync machine.

initial_scope:
  solution: "sst"
  services: []
  include_optional_services: false

