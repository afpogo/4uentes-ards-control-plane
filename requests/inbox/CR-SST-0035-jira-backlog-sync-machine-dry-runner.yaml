  affected_services: []
  affected_ards: []
  capabilities:
    - jira-mcp-ticketing
    - control-plane-process-lifecycle
  risks:
    - id: STATE_MACHINE_DRIFT
      severity: high
    - id: EXTERNAL_JIRA_WRITE_BOUNDARY
      severity: medium

required_context:
