business_context: >
  SST needs a read-only implementation and documentation review for the initial
  Study Store Tag and dictionary model. The review must determine whether the
  concepts are only intake ideas, ARDS/SDD documented, capability modeled,
  partially implemented at runtime, implemented, validated, or blocked.

requested_change: >
  Perform a dry-run review across the SST solution using the control-plane
  catalog and solution routing. Inspect ARDS artifacts first and runtime code
  only when documentation is insufficient. Do not modify functional
  repositories and do not create specs in child repositories.

expected_outcome: >
  Produce control-plane evidence describing the implementation state for Study
  Store Tag purpose, tags as living resources, tag grammar scope/key,
  Dictionary Entry, Dictionary Sheet, translations, aliases, account relation,
  endpoint planning, and security/offline/encryption.

