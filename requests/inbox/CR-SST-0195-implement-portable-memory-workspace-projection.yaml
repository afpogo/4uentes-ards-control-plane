schema_version: "1.0"
phase: 2
id: "CR-SST-0195"
title: "Implement portable ARDS-inspired memory workspace projection"
status: "inbox"
created_at: "2026-08-17"
requester: "4uentes"
business_context: >
  Users should be able to inspect or export their governed knowledge in a
  portable tree without making filesystem layout the canonical memory store.
requested_change: >
  Define and implement a deterministic manifest and safe logical, physical and
  hybrid projection from accepted memory records.
expected_outcome: >
  SST can produce a scoped, versioned and downloadable workspace containing
  only eligible memory and source references.
initial_scope:
  solution: "sst"
  services: ["sst-bend", "sst-chatbot"]
constraints:
  - "Execution requires later explicit child-repository approval."
  - "Reject absolute paths and path traversal."
  - "Exclude secrets, rejected records and raw chat by default."
decision:
  status: "approved-for-planning"
  approver: "4uentes"
  decided_at: "2026-08-17"
