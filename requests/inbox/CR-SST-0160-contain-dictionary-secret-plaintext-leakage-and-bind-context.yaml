schema_version: "1.0"
phase: 2
id: "CR-SST-0160"
title: "Contain Dictionary secret plaintext leakage and bind ciphertext context"
status: "inbox"
created_at: "2026-08-09"
requester: "4uentes"
business_context: >
  Dictionary validation errors can retain the submitted value in Joi
  _original and reach console logging; arbitrary metadata can also store secret
  material outside the encrypted value, and AES-GCM currently has no AAD.
requested_change: >
  Redact validation and runtime errors, constrain and classify metadata, bind
  ciphertext to account/entry/version context with AAD, correct audit outcome
  semantics, and add negative security tests.
expected_outcome: >
  Secret plaintext cannot escape through validation logs or unclassified
  metadata, and authenticated ciphertext cannot be transplanted across records.
initial_scope:
  solution: "sst"
  services:
    - "sst-bend"
  include_optional_services: false
