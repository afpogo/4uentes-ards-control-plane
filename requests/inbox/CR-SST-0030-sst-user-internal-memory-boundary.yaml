schema_version: "1.0"
phase: 2
id: "CR-SST-0030"
title: "Separate project ARDS/SDD from SST user internal memory"
status: "inbox"
created_at: "2026-06-05"
requester: "4uentes"

business_context: >
  4uentes projects are governed by ARDS/SDD files that define project memory,
  lifecycle, evidence, requests, decisions, and agent-collaboration history.
  SST needs a different product concept: an internal memory per user that
  records user actions, facts, intentions, events, and chatbot-assisted recall
  inside the SST platform. These concepts must be separated before implementing
  runtime features.

requested_change: >
  Clarify the boundary between project ARDS/SDD and SST user internal memory,
  correct the terminology used in CR-SST-0026 and CR-SST-0027, define the
  product-facing user memory concept, and block execution of the pending UI and
  persistence request until it targets user internal memory instead of a user
  ARDS/SDD.

expected_outcome: >
  A control-plane correction that preserves audit history while establishing
  `sst_user_internal_memory` as the product model to implement next for user
  events, facts, intentions, chatbot recall, and agent-assisted continuation.

initial_scope:
  solution: "sst"
  services:
    - sst-fend
    - sst-bend
    - sst-chatbot
    - 4uentes-auth
  include_optional_services: false

impact_analysis:
  required: true
  affected_services: []
  affected_ards: []
  capabilities:
    - user-activity-ards-memory
    - application-context-connector
    - prompt-catalog-and-versioning
  risks:
    - id: PROJECT_ARDS_USER_MEMORY_CONFUSION
      severity: high
    - id: USER_EVENT_MEMORY_SCOPE
      severity: high
    - id: CHATBOT_RECALL_AUTHORITY
      severity: high

required_context:
  - "requests/done/CR-SST-0026-user-ards-sdd-product-model.yaml"
  - "requests/done/CR-SST-0027-paragraph-sequential-ards-derivation.yaml"
  - "requests/planned/CR-SST-0028-user-ards-intelligence-ui-and-persistence.yaml"
  - "evidence/requests/CR-SST-0026/user-ards-product-model.md"
  - "evidence/requests/CR-SST-0027/paragraph-derivation-contract.md"
  - "catalog/services/sst-fend.yaml"
  - "catalog/services/sst-bend.yaml"
  - "catalog/services/sst-chatbot.yaml"
  - "catalog/services/4uentes-auth.yaml"
  - "docs/ai/model-selection-policy.md"

