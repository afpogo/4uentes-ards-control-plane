id: "CR-CP-0020"
title: "Promote visual documentation as code policy to ARDS Core"
status: "inbox"
created_at: "2026-08-16"
requester: "4uentes"

business_context: >
  CR-CP-0018 and CR-CP-0019 validated a local profile, templates and quality
  gate for traceable visual ARDS/SDD documentation. Shared adoption requires a
  core-owned policy rather than copying local control-plane rules.

requested_change: >
  Promote the validated visual-documentation contract to 4uentes-ards-core as
  a core-profile-scoped policy with source validation, reusable templates and
  an explicit adoption or exception path.

expected_outcome: >
  Core becomes the canonical owner of the policy while the orchestrator and
  child repos consume it through scoped manifests.
