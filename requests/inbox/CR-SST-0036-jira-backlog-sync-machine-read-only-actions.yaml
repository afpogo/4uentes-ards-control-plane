schema_version: "1.0"
phase: 2
id: "CR-SST-0036"
title: "Connect Jira backlog sync machine to read-only actions"
status: "inbox"
created_at: "2026-06-07"
requester: "4uentes"

business_context: >
  CR-SST-0035 proved that the declarative Jira backlog sync machine can execute
  a local dry-run path from idle to ready-for-approval. The next step is to
  attach real read-only actions to the same machine path while preserving the
  external write boundary.

requested_change: >
  Extend the Jira backlog sync machine runner with a read-only mode that
  executes policy-check, Jira metadata read, duplicate search, and reconciliation
  through the existing MCP scripts. The runner must stop before any Jira write.

expected_outcome: >
  A single orchestrator command executes the read-only state machine path and
  writes non-secret evidence for the action trace.

initial_scope:
  solution: "sst"
  services: []
  include_optional_services: false

impact_analysis:
  required: true
  affected_services: []
  affected_ards: []
  capabilities:
    - jira-mcp-ticketing
    - control-plane-process-lifecycle
  risks:
    - id: EXTERNAL_MCP_CONNECTIVITY
      severity: high
    - id: READ_ONLY_WRITE_BOUNDARY
      severity: high
    - id: STATE_MACHINE_DRIFT
      severity: medium

required_context:
  - "requests/planned/CR-SST-0035-jira-backlog-sync-machine-dry-runner.yaml"
  - "state/jira-backlog-sync-machine.yaml"
  - "scripts/jira-mcp/sync-machine-runner.js"
  - "scripts/jira-mcp/policy-check.js"
  - "scripts/jira-mcp/read-metadata.js"
  - "scripts/jira-mcp/search-duplicates.js"
  - "scripts/jira-mcp/reconcile-existing-issues.js"

required_checks:
  - service_id: 4uentes-orchestor
    command: "npm run check"
  - service_id: 4uentes-orchestor
    command: "npm run jira:mcp:sync-machine -- --connect --request-id CR-SST-0036 --output-dir evidence/requests/CR-SST-0036 --mode read-only"

risk:
  level: "high"
  score: 8
  drivers:
    - EXTERNAL_MCP_CONNECTIVITY
    - READ_ONLY_WRITE_BOUNDARY
    - STATE_MACHINE_DRIFT

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - EXTERNAL_MCP_CONNECTIVITY
    - READ_ONLY_WRITE_BOUNDARY
    - CONTROL_PLANE_PROCESS_LIFECYCLE

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The task connects the state machine runner to external read-only MCP calls while preserving write boundaries."

subagent_deployment_plan:
  required: true
  parallelizable: true
  roles:
    - architecture-reviewer
    - security-contract-reviewer
    - validation-reviewer
  fallback: "If subagent tools are unavailable, the main agent must perform architecture, write-boundary, and validation review sequentially."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: "manual"
  branch_strategy: "control-plane-only"

validation:
  required_checks:
    - "npm run check"
    - "npm run jira:mcp:sync-machine -- --connect --request-id CR-SST-0036 --output-dir evidence/requests/CR-SST-0036 --mode read-only"
  evidence_required:
    - "jira_sync_machine_read_only"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: "pending"
  approver: "TODO"

planner_notes:
  - "No Jira writes are allowed in this request."
  - "No functional repositories are modified."
  - "This request still avoids XState runtime adoption."
