schema_version: "1.0"
phase: 1
id: "CR-CP-0026"
title: "Define knowledge-to-execution documentation policy"
status: "inbox"
created_at: "2026-09-05"
requester: "4uentes"

business_context: >
  CR-HPT-0024 established a reusable human documentation path from learning
  through decision and execution guidance to technical authority. The pattern
  needs explicit authority, authorization and feedback semantics before it can
  be reused safely or proposed for the shared Core canon.

requested_change: >
  Define and validate a control-plane policy for the relationship Learning,
  Playbook, Runbook and Specs/manifests; preserve the HPT-0024 origin; clarify
  authority, authorization and governed feedback; and assess a later promotion
  to 4uentes-ards-core as core-profile-scoped.

expected_outcome: >
  Humans and agents can navigate from rationale to execution without treating
  explanatory documents as technical authority or execution authorization,
  while any Core promotion or child-repository adoption remains a separate
  request-driven lifecycle.

initial_scope:
  initiative_id: "INIT-CP-0003"
  origin_repository: "4uentes-orchestor"
  provenance_request_id: "CR-HPT-0024"
  predecessor_requests:
    - "CR-HPT-0024"
    - "CR-CP-0024"
  delivery: "local policy definition, registry/state integration and evidence"
  future_core_class: "core-profile-scoped"
  core_promotion: false

constraints:
  - "This inbox reserves identity and authorizes control-plane planning only."
  - "Do not modify 4uentes-ards-core under this reservation."
  - "Do not modify functional, Auth or infrastructure repositories under this reservation."
  - "Do not create a policy_overlay unless later analysis proves a contextual delta over a published base policy."
  - "Do not publish done state before required checks, merge and canonical readback."
  - "Jira is a mirror; no create, edit, comment or transition is authorized by this reservation."
  - "The dirty originating worktree must be preserved and must not be merged wholesale."

identity_preflight:
  observed_at: "2026-09-05"
  canonical_ref: "origin/main@ba3851fd3ca1c4cd5afbfd49593a610c2ff69cba"
  canonical_tree_match: false
  reachable_git_ref_match: false
  active_worktree_match: false
  jira_exact_text_match: "not-checked-no-authorized-connector"
  jira_preflight_mode: "read-only-not-applicable-to-local-reservation"
  decision: "CR-CP-0026 is available for this unique intent at reservation time."

task_weight:
  classification: "complex-governance-task"
  risk_level: "medium"
  drivers:
    - "POLICY_AUTHORITY_BOUNDARY"
    - "CORE_PROMOTION_CANDIDATE"
    - "EXISTING_UNPUBLISHED_LOCAL_DRAFT"

model_selection:
