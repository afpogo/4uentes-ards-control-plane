    Operator instruction on 2026-09-05 authorizing evidence preservation,
    policy-compliant worktree creation and merge when needed.
  approval_consumed_for: "reservation commit, push, PR, merge and canonical readback only"
  control_plane_mutation_allowed: true
  git_reservation_publication_allowed: true
  core_repo_mutation_allowed: false
  child_repo_mutation_allowed: false
  runtime_mutation_allowed: false
  infrastructure_mutation_allowed: false
  jira_write_allowed: false

requested_next_step: >
  Publish and read back this minimal reservation, refresh origin/main, then
  create one clean execution worktree and port only the CR-CP-0026 artifacts
  and audit evidence from the dirty originating worktree.

decision:
  status: "approved-for-reservation-publication"
  approver: "4uentes"
  approved_at: "2026-09-05"
  approval_text: >
    ok autorizo crear worktree apegados a la politica viva de worktrees del
    ARDS/SDD control plane, necesito que antes guardes toda la evidencia de lo
    que revisamos hasta aca en el ARDS/SDD y que si es necesario se fusione
    este worktree para no causar mas ruido, avancemos
