  provider: "codex"
  resource_level: "normal"
  resource_source: "default"
  primary_profile: "session-assigned"
  requested_analysis_temperature: 0.5
  temperature_control_available: false
  reason: >
    The operator requested calibrated analysis and independent validation; the
    runtime does not expose a temperature control, so no unsupported setting is
    claimed.

subagent_deployment_plan:
  mode: "parallel-read-only-audit"
  agents_used: 3
  scopes:
    - "Core canonical and remote-ref audit"
    - "Promotion lifecycle and worktree-policy audit"
    - "Semantic duplicate and overlap audit"
  merge_authority: "primary agent"

execution:
