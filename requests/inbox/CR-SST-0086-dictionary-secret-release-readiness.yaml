schema_version: "1.0"
phase: 1
id: "CR-SST-0086"
title: "Dictionary Secrets Release Readiness"
status: inbox
created_at: "2026-06-28"
requester: "4uentes"

summary: >
  Prepare dictionary-secret-management for promotion from validated-local to
  validated-live by closing release-readiness gaps left after CR-SST-0084:
  mandatory runtime master-key configuration, authenticated reproducible smoke
  coverage, frontend DOM and accessibility hardening, and Jira/MCP recovery.

business_context: >
  CR-SST-0084 closed the v1 implementation locally as validated-local. Release
  readiness still requires evidence that the runtime can operate with explicit
  secret configuration, authenticated smoke coverage, and a frontend that does
  not emit invalid nested-button DOM or avoidable form accessibility issues.

requested_change: >
  Advance a new request lifecycle for release readiness without reopening
  CR-SST-0084. Keep the feature state at validated-local until local-runtime or
  live authenticated smokes pass and no plaintext secrets, JWTs, cookies, or
  master-key values are stored in evidence.

expected_outcome: >
  dictionary-secret-management is either promoted to validated-live with
  sanitized evidence, or remains validated-local with explicit blockers and
  follow-up actions.

initial_scope:
  solution: "sst"
  services:
    - "sst-bend"
    - "4uentes-auth"
    - "sst-fend"
  include_optional_services: false

out_of_scope:
  - "Reopening CR-SST-0084."
  - "Persisting real master keys, JWTs, cookies, or secret plaintext."
  - "sst-extension integration for v1 release closure."
  - "Supporting seed_phrase, mnemonic, recovery_phrase, or equivalent recovery material."

