schema_version: "1.0"
phase: 1
id: "CR-SST-0232"
title: "Define the governed Learning Workspace source contract"
status: "inbox"
created_at: "2026-08-29"
requester: "4uentes"

business_context: >
  The existing /learning surface can preview and accept manually supplied
  text, but it does not expose a governed source inbox or a stable contract for
  importing persisted articles, article documents or agent-processing
  results. The canonical memory, identity-scope and article-processing tracks
  now provide the predecessors needed to define that boundary without
  duplicating their persistence or execution models.

requested_change: >
  Define the cross-repository SourceDescriptor and SourceResolver contract for
  Learning Workspace. The contract must cover manual_text, article,
  article_document and agent_output references; immutable snapshot identity,
  version and content hash; authorization and idempotency; provenance; source
  deletion or staleness; and sanitized failure semantics.

expected_outcome: >
  /learning has one extensible, owner-governed source boundary that can later
  resolve an authorized article or agent output into a reviewable Learning
  snapshot without copying private source blobs through the browser, accepting
  memory automatically or exposing secrets.

initial_scope:
  solution: "sst"
  primary_initiative_id: "INIT-SST-0010"
  control_repository: "4uentes-orchestor"
  future_owner_repositories: ["sst-bend", "sst-fend"]
  predecessor_requests:
    - "CR-SST-0210"
    - "CR-SST-0193"
    - "CR-SST-0194"
    - "CR-SST-0220"
    - "CR-SST-0223"
  source_kinds:
    - "manual_text"
    - "article"
    - "article_document"
    - "agent_output"

constraints:
  - "This inbox reserves identity and supports control-plane planning only."
  - "Do not modify sst-bend, sst-fend, sst-chatbot, 4uentes-auth or infrastructure under this reservation."
  - "Do not create endpoints, migrations, UI behavior, provider calls or runtime adapters under this reservation."
  - "Do not duplicate the DERIVATION_RUN, ARTICLE_PROCESSING_RESULT, ARTICLE_SUMMARY or UserMemoryProposal authority already established by predecessor contracts."
  - "Accepting LearningContext must not accept canonical UserMemory as a side effect."
  - "The browser must not transport or persist private source blobs when a stable owner reference is available."
  - "SecretRef and credentialed source acquisition remain out of scope until a separate security request and threat model are approved."
  - "Jira is a mirror; no create, edit, comment or transition is authorized by this reservation."
  - "Do not expose source content, prompts, secrets, tokens, private URLs or user identifiers in Git, Jira, logs or screenshots."

identity_preflight:
  observed_at: "2026-08-29"
  canonical_ref: "origin/main@2e1049fd88c43686a1d052915eecb2606c0b4c24"
