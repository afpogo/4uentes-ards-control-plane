schema_version: "1.0"
phase: 1
id: "CR-SST-0228"
title: "Migrate shared SST development Secret storage encryption"
status: "inbox"
created_at: "2026-08-28"
requester: "4uentes"

business_context: >
  CR-SST-0221 proved migration, rotation, rollback and identity removal in a
  disposable Kind cluster. The shared SST development cluster remains
  unencrypted at rest and requires a separately governed operational phase.

requested_change: >
  Plan and, only after a later exact authorization, execute a recoverable
  migration of Kubernetes Secret storage in cluster.sst-dev.kind using
  secretbox, external key custody, verified backups, bounded consumer checks
  and removal of identity only after every existing Secret is rewritten.

expected_outcome: >
  The shared development cluster reaches encrypted steady state with a tested
  rollback path, sanitized evidence and no key or Secret value committed or
  emitted.

initial_scope:
  initiative_id: "INIT-SST-0008"
  predecessor_request: "CR-SST-0221"
  control_repository: "4uentes-orchestor"
  infrastructure_owner: "sst-4uentes-infra"
  target_environment: "development"
  target_cluster: "cluster.sst-dev.kind"
  jira_epic_key: "SST-89"

constraints:
  - "This inbox reserves identity and planning only."
  - "No child repository, cluster, Secret, key, datastore, workload or host mutation is authorized."
  - "No Secret value, encryption key, raw etcd payload, decrypted manifest or backup content may enter Git, Jira, logs or evidence."
  - "Backup destination, restore proof, key custodian, outage window and rollback thresholds must be explicit before execution."
  - "Shared-cluster mutation requires a later enumerated authorization published and read back before execution."
  - "Jira remains a mirror; no Jira write is authorized."

