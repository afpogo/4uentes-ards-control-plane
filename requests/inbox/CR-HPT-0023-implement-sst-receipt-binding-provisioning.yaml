schema_version: "1.0"
phase: 1
id: "CR-HPT-0023"
title: "Implement SST receipt-intake binding provisioning"
status: "accepted-for-planning"
created_at: "2026-08-28"
requester: "4uentes"
initiative_id: "INIT-HPT-0003"
source_request_id: "CR-CP-0024"
predecessor_request_ids: [CR-CP-0024]
business_context: >
  SST must issue, inspect, rotate and revoke opaque receipt-intake bindings
  from its authoritative account and membership context before Automation can
  upload a document against a governed account boundary.
requested_outcomes:
  - "Expose owner-only GET, POST, rotate and DELETE binding operations under /4uentes/v1/integrations/receipt-intake/binding."
  - "Maintain one active binding per account, with opaque rb_ identifiers, at least 128 bits of entropy and a 90-day lifetime."
  - "Resolve reviewer_membership_ids only from active memberships of the authenticated account."
  - "Publish owner API/capability contracts and an executable sanitized HTTP harness."
constraints:
  - "Never accept accountId, subject or reviewer authority supplied by the caller as authoritative."
  - "Reviewer membership does not grant binding issue, rotate or revoke permission."
  - "Do not modify the active dirty sst-bend worktree or sst-fend."
  - "Do not deploy SST, apply migrations to a shared database or activate Automation."

