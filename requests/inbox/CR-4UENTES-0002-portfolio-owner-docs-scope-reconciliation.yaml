schema_version: "1.0"
phase: 2
id: "CR-4UENTES-0002"
title: "Portfolio owner docs scope reconciliation"
status: "inbox"
created_at: "2026-07-03"
requester: "4uentes"

business_context: >
  CR-4UENTES-0001 established that 4uentes-portfolio belongs to the 4uentes
  solution scope and not to SST. The child repository already carries local
  ARDS/SDD owner documentation, but its control-plane integration notes should
  be reconciled with the new control-plane request and state identifiers.

requested_change: >
  Update 4uentes-portfolio owner ARDS/SDD documentation so it references the
  current control-plane registration, scope partition feature, and non-SST
  request lifecycle without introducing runtime or product-code changes.

expected_outcome: >
  4uentes-portfolio owner docs remain the authority for portfolio-local scope
  while 4uentes-orchestor remains the authority for catalog, solution scope,
  requests, state, and evidence.

initial_scope:
  solution: "4uentes"
  services:
    - "4uentes-portfolio"
  include_optional_services: false

impact_analysis:
  required: true
  affected_services:
    - "4uentes-portfolio"
  affected_ards:
    - "child-repo-owner-docs"
    - "control-plane-registration"
    - "scope-partition"
  capabilities:
    - "multi-solution-scope-partition"
  risks:
    - "Child repo owner docs drift from control-plane scope partition."
    - "Local workstation paths leak into stable owner documentation."

required_context:
  - "4uentes-portfolio: AGENTS.md"
  - "4uentes-portfolio: specs/00-index.yaml"
  - "4uentes-portfolio: docs/00-overview.md"
  - "4uentes-portfolio: docs/integration/4uentes-control-plane.md"
  - "requests/planned/CR-4UENTES-0001-portfolio-scope-partition-onboarding.yaml"
  - "state/features/multi-solution-scope-partition.current.yaml"

required_checks:
  - "4uentes-portfolio: npm run build"
  - "4uentes-orchestor: npm.cmd run check"

risk:
  level: "medium"
  score: 5
  drivers:
    - "child repo mutation"
    - "owner documentation authority"
    - "non-SST scope boundary"

execution:
  requires_human_approval: false
  allowed_window: "manual"
  branch_strategy: "one-branch-per-repo"
  child_repo_mutation_allowed: true

owner_documentation:
  required: true
  status: planned
  owner_repo: "4uentes-portfolio"
  planned_owner_docs:
    - "docs/integration/4uentes-control-plane.md"
    - "specs/ards/contract-binding.yaml"
  control_plane_evidence_refs:
    - "evidence/requests/CR-4UENTES-0002/owner-docs-reconciliation.md"

validation:
  required_checks:
    - "4uentes-portfolio: npm run build"
    - "4uentes-orchestor: npm.cmd run check"
  evidence_required:
    - "owner_docs_reconciliation"
    - "validation_results"
    - "changed_files_summary"

decision:
  status: "pending"
  approver: "TODO"
