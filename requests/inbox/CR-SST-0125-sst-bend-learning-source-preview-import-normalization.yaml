id: "CR-SST-0125"
title: "Implement sst-bend LearningWorkspace source preview/import normalization"
created_at: "2026-07-10"
requester: "4uentes"
summary: >
  Continue INIT-SST-0001 / SST-6 after SST-53 closure by implementing the
  backend preview/import normalization slice in sst-bend. The existing
  LearningWorkspace preview endpoint must process bounded learning sources
  beyond raw sourceText, preserving preview-only behavior and warning-first
  validation.

context:
  initiative_id: "INIT-SST-0001"
  parent_jira_issue_key: "SST-6"
  preceding_requests:
    - "CR-SST-0089"
    - "CR-SST-0092"
    - "CR-SST-0123"
    - "CR-SST-0124"
  feature_state: "learning-content-tags"

requested_outcome:
  - "Keep using POST /learning-workspaces/sources/preview as the backend surface."
  - "Normalize CourseSource/WebArticleSource/manual text inputs into previewable sourceText/materialized blocks."
  - "Return warnings for unsupported selectors, excluded/generated paths and missing assets."
  - "Preserve persistenceMode=preview-only and persisted=false for preview."
  - "Do not create TagDefinition records automatically."
  - "Update sst-bend owner ARDS/SDD docs/specs and control-plane evidence."

boundaries:
  - "No sst-fend UI changes in this CR."
  - "No node-auth mutation unless BFF verification proves passthrough blocks the contract."
  - "No crawler, mass scraping, automatic publish or database persistence during preview."
  - "Jira remains an operational mirror; ARDS/SDD remains source of truth."
