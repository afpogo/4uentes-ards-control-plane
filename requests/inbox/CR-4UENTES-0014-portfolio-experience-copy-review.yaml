schema_version: "1.0"
phase: 2
id: "CR-4UENTES-0014"
title: "Portfolio experience copy review"
status: "inbox"
created_at: "2026-07-04"
requester: "4uentes"

summary: >
  Review visible professional experience copy in 4uentes-portfolio after policy
  adoption, keeping the portfolio employment-first and avoiding unsupported
  claims, contact exposure changes, or GitHub enrichment.

initial_scope:
  solution: "4uentes"
  services:
    - "4uentes-portfolio"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-PORTFOLIO-0001"
  parent_request_id: "CR-4UENTES-0013"
  feature_id: "portfolio-experience-copy-review"
  child_repo: "4uentes-portfolio"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-portfolio"
      via: "visible professional profile and experience copy plus owner docs"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
    - "professional-experience"
    - "publication-readiness"
    - "owner-documentation"
  capabilities:
    - "portfolio-experience-copy-review"

required_context:
  - "requests/planned/CR-4UENTES-0013-portfolio-child-policy-adoption.yaml"
  - "4uentes-portfolio: docs/portfolio-intent.md"
  - "4uentes-portfolio: docs/evidence/README.md"
  - "4uentes-portfolio: specs/features/00-index.yaml"
  - "4uentes-portfolio: src/pages/Dashboard/screens/Me/Me.i18n.ts"
  - "4uentes-portfolio: src/pages/Dashboard/screens/Experience/"

execution:
  requires_human_approval: false
  allowed_window: "manual"
  branch_strategy: "child-repo-small-ui-content-cut"
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
    service_id: "4uentes-portfolio"
  owner_documentation_required: true
  implementation_boundary: >
    Mutate visible profile/experience copy and matching owner docs only. Do not
    change contact exposure, project evidence labels, GitHub enrichment, runtime
    architecture, deployment, or assets.

owner_documentation:
  required: true
  status: planned
  owner_repo: "4uentes-portfolio"
  planned_owner_docs:
    - "docs/portfolio-intent.md"
    - "docs/evidence/README.md"
    - "specs/features/00-index.yaml"

validation:
  required_checks:
    - "4uentes-portfolio: npm.cmd run check"
    - "4uentes-orchestor: npm.cmd run check"
  evidence_required:
    - "experience_copy_review"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: "approved-for-local-execution"
  approver: "4uentes"
  blocker: "none"
