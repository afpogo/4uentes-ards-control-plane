schema_version: "1.0"
phase: 2
id: "CR-SST-0196"
title: "Adopt SST user memory review, correction and export UX"
status: "inbox"
created_at: "2026-08-17"
requester: "4uentes"
business_context: >
  Private inferred memory requires visible user controls before it can become a
  trusted product capability.
requested_change: >
  Add BFF and frontend flows to review proposals, inspect provenance, accept,
  reject, correct, archive or delete visible memory and request an export.
expected_outcome: >
  The user can understand and control what SST remembers without exposing
  tokens or persisting private memory in Redux Persist.
initial_scope:
  solution: "sst"
  services: ["sst-fend", "4uentes-auth", "sst-bend"]
constraints:
  - "Execution requires later explicit child-repository approval."
  - "Do not persist memory content in browser persistent storage."
  - "Do not bypass sst-bend authorization through the BFF."
decision:
  status: "approved-for-planning"
  approver: "4uentes"
  decided_at: "2026-08-17"
