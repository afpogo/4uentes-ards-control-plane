schema_version: "1.0"
phase: 2
id: "CR-4UENTES-0012"
title: "Portfolio project evidence labels"
status: "inbox"
created_at: "2026-07-04"
requester: "4uentes"

summary: >
  Apply the adopted evidence taxonomy to visible portfolio projects without
  rewriting experience copy, changing contact exposure, or running GitHub
  enrichment.

initial_scope:
  solution: "4uentes"
  services:
    - "4uentes-portfolio"
  include_optional_services: false

control_plane_context:
  initiative_id: "INIT-PORTFOLIO-0001"
  parent_request_id: "CR-4UENTES-0011"
  feature_id: "portfolio-project-evidence-labels"
  child_repo: "4uentes-portfolio"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-portfolio"
      via: "project metadata, visible project labels, and owner docs"
      service_kind: "frontend-spa"
      ards_kind: "frontend-web"
      status: "active"
  affected_ards:
    - "project-evidence"
    - "evidence-taxonomy"
    - "publication-readiness"
  capabilities:
    - "portfolio-project-evidence-labels"

required_context:
  - "requests/planned/CR-4UENTES-0011-portfolio-owner-docs-evidence-taxonomy-adoption.yaml"
  - "4uentes-portfolio: docs/evidence/README.md"
  - "4uentes-portfolio: specs/features/00-index.yaml"
  - "4uentes-portfolio: src/pages/Dashboard/screens/Projects/constants.ts"

execution:
  requires_human_approval: false
  allowed_window: "manual"
  branch_strategy: "child-repo-small-ui-content-cut"
  child_repo_mutation_allowed: true
  child_repo_mutation_target:
    service_id: "4uentes-portfolio"
  owner_documentation_required: true
  implementation_boundary: >
    Add project evidence metadata and a small visible project evidence label.
    Do not rewrite experience copy, change contact data, add GitHub runtime
    fetching, run MCP GitHub review, or create service claims.

owner_documentation:
  required: true
  status: planned
  owner_repo: "4uentes-portfolio"
  planned_owner_docs:
    - "docs/evidence/README.md"
    - "specs/features/00-index.yaml"

validation:
  required_checks:
    - "4uentes-portfolio: npm.cmd run check"
    - "4uentes-orchestor: npm.cmd run check"
  evidence_required:
    - "project_evidence_labels"
    - "changed_files_summary"
    - "validation_results"

decision:
  status: "approved-for-local-execution"
  approver: "4uentes"
  blocker: "none"
