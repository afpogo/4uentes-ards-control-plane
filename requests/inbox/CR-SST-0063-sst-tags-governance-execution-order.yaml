schema_version: "1.0"
phase: 2
id: "CR-SST-0063"
title: "Define SST tags governance execution order"
status: "inbox"
created_at: "2026-06-11"
requester: "4uentes"

business_context: >
  SST tags governance is a core platform capability. The current Jira radar
  shows multiple related tickets in progress, and execution must avoid
  dependency inversions between global tag governance, dictionary tags,
  article tags, prefix parsing, learning content, and future resource types
  such as bitacoras.

requested_change: >
  Define an auditable execution order for the related Jira tickets and close
  historical CR references that are already provenance/evidence-only.

expected_outcome: >
  The control-plane can select the next tag governance work item by dependency
  order rather than by Jira issue number alone. Historical CRs referenced by
  the active tags tickets are either closed or explicitly carried as active
  implementation work.

initial_scope:
  solution: "sst"
  services:
    - "control-plane"
  include_optional_services: false

impact_analysis:
  required: true
  affected_services:
    - "control-plane"
  affected_ards:
    - "sst-tags-governance"
    - "dictionary-tags"
    - "article-tags"
    - "sst-tag-prefix-engine"
    - "learning-content-tags"
  capabilities:
    - "sst-tags-governance"
    - "dictionary-domain-management-v1"
    - "article-tags"
    - "sst-tag-prefix-engine"
    - "learning-content-tags"
  risks:
    - "Executing article or learning-content work before global tag semantics are closed."
    - "Treating Jira status as canonical ARDS/SDD state."
    - "Closing historical CRs without preserving provenance."

required_context:
  - "evidence/requests/CR-SST-0062/unified-jira-radar-live.md"
  - "state/features/sst-tags-governance.current.yaml"
  - "state/features/dictionary-tags.current.yaml"
  - "state/features/sst-tag-prefix-engine.current.yaml"
  - "state/features/learning-content-tags.current.yaml"
  - "evidence/requests/CR-SST-0014/implementation-state-analysis.md"
  - "evidence/requests/CR-SST-0016/backend-poc-summary.md"
  - "requests/planned/CR-SST-0060-sst-tags-governance-article-tags-runtime-gap-closure.yaml"

required_checks:
  - "npm.cmd run check"

risk:
  level: "high"
  score: 8
  drivers:
    - "MULTI_TICKET_DEPENDENCY_ORDER"
    - "CROSS_REPO_FUTURE_IMPLEMENTATION"
    - "CORE_PLATFORM_CAPABILITY"

task_weight:
  classification: "complex-high-risk-task"
  risk_level: "high"
  drivers:
    - "multiple active Jira tickets"
    - "global data model and governance dependency"
    - "future cross-repo implementation gates"

model_selection:
  policy_ref: "docs/ai/model-selection-policy.md"
  primary_profile: "gpt-5.5"
  fallback_profile: "highest-available-reasoning-profile"
  reason: "The order affects core tag governance and future cross-repo implementation."

subagent_deployment_plan:
  required: true
  roles:
    - "ards-sdd-validator"
    - "dependency-planner"
  parallelizable: true
  fallback: "Subagent tool policy requires explicit user request for delegation; the main agent executes sequentially and records the fallback."
  evidence_required: true

execution:
  requires_human_approval: true
  allowed_window: "manual"
  branch_strategy: "control-plane-only"
  jira_write_authorized: false

validation:
  required_checks:
    - "npm.cmd run check"
  evidence_required:
    - "execution_order"
    - "historical_cr_closure"
    - "changed_files_summary"

decision:
  status: "approved-for-control-plane-planning"
  approver: "4uentes"
  approved_at: "2026-06-11"
  note: "User requested dependency-safe execution ordering for SST tags governance."
