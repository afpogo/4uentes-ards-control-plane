business_context: >
  Child repositories governed by 4uentes-orchestor must understand the
  orchestrator_link contract, capability-state linkage, human documentation
  language policy, and documentation information architecture so work started
  outside the orchestrator can still be reconciled into feature_state or
  bugfix_state.

implemented_change: >
  Added local ARDS/SDD documentation rules to each cataloged child repository
  and marked the orchestrator link contract as adopted in the control-plane
  catalog.

