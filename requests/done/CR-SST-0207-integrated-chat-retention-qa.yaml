qa_scope:
  target_environment: "development"
  surfaces: ["localhost", "reserved-ngrok"]
  routing_rule: "Retention HTTP uses sst-fend -> 4uentes-auth -> sst-bend; only Socket.IO may use the direct browser-to-Bend exception."
  evidence_rule: "Use synthetic identities and preserve no password, token, cookie, message body, Redis credential or private URL."
  rollback: "Delete synthetic test data only through the product contract; do not mutate backing stores directly."

qa_matrix:
  - id: "facade-routing"
    expected: "Every retention HTTP operation traverses the approved Auth facade."
  - id: "temporary-multi-session-ttl"
    expected: "Two active sessions share turns; logout, a future session and TTL expiry cannot recover temporary history."
  - id: "saved-durability"
    expected: "Explicit promotion survives logout, Redis eviction and a second device or session."
  - id: "cache-aside"
    expected: "First durable read after eviction misses to PostgreSQL; the next read hits Redis without changing authority."
  - id: "clear-local"
    expected: "Browser state clears while saved history remains recoverable on demand."
  - id: "finish-temporary"
    expected: "Volatile data disappears and active sessions receive the terminal event."
  - id: "delete-from-sst"
    expected: "PostgreSQL row and Redis cache disappear and a race cannot resurrect them."
  - id: "cross-principal-isolation"
    expected: "A second principal cannot enumerate, read, promote or delete another user's conversations."

