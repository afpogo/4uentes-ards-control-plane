source_request: "requests/inbox/CR-SST-0030-sst-user-internal-memory-boundary.yaml"
planned_request: "requests/planned/CR-SST-0030-sst-user-internal-memory-boundary.yaml"

implemented_change: >
  Corrected the conceptual model by separating project ARDS/SDD from SST user
  internal memory. Project ARDS/SDD remains the file-based lifecycle memory of a
  repository or project. SST user internal memory is the product runtime memory
  that records user events, facts, intentions, chatbot interactions, and
  agent-assisted recall inside SST.

