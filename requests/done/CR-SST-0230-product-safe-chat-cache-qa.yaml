contract:
  bend_route: "GET /4uentes/v1/chat/conversations/:id/messages"
  auth_route: "GET /api/chat/conversations/:id/messages"
  response_header: "X-SST-Chat-History-Cache"
  allowed_values: ["hit", "miss", "bypass"]
  emission_scope: "successful 200 history responses only"
  combined_precedence: "bypass over miss over hit"
  body_or_status_change: "forbidden"
  request_scoped_observation_required: true
  mutable_global_last_outcome_forbidden: true
  postgres_authority_preserved: true
  redis_fail_open_preserved: true
  auth_behavior: "Forward exactly one valid enum only; drop absent, repeated, malformed, unknown or unrelated upstream metadata."

