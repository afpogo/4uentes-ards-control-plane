summary: >
  Published and read back the disabled-by-default SST-to-Phinance proxy, its
  bounded trust boundary, owner documentation and integrated account-isolation
  QA without activating an environment or changing secrets or infrastructure.

execution:
  owner_repo: "sst-bend"
  owner_base: "origin/develop@8e2eeb3"
  published_owner_commit: "b1ead8635347f8a32c8c8cf9424782ec4544f34f"
  owner_merge_commit: "845491b20809403ef6146370493ff6b0c7456d6a"
  owner_pull_request: "https://github.com/afpogo/sst-bend/pull/26"
  child_repo_mutation_allowed: true
  auth_and_phinance_usage: "read-only contract and integration QA"
  deployment_activation_allowed: false
  infrastructure_changes_allowed: false
  secret_value_changes_allowed: false
  jira_write_allowed: false
  phinance_proxy_default: false

implemented_slice:
  activation_gate:
    environment: "PHINANCE_PROXY_ENABLED"
    default: false
    disabled_behavior: "503 PHINANCE_FACADE_UNAVAILABLE without upstream invocation"
  trusted_forwarding:
    service_grant: "sst-bend -> phinance-api / finance:invoke"
    stable_subject: "verified browser JWT sub"
    account: "active SST membership"
    entitlements: "owner read/write/audit-read; member read-only"
    trace_authority: "server-generated request and correlation UUIDs"
    browser_authorization_forwarded: false
    browser_trusted_headers_forwarded: false
  http_boundary:
    allowed_methods: ["GET", "POST"]
    allowed_path_prefix: "/api/v1"
    automatic_write_retries: false
    redirects: "rejected"
    maximum_response_bytes: 5242880
    timeout: "bounded across token acquisition, request and response body"

