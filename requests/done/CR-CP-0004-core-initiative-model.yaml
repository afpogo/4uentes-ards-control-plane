  - "docs/requests/initiative-model.md"
  - "initiatives/00-index.yaml"
  - "scripts/verify-initiatives.js"
  - "evidence/requests/CR-CP-0004/ards-5-context-summary.md"
  - "evidence/requests/CR-CP-0004/initiative-model-core-mapping.md"
  - "evidence/requests/CR-CP-0004/core-promotion-handoff.md"
  - "evidence/requests/CR-CP-0004/control-plane-core-resync.md"

risk:
  level: "medium"
  score: 6
  drivers:
    - "Jira Epic must remain mirror, not source of truth"
    - "core model must not import local initiative IDs or evidence"
    - "Initiative/Epic hierarchy mistakes can create misleading Jira mirrors"

execution:
  requires_human_approval: true
  human_approval_ref: "user message 2026-07-10: continuar con ARDS-5"
  allowed_window: "manual"
  branch_strategy: "separate-core-promotion-branch"
  child_repo_mutation_allowed: false
  core_repo_mutation_allowed: true
  implementation_boundary: >
    Promote Initiative shape, statuses, template, and Jira mirror boundary in
    core. Keep concrete INIT files local to the orchestrator and keep Jira as
    an operational mirror.

jira:
  role: "mirror"
  source_of_truth: false
  project_key: "ARDS"
  mirror_project_key: "ARDS"
  epic_key: "ARDS-1"
  related_epic_key: "SST-36"
  issue_key: "ARDS-5"
  desired_status: "Listo"
  current_status_observed: "Listo"
  write_status: "executed"
  sync_ref: "evidence/requests/CR-CP-0004/jira-ards-5-close-transition-summary.md"

resource_classification:
