  parent_initiative_id: "INIT-CP-0001"
  related_jira_epic_key: "SST-36"
  target_jira_epic_key: "ARDS-1"
  jira_issue_key: "ARDS-5"
  jira_status_observed: "Listo"
  jira_closure_comment_observed_at: "2026-07-10"
  local_closure_ref: "evidence/requests/CR-CP-0004/closure-summary.md"

impact_analysis:
  required: true
  affected_services:
    - service_id: "4uentes-orchestor"
      via: "local initiative model source and validator"
      service_kind: "control-plane"
      ards_kind: "control-plane"
      status: "active"
    - service_id: "4uentes-ards-core"
      via: "promoted core initiative model/template"
      service_kind: "ards-standard-source"
      ards_kind: "control-plane"
      status: "active"
  affected_ards:
    - "initiative"
    - "request-lifecycle"
    - "jira-mirror"

required_context:
