summary: >
  Promoted the Jira/Confluence MCP endpoint pattern to a living ARDS/SDD
  control-plane policy. The policy defines /v1/mcp as the operational endpoint
  through JIRA_MCP_ARGS, treats authv2 as historical/auth-diagnostic surface,
  and records that Jira/Confluence synchronization does not propagate to child
  repositories.

