objective: >
  Govern the construction of sst-extension as a first-class SST browser
  extension surface for authenticated user workflows, private session capture,
  content acquisition, Dictionary/LearningWorkspace handoff, and browser-side
  QA evidence.
initial_hypothesis: >
  sst-extension needs its own Initiative/Epic because extension work crosses
  browser permissions, authenticated tabs, private content capture, queueing,
  node-auth handoff, DictionarySecret adjacency, and LearningWorkspace inputs.
  Each executable change must still be delivered through scoped CRs.
