title: "SST Auth Access UI Resilience and Rebranding"
status: "active"
updated_at: "2026-08-04"
owner_repository: "4uentes-orchestor"
objective: >
  Restore structurally safe and accessible signin and signup surfaces, complete
  the signup visual rebranding, and make auth UI adoption auditable without
  changing authentication, session, RBAC, API or legal contracts.
initial_hypothesis: >
  The current auth access UI needs one Initiative because the visible failures
  span the guest-header signin popover, the dedicated signup shell, shared form
  primitives, owner documentation, visual QA and an existing Jira Epic whose
  backlog has not yet been reconciled into the ARDS/SDD control plane.
