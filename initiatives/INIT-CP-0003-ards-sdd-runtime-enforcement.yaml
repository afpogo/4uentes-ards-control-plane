    Start with local control-plane runtime enforcement artifacts and validators.
    Core promotion and child repo rollout require separate CRs.
policy_application:
  model_selection: >
    Work is complex-high-risk because it introduces enforcement runtime behavior
    for policies and living resources.
  atomization: >
    Runtime MVP is split into binding, control model, policy validators, audit
    capsule, and rollout CRs so each piece remains independently reviewable.
  architecture_boundary: >
    The runtime must not become autonomous authority. It audits, gates, records
    evidence, and proposes follow-up work under Control Plane governance.
