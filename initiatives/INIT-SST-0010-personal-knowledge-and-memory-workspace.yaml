    CR-SST-0223 done lifecycle is merged and read back. CR-SST-0224 now has
    canonical owner/Jira preflights and a locally prepared running lifecycle,
    but no sst-chatbot or Jira mutation is authorized. CR-SST-0234 now has a
    merged Bend implementation from PR 33:
    owner-scoped source resolution, immutable snapshot persistence, reversible
    schema, contracts, maps and tests are green. Image
    `develop-fdc753ff0bf9` and Infra commit `c158877` were published and their
    pipelines passed; live workload and migration readback remain pending.
