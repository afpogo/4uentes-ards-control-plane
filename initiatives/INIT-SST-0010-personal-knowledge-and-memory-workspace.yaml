id: "INIT-SST-0010"
title: "SST Personal Knowledge and Memory Workspace V1"
status: "active"
updated_at: "2026-08-28"
owner_repository: "4uentes-orchestor"
objective: >
  Deliver the first governed SST personal knowledge and user-memory workspace:
  canonical private memory in sst-bend, proposal and recall integration in
  sst-chatbot, a portable ARDS-inspired projection, user review controls,
  capability-scoped robot views and end-to-end evidence across sessions.
initial_hypothesis: >
  SST can preserve the original product intention of a tag-governed personal
  knowledge base without cloning project ARDS/SDD per user by separating the
  canonical structured memory model from optional physical, downloadable and
  device-replicated workspace projections.
