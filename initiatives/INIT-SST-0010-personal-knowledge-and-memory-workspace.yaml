success_scenario: >
  An authenticated user asks SST to remember an engineering intention. The
  backend persists the event, validates the chatbot proposal, stores the
  accepted intention, exposes an optional portable workspace projection, and
  a later conversation recalls it with scope, provenance and user controls.
closure_gate: >
  INIT-SST-0010 remains planned or active until CR-SST-0198 proves durable
  cross-session recall, restart recovery, scope isolation, user review,
  portable projection integrity and owner-repository validation, or records an
  explicitly approved residual.
