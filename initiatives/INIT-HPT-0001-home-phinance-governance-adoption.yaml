id: "INIT-HPT-0001"
title: "Home Phinance Ticket Governance Adoption"
status: "active"
updated_at: "2026-07-12"
owner_repository: "4uentes-orchestor"
objective: >
  Onboard the finanzas-personales monorepo into the 4uentes ARDS/SDD
  control-plane, adopt the current core governance contract in its frontend and
  backend service roots, and make the frontend-backend boundary explicit before
  product runtime implementation.
initial_hypothesis: >
  The repository already contains separate frontend-web and backend-api ARDS
  surfaces, but lacks stable control-plane identities, policy manifests,
  control-plane linkage, executable validation, and an explicit architecture
  exception for direct backend API consumption.
