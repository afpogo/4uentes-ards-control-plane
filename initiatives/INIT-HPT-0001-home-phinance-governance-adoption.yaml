policy_application:
  owner_documentation_enforcement: >
    Every child-repo mutation CR must update the owner ARDS/SDD surfaces in the
    affected frontend or backend service root, or record an approved exception.
  jira_boundary: >
    Jira is an operational mirror. The Initiative, CR lifecycle, decisions and
    evidence remain authoritative in 4uentes-orchestor.
  architecture_boundary: >
    Onboarding does not approve auth, RBAC, financial advice, sensitive-data,
    BFF, OCR, AI-provider or production deployment decisions.
  atomization: >
    Catalog onboarding, child governance adoption and integration-boundary
    reconciliation remain separate CRs with independent validation.
