boundaries:
  mutates_child_repositories: false
  promotes_runtime: false
  changes_core_canon: false
  belongs_to_sst: false
  sensitive_financial_documents: true
policy_application:
  architecture_boundary: >
    This Initiative preserves intent and constraints only. It does not choose
    upload transport, storage, OCR engine, AI provider, queue, database schema,
    retention, mobile UX or deployment topology.
  owner_documentation: >
    Future producer contracts belong in finanzas-personales/backend. Future
    camera, upload and review UX contracts belong in the applicable SST owner.
  human_confirmation: >
    Extraction and validation produce proposals. No transaction, resource or
    accounting fact is materialized without explicit user confirmation.
  atomization: >
    Control-plane registration, backend owner adoption, runtime, SST capture
    adoption and end-to-end validation remain separate requests.
open_gaps:
  - "Implement the approved Python/FastAPI API runtime baseline under CR-HPT-0012 before document-intake owner adoption or implementation."
  - "Define image storage, encryption, retention, deletion and access controls."
  - "Choose provider-agnostic OCR/extraction interfaces and permitted providers."
  - "Define supported document types, jurisdictions and deterministic validation rules."
  - "Define duplicate detection, review corrections and idempotent ledger materialization."
  - "Resolve the trusted SST principal context and mobile capture boundary."
