schema_version: "1.0"
kind: "initiative"
id: "INIT-HPT-0003"
title: "Financial Document Intake and Assisted Accounting"
status: "hypothesis"
updated_at: "2026-08-22"
owner_repository: "4uentes-orchestor"
objective: >
  Preserve and govern the future capability for receiving a financial-document
  photo from SST, detecting its type, extracting candidate values, validating
  them and presenting a human review before any confirmed financial data enters
  Phinance.
initial_hypothesis: >
  Mobile document capture can make Phinance distinctive if extraction remains
  proposal-only, every field carries confidence and provenance, deterministic
  validations are separated from external verification, and explicit user
  confirmation is required before ledger materialization.
