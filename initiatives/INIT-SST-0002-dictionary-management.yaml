objective: >
  Govern the SST Dictionary as a product capability family, keeping legacy
  dictionary read, dictionary tags, dictionary governance, and dictionary secret
  management aligned across ARDS/SDD, Jira visibility, backend, BFF, and
  frontend surfaces.
