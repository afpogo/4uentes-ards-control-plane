id: "INIT-SST-0004"
title: "SST Infrastructure Production Readiness"
status: "active"
updated_at: "2026-08-10"
owner_repository: "4uentes-orchestor"
objective: >
  Govern the SST infrastructure hardening path from the current local
  development GitOps cluster toward production-ready operation, covering image
  provenance, secret handling, backup/restore, staging, observability, RBAC,
  release promotion, rollback, and public endpoint readiness.
initial_hypothesis: >
  SST infrastructure already has a functional local GitOps development baseline:
  Argo CD reconciles `sst-app`, the app endpoint responds through the durable
  local Ingress, and core workloads are running. The next production-readiness
  phase should group infrastructure work under one Initiative/Epic while each
  executable change remains scoped to explicit CRs with validation evidence.
