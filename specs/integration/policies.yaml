  - id: "agent-architecture-boundary-policy"
    name: "Agent Architecture Boundary Policy"
    type: "agent-operating-policy"
    policy_class: "core-general"
    origin_repo: "4uentes-ards-core"
    canonical_owner: "4uentes-ards-core"
    applicability: "all ARDS/SDD repos that use agentic execution or ARDS/SDD governance"
    adoption_mode: "inherited-or-manifest"
    required_for_profiles:
      - "all"
    optional_for_profiles: []
    template_binding: null
    local_aliases: []
    status: "active"
    scope:
      - "architecture-boundary"
      - "ownership-boundary"
      - "sensitive-contracts"
    owner: "4uentes-ards-control-plane"
    human_doc: "docs/policies/agent-architecture-boundary-policy.md"
    enforcement:
