      - "fast-model-guardrails"
      - "output-verification"
    owner: "4uentes-ards-control-plane"
    human_doc: "docs/policies/agent-delegation-policy.md"
    enforcement:
      expected: "Delegate only bounded, defined-context, low or controlled-risk work with verifiable output; do not delegate sensitive architecture or security decisions to fast models."
      mode: "operational-review"
      failure_behavior: "keep-in-main-agent-or-escalate-profile"
    evidence:
      - "docs/policies/agent-delegation-policy.md"
    gaps:
