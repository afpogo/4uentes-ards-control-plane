schema_version: "1.0"
kind: "ards_sdd_agent_policy_registry"
status: "active"
updated_at: "2026-08-23"
purpose: >
  Machine-readable registry for living ARDS/SDD policies adopted by the
  control-plane. It records local agent operating policies plus scoped
  core-owned policy adoptions without replacing functional contracts,
  capabilities, requests, handoffs, or repo ownership.

standard_source:
  repo: "4uentes-ards-core"
  adoption_status: "adopted-in-core"
  note: >
    The control-plane consumes the core-owned ARDS/SDD policy registry and
    records local adoption plus scoped rollout evidence for SST child repos.

provider_model:
  provider_agnostic: false
  provider_scope: "codex"
  model_names_are_aliases: true
  alias_resolution: "environment-configured"
  resource_signal:
    allowed_levels:
      - "very-low"
      - "low"
      - "normal"
      - "high"
    default_level: "normal"
    allowed_sources:
      - "default"
      - "manual"
      - "runtime"
    runtime_source_status: "planned-under-INIT-CP-0003-ARDS-13"
  fallback_rule: >
    Treat unavailable GPT-5.6 Sol capacity as resource degradation, record the
    effective resource level, and apply the corresponding routing row. Never
    silently downgrade sensitive work.
  aliases:
    normal_and_high_resources: "gpt-5.6-sol"
    fast_verifiable_task: "gpt-5.3-spark"
    long_context_task: "gpt-5.4-fast-high"
    high_reasoning_task: "gpt-5.5"
  selection_matrix:
    high:
      short_defined_task: {model: "gpt-5.6-sol", reasoning_effort: "high"}
      long_context_task: {model: "gpt-5.6-sol", reasoning_effort: "high"}
      complex_high_risk_task: {model: "gpt-5.6-sol", reasoning_effort: "max"}
    normal:
      short_defined_task: {model: "gpt-5.6-sol", reasoning_effort: "low"}
      long_context_task: {model: "gpt-5.6-sol", reasoning_effort: "high"}
      complex_high_risk_task: {model: "gpt-5.6-sol", reasoning_effort: "max"}
    low:
      short_defined_task: {model: "gpt-5.3-spark", reasoning_effort: "low"}
      long_context_task: {model: "gpt-5.4-fast-high", reasoning_effort: "high"}
      complex_high_risk_task: {model: "gpt-5.5", reasoning_effort: "high"}
    very-low:
      short_defined_task: {model: "gpt-5.3-spark", reasoning_effort: "low"}
      long_context_task: {action: "atomize-reduce-or-block"}
      complex_high_risk_task: {action: "block"}

adoption_defaults:
  owner: "4uentes-ards-control-plane"
  source_repo: "4uentes-ards-control-plane"
  scope:
    - "agent-operations"
    - "ards-sdd-governance"
  enforcement_expected:
    mode: "operational-review"
    failure_behavior: "record-gap-or-blocker"
  adopted_by:
    - repo: "4uentes-ards-control-plane"
      status: "adopted"
      discovery:
        agents_entrypoint: "AGENTS.md"
        registry: "specs/integration/policies.yaml"
        human_docs: "docs/policies/"
  future_adoption:
    - repo: "4uentes-ards-core"
      status: "adopted-in-core"
      intent: "Canonical ARDS/SDD startup contract now lives in core."
    - domain: "orchestrator-child-repos"
      status: "sst-rollout-complete"
      intent: "The SST child repos were synchronized in CR-SST-0077; broader rollout remains request-driven."

adoption_governance:
  canonical_source: "4uentes-ards-core"
  local_registry_role: >
    The orchestrator records local adoption and rollout state for the policies
    it consumes. It does not redefine the canonical core policy text.
  child_repo_rollout:
    mode: "request-driven"
    policy_scope_rule: >
      Policies are not assumed global only because they are core-owned.
      Adoption must follow each policy's class, applicability, profile
      requirements, and local exception path.
    historical_sst_rollout:
      request_id: "CR-SST-0077"
      status: "closed"
    future_non_sst_rollout:
      request_id: "CR-SST-0081"
      status: "planned"
    required_artifacts:
      - "policy_adoption_manifest"
      - "policy_exception_manifest"
    required_templates:
      - "templates/policy-adoption-manifest.template.yaml"
      - "templates/policy-exception-manifest.template.yaml"
    rule: >
      A child repo rollout may modify only the scoped child repo after an
      approved request and plan. Each rollout must publish either an adoption
      manifest or an exception manifest.

policies:
  - id: "agent-model-selection-policy"
    name: "Agent Model Selection Policy"
    type: "agent-operating-policy"
    policy_class: "core-general"
    origin_repo: "4uentes-ards-core"
    canonical_owner: "4uentes-ards-core"
    applicability: "ARDS/SDD repos that use Codex for agentic execution"
    adoption_mode: "inherited-or-manifest"
    required_for_profiles:
      - "all"
    optional_for_profiles: []
    template_binding: null
    local_aliases: []
    status: "active"
    revision: "2026-07-11-codex-gpt-5.6-resource-extension"
    scope:
      - "model-selection"
      - "subagent-planning"
      - "task-classification"
    owner: "4uentes-ards-control-plane"
    human_doc: "docs/policies/agent-model-selection-policy.md"
    related_docs:
      - "docs/ai/model-selection-policy.md"
    enforcement:
      expected: "For Codex work, classify tasks and resource availability before planning or execution; record provider, resource level/source, model, reasoning effort, fallback, task_weight, and subagent_deployment_plan."
      mode: "operational-review"
      failure_behavior: "record-gap-or-fallback"
    aliases:
      normal_and_high_resources: "gpt-5.6-sol"
      short_defined_task: "gpt-5.3-spark"
      long_context_task: "gpt-5.4-fast-high"
      complex_high_risk_task: "gpt-5.5"
    evidence:
      - "AGENTS.md"
      - "specs/integration/policies.yaml"
      - "docs/policies/agent-model-selection-policy.md"
    gaps:
      - "Automatic resource signal resolution remains planned under INIT-CP-0003 / ARDS-13; normal/default is used until then."
      - "Canonical core promotion is tracked by CR-CP-0016 before child rollout."
      - "Broader child-repo rollout outside the SST solution remains request-driven."
    relates_to:
      - "agent-resource-degradation-policy"
      - "agent-task-atomization-policy"
      - "agent-delegation-policy"
      - "agent-architecture-boundary-policy"

  - id: "agent-resource-degradation-policy"
    name: "Agent Resource Degradation Policy"
    type: "agent-operating-policy"
    policy_class: "core-general"
    origin_repo: "4uentes-ards-core"
    canonical_owner: "4uentes-ards-core"
    applicability: "all ARDS/SDD repos that use agentic execution"
    adoption_mode: "inherited-or-manifest"
    required_for_profiles:
      - "all"
    optional_for_profiles: []
    template_binding: null
    local_aliases: []
    status: "active"
    scope:
      - "resource-degradation"
      - "low-token-strategy"
      - "capacity-fallback"
    owner: "4uentes-ards-control-plane"
    human_doc: "docs/policies/agent-resource-degradation-policy.md"
    enforcement:
      expected: "Reduce scope, atomize tasks, avoid unnecessary global analysis, and declare blockers for critical unsafe work under resource limits."
      mode: "operational-review"
      failure_behavior: "record-blocker-if-critical"
    evidence:
      - "docs/policies/agent-resource-degradation-policy.md"
    gaps:
      - "No automated validator currently enforces resource-degradation decisions."
    relates_to:
      - "agent-context-management-policy"
      - "agent-task-atomization-policy"
      - "agent-model-selection-policy"
      - "agent-architecture-boundary-policy"

  - id: "agent-task-atomization-policy"
    name: "Agent Task Atomization Policy"
    type: "agent-operating-policy"
    policy_class: "core-general"
    origin_repo: "4uentes-ards-core"
    canonical_owner: "4uentes-ards-core"
    applicability: "all ARDS/SDD repos that use agentic execution"
    adoption_mode: "inherited-or-manifest"
    required_for_profiles:
      - "all"
    optional_for_profiles: []
    template_binding: null
    local_aliases: []
    status: "active"
    scope:
      - "task-breakdown"
      - "delegation-readiness"
      - "validation-units"
    owner: "4uentes-ards-control-plane"
    human_doc: "docs/policies/agent-task-atomization-policy.md"
    enforcement:
      expected: "Large tasks should be split into subtasks with objective, inputs, output, files, risk, suggested profile, and validation or DoD."
      mode: "operational-review"
      failure_behavior: "record-gap-or-reduce-scope"
    evidence:
      - "docs/policies/agent-task-atomization-policy.md"
    gaps:
      - "Subtask schema can be promoted to a reusable ARDS/SDD template later."
    relates_to:
      - "agent-delegation-policy"
      - "agent-resource-degradation-policy"
      - "agent-model-selection-policy"

  - id: "agent-delegation-policy"
    name: "Agent Delegation Policy"
    type: "agent-operating-policy"
    policy_class: "core-general"
    origin_repo: "4uentes-ards-core"
    canonical_owner: "4uentes-ards-core"
    applicability: "all ARDS/SDD repos that use agentic execution"
    adoption_mode: "inherited-or-manifest"
    required_for_profiles:
      - "all"
    optional_for_profiles: []
    template_binding: null
    local_aliases: []
    status: "active"
    scope:
