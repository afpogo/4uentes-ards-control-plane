    policy_class: "core-general"
    origin_repo: "4uentes-ards-core"
    canonical_owner: "4uentes-ards-core"
    applicability: "repos participating in cross-repo ownership, capability, or child-repo mutation workflows"
    adoption_mode: "conditional-enforcement"
    required_for_profiles:
      - "control-plane"
      - "child-repo-with-owner-mutation"
    optional_for_profiles:
      - "single-repo-local-only"
    template_binding: null
    local_aliases: []
    status: "active"
    scope:
      - "child-repo-owner-documentation"
      - "cross-repo-capability-ownership"
      - "control-plane-evidence-boundary"
      - "request-closure-gates"
    owner: "4uentes-ards-control-plane"
    human_doc: "docs/policies/owner-documentation-authority-policy.md"
    enforcement:
      expected: "A CR that mutates a child repo must update that repo's owner ARDS/SDD documentation or record an explicit exception before closure; control-plane evidence cannot replace owner docs; `npm.cmd run check` must execute the owner documentation validator before local closure."
      mode: "mandatory-operational-boundary"
      validator: "scripts/verify-owner-documentation.js"
      package_gate: "npm.cmd run check"
      focused_gate: "npm.cmd run check:owner-docs"
      failure_behavior: "block-closure-or-create-approved-follow-up"
    evidence:
      - "docs/policies/owner-documentation-authority-policy.md"
      - "requests/planned/CR-SST-0096-owner-documentation-authority-policy.yaml"
      - "requests/done/CR-SST-0104-owner-documentation-close-gate-validator.yaml"
