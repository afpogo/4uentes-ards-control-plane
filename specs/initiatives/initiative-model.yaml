schema_version: "1.0"
kind: "initiative_model"
status: "active"
updated_at: "2026-07-12"
owner_repository: "4uentes-orchestor"
standardization:
  source_of_truth: "4uentes-ards-core"
  core_promotion_status: "adopted-in-core"
  core_promotion_request: "CR-CP-0004"
  core_ref: "4uentes-ards-core@f07ca6a"
  local_adoption_manifest: "specs/initiatives/initiative-adoption.yaml"
purpose: >
  Define the local control-plane Initiative shape used to group broad outcomes
  that may require multiple change requests and may discover additional change
  requests during execution.
identity:
  pattern: "^INIT-[A-Z]+-[0-9]{4}$"
  first_adopted_id: "INIT-CP-0001"
states:
  canonical:
    - hypothesis
    - planned
    - active
    - blocked
    - done
    - deferred
  terminal:
    - done
    - deferred
required_fields:
  - schema_version
  - kind
  - id
  - title
  - status
  - updated_at
  - objective
  - initial_hypothesis
  - source_evidence_refs
  - known_change_requests
  - tracking
rules:
  - "Initiatives group outcomes; they do not replace CR execution."
  - "Known change requests are expected at planning time."
  - "Discovered change requests may be appended during execution with evidence."
  - "Jira Epic tracking is an operational mirror, not the ARDS/SDD source of truth."
  - "Concrete Initiative IDs, tracker keys, evidence, and request links are owned locally by the adopting repo."
validation:
  command: "npm.cmd run check:initiatives"
