schema_version: "1.0"
kind: "control_plane_index"
repo: "4uentes-ards-control-plane"
status: "active"
standard_source:
  repo: "4uentes-ards-core"
  kind_model: "standard/ARDS_KIND_MODEL_v1.md"
ards:
  contract_binding: "specs/ards/contract-binding.yaml"
catalog:
  services: "catalog/services/*.yaml"
solutions:
  path: "solutions/*.yaml"
environments:
  local:
    example: "environments/local/bindings.local.example.yaml"
    ignored: "environments/local/bindings.local.yaml"
scripts:
  verify_catalog: "scripts/verify-catalog.js"
  verify_local_bindings: "scripts/verify-local-bindings.js"
  verify_state_model: "scripts/verify-state-model.js"
  verify_initiatives: "scripts/verify-initiatives.js"
  plan_change: "scripts/plan-change.js"
request_rules:
  execution_publication: "specs/requests/execution-publication-rule.yaml"
docs:
  overview: "docs/00-overview.md"
  service_catalog: "docs/apps/service-catalog.md"
  solutions_model: "docs/cross-repo/solutions-model.md"
  execution_model: "docs/requests/execution-model.md"
  state_read_model: "docs/requests/state-read-model.md"
  ai_policy: "docs/ai/policy.md"
  agent_policies: "docs/policies/"
requests:
  status: "active"
  path: "requests/"
  inbox: "requests/inbox/"
  planned: "requests/planned/"
  queued: "requests/queued/"
  running: "requests/running/"
  done: "requests/done/"
  rejected: "requests/rejected/"
initiatives:
  status: "active-core-adopted"
  model: "specs/initiatives/initiative-model.yaml"
  index: "initiatives/00-index.yaml"
templates:
  change_request: "templates/change-request.template.yaml"
  human_doc_language_policy: "templates/human-doc-language-policy.template.md"
  policy_adoption_manifest: "templates/policy-adoption-manifest.template.yaml"
  policy_exception_manifest: "templates/policy-exception-manifest.template.yaml"
inventory:
  phase_0: "inventory/phase-0.md"
  gate_0_decision: "inventory/phase-0-decision.md"
states:
  index: "state/00-index.yaml"
  machine: "state/state-machine.yaml"
  capability_links: "state/capability-links.yaml"
  specs: "specs/states/00-index.yaml"
policies:
  index: "specs/policies/00-index.yaml"
  model: "specs/policies/ards-sdd-policy-component-model.yaml"
  policy_links: "state/policy-links.yaml"
  integration_registry: "specs/integration/policies.yaml"
visual_documentation:
  profile: "specs/integration/visual-documentation-as-code-profile.yaml"
  templates: "templates/visual-documentation/"
  validator: "scripts/verify-visual-documentation.js"
  validator_status: "active-local"
capabilities:
  index: "specs/capabilities/00-index.yaml"
  inbound_index: "specs/capabilities/inbound/00-index.yaml"
  outbound_index: "specs/capabilities/outbound/00-index.yaml"
validation:
  check_command: "npm run check"
  check_state_command: "npm run check:state"
  check_initiatives_command: "npm run check:initiatives"
  check_execution_publication_command: "npm run check:execution-publication"
  plan_change_command: "npm run plan:change -- requests/inbox/TODO.yaml"
